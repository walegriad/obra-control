}

/* ============================================================
   VISTA: CONTRATOS
   ============================================================ */
function Contratos({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const contratos = (estado.contratos || []).filter((c) => c.proyectoId === estado.proyectoActivo)
    .sort((a, b) => a.fechaInicio < b.fechaInicio ? 1 : -1);

  const CHIP_CONT = { vigente: 'sano', completado: 'neutro', cancelado: 'excedido' };
  const ETQ_CONT = { vigente: 'Vigente', completado: 'Completado', cancelado: 'Cancelado' };

  const abrirNuevo = () => setForm({ id: null, proveedor: '', titulo: '', montoContrato: '', anticipo: '0', retencion: '0', fechaInicio: E.hoy(), fechaFin: '', estado: 'vigente', avance: 0, notas: '' });

  const guardarContrato = () => {
    if (!form.titulo.trim()) return brindar('El contrato necesita un título.', 'err');
    if (E.num(form.montoContrato) <= 0) return brindar('El monto debe ser mayor a cero.', 'err');
    const c = E.normalizarContrato({ id: form.id || E.uid('co'), proyectoId: estado.proyectoActivo, proveedor: form.proveedor.trim(), titulo: form.titulo.trim(), montoContrato: form.montoContrato, anticipo: form.anticipo, retencion: form.retencion, fechaInicio: form.fechaInicio, fechaFin: form.fechaFin, estado: form.estado, avance: form.avance, notas: form.notas, creado: form.creado });
    accion((s) => ({ ...s, contratos: form.id ? (s.contratos||[]).map((x) => x.id === form.id ? c : x) : (s.contratos||[]).concat([c]) }));
    brindar(form.id ? 'Contrato actualizado.' : 'Contrato creado.', 'ok');
    setForm(null);
  };

  const borrarContrato = (c) => {
    if (!confirm('¿Borrar el contrato "' + c.titulo + '"?')) return;
    accion((s) => ({ ...s, contratos: (s.contratos||[]).filter((x) => x.id !== c.id) }));
    brindar('Contrato eliminado.', 'ok');
  };

  return (
    <div>
      <div className="tarjeta-cab" style={{marginBottom:16}}>
        <h3 style={{fontSize:18}}>Contratos</h3>
        <button className="btn btn-p btn-sm" onClick={abrirNuevo}><Icono n="mas" s={16} />Nuevo contrato</button>
      </div>
      {contratos.length === 0 ? (
        <div className="tarjeta"><Vacio icono="contrato" titulo="Sin contratos" texto="Registra contratos para dar seguimiento al avance y retenciones."
          accion={<button className="btn btn-p" onClick={abrirNuevo}><Icono n="mas" s={16} />Nuevo contrato</button>} /></div>
      ) : (
        <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
          {contratos.map((c) => {
            const montoAnticipo = E.r2(E.num(c.montoContrato) * E.num(c.anticipo) / 100);
            const montoRetencion = E.r2(E.num(c.montoContrato) * E.num(c.retencion) / 100);
            const abonado = E.r2((estado.pagos||[]).filter((p) => p.contratoId === c.id).reduce((s,p) => s + E.num(p.monto), 0));
            const saldoContrato = E.r2(E.num(c.montoContrato) - abonado);
            return (
              <div className="tarjeta" key={c.id}>
                <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start'}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:16}}>{c.titulo}</div>
                    <div className="mini" style={{marginTop:3}}>{c.proveedor || 'Sin proveedor'}</div>
                  </div>
                  <div style={{display:'flex',gap:4,alignItems:'center',flexShrink:0}}>
                    <Chip estado={CHIP_CONT[c.estado]} texto={ETQ_CONT[c.estado]} />
                    <button className="btn-icono" onClick={() => setForm({...c,montoContrato:String(c.montoContrato),anticipo:String(c.anticipo),retencion:String(c.retencion),notas:c.notas||''})}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrarContrato(c)}><Icono n="basura" s={17} /></button>
                  </div>
                </div>
                <div style={{margin:'14px 0 8px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6}}>
                    <span className="tenue">Avance</span><span className="mono" style={{fontWeight:700}}>{c.avance}%</span>
                  </div>
                  <Barra pct={c.avance} estado={c.avance >= 100 ? 'sano' : c.avance >= 75 ? 'alerta' : 'sinPresupuesto'} />
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px',fontSize:13,marginTop:12}}>
                  <div><span className="tenue">Monto: </span><span className="mono" style={{fontWeight:700}}>{dinero(c.montoContrato, true)}</span></div>
                  <div><span className="tenue">Anticipo: </span><span className="mono">{dinero(montoAnticipo, true)} ({c.anticipo}%)</span></div>
                  <div><span className="tenue">Retención: </span><span className="mono">{dinero(montoRetencion, true)} ({c.retencion}%)</span></div>
                  <div><span className="tenue">Periodo: </span><span className="mono">{fFecha(c.fechaInicio)} — {c.fechaFin ? fFecha(c.fechaFin) : '…'}</span></div>
                  <div><span className="tenue">Abonado: </span><span className="mono" style={{fontWeight:700,color:'var(--verde)'}}>{dinero(abonado, true)}</span></div>
                  <div><span className="tenue">Saldo: </span><span className="mono" style={{fontWeight:700,color: saldoContrato > 0 ? 'var(--rojo)' : 'var(--verde)'}}>{dinero(saldoContrato, true)}</span></div>
                </div>
                {c.notas ? <div className="mini tenue" style={{marginTop:10}}>{c.notas}</div> : null}
              </div>
            );
          })}
        </div>
      )}
      {form ? (
        <Modal titulo={form.id ? 'Editar contrato' : 'Nuevo contrato'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarContrato}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Título"><input value={form.titulo} autoFocus placeholder="Ej. Contrato de obra civil" onChange={(e) => setForm({...form,titulo:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Proveedor / Contratista"><CampoProveedor valor={form.proveedor} onChange={(v) => setForm({...form,proveedor:v})} proveedores={estado.proveedores} accion={accion} brindar={brindar} /></Campo>
            <Campo etq="Monto del contrato"><input className="mono" inputMode="decimal" value={form.montoContrato} placeholder="0.00" onChange={(e) => setForm({...form,montoContrato:e.target.value})} /></Campo>
          </div>
          <div className="tres">
            <Campo etq="Anticipo (%)"><input className="mono" inputMode="decimal" value={form.anticipo} onChange={(e) => setForm({...form,anticipo:e.target.value})} /></Campo>
            <Campo etq="Retención (%)"><input className="mono" inputMode="decimal" value={form.retencion} onChange={(e) => setForm({...form,retencion:e.target.value})} /></Campo>
            <Campo etq="Estado"><select value={form.estado} onChange={(e) => setForm({...form,estado:e.target.value})}>{Object.keys(ETQ_CONT).map((k) => <option key={k} value={k}>{ETQ_CONT[k]}</option>)}</select></Campo>
          </div>
          <div className="dos">
            <Campo etq="Fecha inicio"><input type="date" value={form.fechaInicio} onChange={(e) => setForm({...form,fechaInicio:e.target.value})} /></Campo>
            <Campo etq="Fecha fin"><input type="date" value={form.fechaFin||''} onChange={(e) => setForm({...form,fechaFin:e.target.value})} /></Campo>
          </div>
          <Campo etq={'Avance (' + form.avance + '%)'}>
            <input type="range" min="0" max="100" step="5" value={form.avance} onChange={(e) => setForm({...form,avance:Number(e.target.value)})} />
          </Campo>
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: PAGOS (abonos, adelantos, anticipos)
   ============================================================ */
function formPagoVacio() {
  return { id: null, tipo: 'abono', metodo: 'efectivo', referencia: '', monto: '', fecha: E.hoy(), contratoId: '', proveedorId: '', trabajador: '', descripcion: '', notas: '', _esNuevo: true };
}

function Pagos({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [fTipo, setFTipo] = useState('');
  const [fProv, setFProv] = useState('');
  const [fTrab, setFTrab] = useState('');
  const [fCont, setFCont] = useState('');

  const contratosProyecto = (estado.contratos || []).filter((c) => c.proyectoId === estado.proyectoActivo);
  const contMap = {};
  contratosProyecto.forEach((c) => contMap[c.id] = c);

  const pagos = (estado.pagos || []).filter((p) => p.proyectoId === estado.proyectoActivo
    && (!fTipo || p.tipo === fTipo)
    && (!fProv || p.proveedorId === fProv)
    && (!fTrab || p.trabajador === fTrab)
    && (!fCont || p.contratoId === fCont)
  ).sort((a, b) => a.fecha < b.fecha ? 1 : -1);

  const total = E.r2(pagos.reduce((s, p) => s + E.num(p.monto), 0));
  const trabajadores = Array.from(new Set((estado.pagos||[]).filter((p) => p.proyectoId === estado.proyectoActivo && p.trabajador).map((p) => p.trabajador)));
  const provMap = {};
  (estado.proveedores||[]).forEach((p) => provMap[p.id] = p.nombre);

  const guardarPago = () => {
    if (E.num(form.monto) <= 0) return brindar('El monto debe ser mayor a cero.', 'err');
    if (!form.descripcion.trim()) return brindar('Agrega una descripción.', 'err');
    const p = E.normalizarPago({ id: form.id || undefined, proyectoId: estado.proyectoActivo, tipo: form.tipo, metodo: form.metodo, referencia: form.referencia.trim(), monto: form.monto, fecha: form.fecha, contratoId: form.contratoId, proveedorId: form.proveedorId, trabajador: form.trabajador.trim(), descripcion: form.descripcion.trim(), notas: form.notas.trim(), creado: form.creado });
    accion((s) => ({ ...s, pagos: form._esNuevo ? (s.pagos||[]).concat([p]) : (s.pagos||[]).map((x) => x.id === form.id ? p : x) }));
    brindar(form._esNuevo ? 'Pago registrado.' : 'Pago actualizado.', 'ok');
    setForm(null);
  };

  const borrarPago = (p) => {
    if (!confirm('¿Borrar este pago?')) return;
    accion((s) => ({ ...s, pagos: (s.pagos||[]).filter((x) => x.id !== p.id) }));
    brindar('Pago eliminado.', 'ok');
  };

  const CHIP_TIPO = { abono: 'sano', adelanto_material: 'alerta', adelanto_mano_obra: 'alerta', anticipo: 'sinPresupuesto', liquidacion: 'neutro' };
  const etqTipo = (t) => (E.TIPOS_PAGO.find((x) => x.id === t) || { label: t }).label;
  const etqMetodo = (m) => (E.METODOS_PAGO.find((x) => x.id === m) || { label: m }).label;

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Pagos y adelantos</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(formPagoVacio())}><Icono n="mas" s={16} />Registrar pago</button>
        </div>
        <div className="filtros">
          <select value={fTipo} onChange={(e) => setFTipo(e.target.value)}><option value="">Todos los tipos</option>{E.TIPOS_PAGO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <select value={fProv} onChange={(e) => setFProv(e.target.value)}><option value="">Todos los proveedores</option>{(estado.proveedores||[]).map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}</select>
          {contratosProyecto.length > 0 ? <select value={fCont} onChange={(e) => setFCont(e.target.value)}><option value="">Todos los contratos</option>{contratosProyecto.map((c) => <option key={c.id} value={c.id}>{c.titulo}</option>)}</select> : null}
          {trabajadores.length > 0 ? <select value={fTrab} onChange={(e) => setFTrab(e.target.value)}><option value="">Todos los trabajadores</option>{trabajadores.map((t) => <option key={t} value={t}>{t}</option>)}</select> : null}
        </div>
        {pagos.length === 0 ? (
          <Vacio icono="pago" titulo="Sin pagos registrados" texto="Registra abonos, adelantos y anticipos."
            accion={<button className="btn btn-p" onClick={() => setForm(formPagoVacio())}><Icono n="mas" s={16} />Registrar</button>} />
        ) : (
          <React.Fragment>
            <div className="tabla-cont">
              <table>
                <thead><tr><th style={{width:78}}>Fecha</th><th>Descripción</th><th>Contrato</th><th className="cen">Tipo</th><th>Método</th><th>Beneficiario</th><th className="der">Monto</th><th className="der"></th></tr></thead>
                <tbody>
                  {pagos.map((p) => (
                    <tr key={p.id}>
                      <td className="mono" style={{fontSize:13}}>{fFecha(p.fecha)}</td>
                      <td>
                        <div style={{fontWeight:600}}>{p.descripcion}</div>
                        {p.referencia ? <div className="mini">Ref: {p.referencia}</div> : null}
                      </td>
                      <td style={{fontSize:13}}>{contMap[p.contratoId] ? contMap[p.contratoId].titulo : '—'}</td>
                      <td className="cen"><Chip estado={CHIP_TIPO[p.tipo]||'neutro'} texto={etqTipo(p.tipo)} /></td>
                      <td style={{fontSize:13}}>{etqMetodo(p.metodo)}</td>
                      <td style={{fontSize:13}}>{p.trabajador || provMap[p.proveedorId] || '—'}</td>
                      <td className="der mono" style={{fontWeight:700}}>{dinero(p.monto)}</td>
                      <td className="der" style={{whiteSpace:'nowrap'}}>
                        <button className="btn-icono" onClick={() => setForm({...p,monto:String(p.monto),contratoId:p.contratoId||'',referencia:p.referencia||'',trabajador:p.trabajador||'',descripcion:p.descripcion||'',notas:p.notas||'',_esNuevo:false})}><Icono n="lapiz" s={17} /></button>
                        <button className="btn-icono" onClick={() => borrarPago(p)}><Icono n="basura" s={17} /></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 14, borderTop: '2px solid var(--borde-fuerte)' }}>
              <span className="mini">{pagos.length} pago(s)</span>
              <span className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{dinero(total)}</span>
            </div>
          </React.Fragment>
        )}
      </div>
      {form ? (
        <Modal titulo={form._esNuevo ? 'Registrar pago' : 'Editar pago'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarPago}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Descripción"><input value={form.descripcion} autoFocus placeholder="Ej. Abono materiales semana 3" onChange={(e) => setForm({...form,descripcion:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Tipo"><select value={form.tipo} onChange={(e) => setForm({...form,tipo:e.target.value})}>{E.TIPOS_PAGO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></Campo>
            <Campo etq="Método"><select value={form.metodo} onChange={(e) => setForm({...form,metodo:e.target.value})}>{E.METODOS_PAGO.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}</select></Campo>
          </div>
          <div className="dos">
            <Campo etq="Monto"><input className="mono" inputMode="decimal" value={form.monto} placeholder="0.00" onChange={(e) => setForm({...form,monto:e.target.value})} /></Campo>
            <Campo etq="Fecha"><input type="date" value={form.fecha} onChange={(e) => setForm({...form,fecha:e.target.value})} /></Campo>
          </div>
          <Campo etq="Referencia (N° cheque, transf., etc.)"><input value={form.referencia} placeholder="Opcional" onChange={(e) => setForm({...form,referencia:e.target.value})} /></Campo>
          <Campo etq="Contrato (abono a)"><select value={form.contratoId} onChange={(e) => { const cid = e.target.value; const ct = contMap[cid]; setForm({...form, contratoId: cid, proveedorId: ct ? ((estado.proveedores||[]).find((p) => p.nombre === ct.proveedor)||{}).id || form.proveedorId : form.proveedorId}); }}><option value="">Ninguno (pago independiente)</option>{contratosProyecto.map((c) => <option key={c.id} value={c.id}>{c.titulo} — {dinero(c.montoContrato, true)}</option>)}</select></Campo>
          {form.contratoId && contMap[form.contratoId] ? (() => { const ct = contMap[form.contratoId]; const abonado = E.r2((estado.pagos||[]).filter((p) => p.contratoId === form.contratoId && p.id !== form.id).reduce((s,p) => s + E.num(p.monto), 0)); const saldo = E.r2(E.num(ct.montoContrato) - abonado); return <div style={{background:'var(--fondo-elev)',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:13}}><div className="dos"><div><span className="tenue">Monto contrato: </span><span className="mono" style={{fontWeight:700}}>{dinero(ct.montoContrato, true)}</span></div><div><span className="tenue">Ya abonado: </span><span className="mono">{dinero(abonado, true)}</span></div></div><div style={{marginTop:6}}><span className="tenue">Saldo pendiente: </span><span className="mono" style={{fontWeight:700,color: saldo > 0 ? 'var(--rojo)' : 'var(--verde)'}}>{dinero(saldo, true)}</span></div></div>; })() : null}
          <div className="dos">
            <Campo etq="Proveedor"><select value={form.proveedorId} onChange={(e) => setForm({...form,proveedorId:e.target.value})}><option value="">Ninguno</option>{(estado.proveedores||[]).map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}</select></Campo>
            <Campo etq="Trabajador"><input value={form.trabajador} placeholder="Nombre del trabajador (opcional)" onChange={(e) => setForm({...form,trabajador:e.target.value})} /></Campo>
          </div>
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: CALENDARIO DE PAGOS
   ============================================================ */
function Calendario({ estado, dinero }) {
  const [mesActual, setMesActual] = useState(() => { const h = new Date(); return h.getFullYear() + '-' + String(h.getMonth()+1).padStart(2,'0'); });
  const [diaSel, setDiaSel] = useState(null);

  const [anio, mes] = mesActual.split('-').map(Number);
  const primerDia = new Date(anio, mes - 1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  const diasEnMes = ultimoDia.getDate();
  const inicioSemana = primerDia.getDay(); // 0=dom
  const hoyStr = E.hoy();
  const DIAS_SEM = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const eventos = useMemo(() => {
    const evs = [];
    (estado.gastos || []).filter((g) => g.proyectoId === estado.proyectoActivo && !g.pagado && g.fechaVencimiento)
      .forEach((g) => { if (E.mesDe(g.fechaVencimiento) === mesActual) evs.push({ tipo: 'gasto', fecha: g.fechaVencimiento, desc: g.descripcion || 'Gasto', monto: g.monto, proveedor: g.proveedor }); });
    (estado.ordenes || []).filter((o) => o.proyectoId === estado.proyectoActivo && o.estado === 'aprobada' && o.fechaEntrega)
      .forEach((o) => { if (E.mesDe(o.fechaEntrega) === mesActual) evs.push({ tipo: 'orden', fecha: o.fechaEntrega, desc: 'OC ' + o.numero, monto: o.total, proveedor: o.proveedor }); });
    return evs;
  }, [estado, mesActual]);

  const eventosPorDia = {};
  eventos.forEach((ev) => { const d = parseInt(ev.fecha.split('-')[2], 10); if (!eventosPorDia[d]) eventosPorDia[d] = []; eventosPorDia[d].push(ev); });

  const mesAnterior = () => { const d = new Date(anio, mes - 2, 1); setMesActual(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); setDiaSel(null); };
  const mesSiguiente = () => { const d = new Date(anio, mes, 1); setMesActual(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); setDiaSel(null); };

  const eventosVista = diaSel ? (eventosPorDia[diaSel] || []) : eventos.sort((a,b) => a.fecha < b.fecha ? -1 : 1);

  return (
    <div className="rejilla" style={{gap:16}}>
      <div className="tarjeta">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <button className="btn btn-sm" onClick={mesAnterior}><Icono n="derecha" s={16} c="var(--texto-2)" /></button>
          <h3 style={{fontSize:18}}>{MESES_LARGO[mes-1]} {anio}</h3>
          <button className="btn btn-sm" onClick={mesSiguiente}><Icono n="derecha" s={16} /></button>
        </div>
        <div className="cal-grid" style={{marginBottom:4}}>
          {DIAS_SEM.map((d) => <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--texto-3)',padding:'6px 0',textTransform:'uppercase',letterSpacing:'.08em'}}>{d}</div>)}
        </div>
        <div className="cal-grid">
          {Array.from({length:inicioSemana}).map((_,i) => <div key={'v'+i} className="cal-dia otro"></div>)}
          {Array.from({length:diasEnMes}).map((_,i) => {
            const dia = i + 1;
            const fechaDia = mesActual + '-' + String(dia).padStart(2,'0');
            const esHoy = fechaDia === hoyStr;
            const esSel = dia === diaSel;
            const tiene = eventosPorDia[dia];
            const diasH = E.diasHasta(fechaDia);
            return (
              <div key={dia} className={'cal-dia' + (esHoy ? ' hoy' : '') + (esSel ? ' sel' : '')} onClick={() => setDiaSel(esSel ? null : dia)}>
                <span>{dia}</span>
                {tiene ? <div className="cal-dot" style={{background: diasH < 0 ? 'var(--rojo)' : diasH === 0 ? 'var(--ambar)' : 'var(--texto-3)'}} /> : null}
              </div>
            );
          })}
        </div>
      </div>

      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>{diaSel ? 'Pagos del ' + diaSel + '/' + String(mes).padStart(2,'0') : 'Pagos del mes'}</h3>
          {diaSel ? <button className="btn btn-sm" onClick={() => setDiaSel(null)}>Ver todo el mes</button> : null}
        </div>
        {eventosVista.length === 0 ? (
          <Vacio icono="calendario" titulo={diaSel ? 'Sin pagos este día' : 'Sin pagos pendientes este mes'} texto="Los pagos aparecen cuando hay gastos o órdenes con fecha de vencimiento." />
        ) : eventosVista.map((ev, i) => (
          <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,padding:'11px 0',borderBottom:'1px solid var(--borde)',alignItems:'center'}}>
            <div style={{display:'flex',gap:10,alignItems:'center',minWidth:0,flex:1}}>
              <div className="cat-icono" style={{background:ev.tipo==='orden'?'rgba(91,168,242,.15)':undefined,color:ev.tipo==='orden'?'var(--azul)':undefined}}>
                <Icono n={ev.tipo === 'orden' ? 'orden' : 'gastos'} s={17} />
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14}}>{ev.desc}</div>
                <div className="mini">{ev.proveedor || '—'} · {fFecha(ev.fecha)}</div>
              </div>
            </div>
            <div className="mono" style={{fontWeight:700,fontSize:14,flexShrink:0}}>{dinero(ev.monto, true)}</div>
          </div>
        ))}
        {eventosVista.length > 0 ? (
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:12,paddingTop:12,borderTop:'2px solid var(--borde-fuerte)'}}>
            <span className="mono" style={{fontSize:16,fontWeight:700}}>{dinero(eventosVista.reduce((s,ev)=>s+E.num(ev.monto),0))}</span>
          </div>
        ) : null}
      </div>
    </div>
  );
}

/* ============================================================
   VISTA: PROVEEDORES
   ============================================================ */
function Proveedores({ estado, accion, brindar, dinero }) {
  const [form, setForm] = useState(null);
  const [buscar, setBuscar] = useState('');
  const [historial, setHistorial] = useState(null);
  const provs = (estado.proveedores || [])
    .filter((p) => !buscar.trim() || p.nombre.toLowerCase().includes(buscar.toLowerCase()) || (p.telefono||'').includes(buscar))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  const vacio = () => ({ id: null, nombre: '', contacto: '', telefono: '', correo: '', direccion: '', notas: '', calificacion: 3, condicionesPago: '', tiempoEntregaPromedio: '' });

  const guardar = () => {
    if (!form.nombre.trim()) return brindar('El proveedor necesita nombre.', 'err');
    const dupl = (estado.proveedores || []).some((p) => p.id !== form.id && p.nombre.trim().toLowerCase() === form.nombre.trim().toLowerCase());
    if (dupl) return brindar('Ya existe.', 'err');
    if (form.id) {
      accion((s) => ({ ...s, proveedores: (s.proveedores||[]).map((p) => p.id === form.id ? { ...p, ...form, nombre: form.nombre.trim() } : p) }));
    } else {
      accion((s) => ({ ...s, proveedores: (s.proveedores||[]).concat([{ ...form, id: E.uid('pv'), nombre: form.nombre.trim(), creado: new Date().toISOString() }]) }));
    }
    brindar(form.id ? 'Actualizado.' : 'Creado.', 'ok');
    setForm(null);
  };

  const borrar = (p) => {
    if (!confirm('¿Borrar "' + p.nombre + '"?')) return;
    accion((s) => ({ ...s, proveedores: (s.proveedores||[]).filter((x) => x.id !== p.id) }));
    brindar('Eliminado.', 'ok');
  };

  const verHistorial = (p) => {
    const h = E.historialProveedor(p.nombre, estado.gastos, estado.licitaciones, estado.ordenes);
    setHistorial({ ...h, nombre: p.nombre });
  };

  return (
    <div>
      {historial ? (
        <Modal titulo={'Historial: ' + historial.nombre} onCerrar={() => setHistorial(null)}>
          <div className="rejilla kpis" style={{gridTemplateColumns:'1fr 1fr 1fr',marginBottom:16}}>
            <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px',textAlign:'center'}}><div className="mini">Total gastado</div><div className="mono" style={{fontWeight:700,fontSize:16,marginTop:4}}>{dinero(historial.totalGastado, true)}</div></div>
            <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px',textAlign:'center'}}><div className="mini">Compras</div><div className="mono" style={{fontWeight:700,fontSize:16,marginTop:4}}>{historial.cantidadGastos}</div></div>
            <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px',textAlign:'center'}}><div className="mini">Promedio</div><div className="mono" style={{fontWeight:700,fontSize:16,marginTop:4}}>{dinero(historial.promedioGasto, true)}</div></div>
          </div>
          {historial.gastos.length > 0 ? (
            <div className="tabla-cont">
              <table style={{minWidth:0}}>
                <thead><tr><th>Fecha</th><th>Descripción</th><th className="der">Monto</th></tr></thead>
                <tbody>
                  {historial.gastos.slice(0, 15).map((g) => (
                    <tr key={g.id}><td className="mono" style={{fontSize:13}}>{fFecha(g.fecha)}</td><td>{g.descripcion}</td><td className="der mono" style={{fontWeight:700}}>{dinero(g.monto)}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : <p className="mini" style={{textAlign:'center'}}>Sin compras registradas.</p>}
        </Modal>
      ) : null}

      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Proveedores</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(vacio())}><Icono n="mas" s={16} />Nuevo proveedor</button>
        </div>
        <div className="filtros"><input placeholder="Buscar nombre, teléfono…" value={buscar} onChange={(e) => setBuscar(e.target.value)} style={{flex:1}} /></div>
        {provs.length === 0 ? (
          <Vacio icono="mano_obra" titulo="Sin proveedores" texto="Agrega tus proveedores habituales." accion={<button className="btn btn-p" onClick={() => setForm(vacio())}><Icono n="mas" s={16} />Nuevo</button>} />
        ) : (
          <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:12}}>
            {provs.map((p) => (
              <div key={p.id} className="tarjeta" style={{padding:'14px 16px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                  <div><div style={{fontWeight:700,fontSize:15}}>{p.nombre}</div><Estrellas valor={p.calificacion || 0} tam={14} /></div>
                  <div style={{display:'flex',gap:2,flexShrink:0}}>
                    <button className="btn-icono" title="Historial" onClick={() => verHistorial(p)}><Icono n="reportes" s={17} /></button>
                    <button className="btn-icono" onClick={() => setForm({...p,calificacion:p.calificacion||3,condicionesPago:p.condicionesPago||'',tiempoEntregaPromedio:p.tiempoEntregaPromedio||''})}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrar(p)}><Icono n="basura" s={17} /></button>
                  </div>
                </div>
                {p.contacto ? <div className="mini" style={{marginTop:6}}><Icono n="mano_obra" s={13} /> {p.contacto}</div> : null}
                {p.telefono ? <div className="mini" style={{marginTop:4}}><Icono n="reloj" s={13} /> {p.telefono}</div> : null}
                {p.correo ? <div className="mini" style={{marginTop:4}}><Icono n="info" s={13} /> {p.correo}</div> : null}
                {p.direccion ? <div className="mini" style={{marginTop:4}}><Icono n="ubicacion" s={13} /> {p.direccion}</div> : null}
                {p.condicionesPago ? <div className="mini tenue" style={{marginTop:6}}>Pago: {p.condicionesPago}</div> : null}
                {p.tiempoEntregaPromedio ? <div className="mini tenue">Entrega: {p.tiempoEntregaPromedio} días</div> : null}
              </div>
            ))}
          </div>
        )}
      </div>
      {form ? (
        <Modal titulo={form.id ? 'Editar proveedor' : 'Nuevo proveedor'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardar}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Nombre"><input value={form.nombre} autoFocus placeholder="Ej. Ferretería Jenny" onChange={(e) => setForm({...form,nombre:e.target.value})} /></Campo>
          <Campo etq="Calificación"><Estrellas valor={form.calificacion} onChange={(n) => setForm({...form,calificacion:n})} /></Campo>
          <Campo etq="Nombre del contacto"><input value={form.contacto||''} onChange={(e) => setForm({...form,contacto:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Teléfono"><input value={form.telefono||''} onChange={(e) => setForm({...form,telefono:e.target.value})} /></Campo>
            <Campo etq="Correo"><input type="email" value={form.correo||''} onChange={(e) => setForm({...form,correo:e.target.value})} /></Campo>
          </div>
          <Campo etq="Dirección"><input value={form.direccion||''} onChange={(e) => setForm({...form,direccion:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Condiciones de pago"><input value={form.condicionesPago||''} placeholder="Ej. 30 días crédito" onChange={(e) => setForm({...form,condicionesPago:e.target.value})} /></Campo>
            <Campo etq="Tiempo entrega prom. (días)"><input className="mono" inputMode="numeric" value={form.tiempoEntregaPromedio||''} onChange={(e) => setForm({...form,tiempoEntregaPromedio:e.target.value})} /></Campo>
          </div>
          <Campo etq="Notas"><textarea value={form.notas||''} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: REPORTES
   ============================================================ */
function Reportes({ estado, v, dinero, brindar }) {
  const mensual = useMemo(() => E.reporteMensual(estado.proyectoActivo, estado.categorias, estado.gastos), [estado]);
  const fases = useMemo(() => E.reportePorFase(estado.proyectoActivo, estado.categorias, estado.gastos), [estado]);
  const maxMes = Math.max.apply(null, [1].concat(mensual.map((m) => m.total)));
  const ahorros = v.detalle.filter((d) => d.ahorro > 0 && d.presupuesto > 0).sort((a, b) => b.ahorro - a.ahorro);
  const excesos = v.detalle.filter((d) => d.sobrecosto > 0).sort((a, b) => b.sobrecosto - a.sobrecosto);
  const porTipo = E.gastosPorTipo(estado.proyectoActivo, estado.gastos);
  const topProvs = E.topProveedoresPorGasto(estado.proyectoActivo, estado.gastos, 10);
  const flujo = E.flujoMensual(estado.proyectoActivo, estado.gastos, estado.ordenes);
  const maxTipo = Math.max.apply(null, [1].concat(porTipo.map((t) => t.monto)));

  const exportarCSV = () => {
    const mapaCat = {}; estado.categorias.forEach((c) => (mapaCat[c.id] = c));
    const filas = [['Fecha','Descripcion','Categoria','Tipo','Proveedor','Cantidad','Unidad','P.U.','Monto','Pagado']];
    estado.gastos.filter((g) => g.proyectoId === estado.proyectoActivo).sort((a,b)=>(a.fecha>b.fecha?1:-1)).forEach((g) => {
      const c = mapaCat[g.categoriaId]||{};
      filas.push([g.fecha,g.descripcion||'',c.nombre||'',g.tipo||'',g.proveedor||'',g.cantidad,g.unidad||'',g.precioUnitario,g.monto,g.pagado?'Si':'No']);
    });
    const csv = '﻿' + filas.map((f)=>f.map((x)=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download = 'gastos-'+E.hoy()+'.csv'; a.click();
    brindar('CSV descargado.', 'ok');
  };

  return (
    <div className="rejilla" style={{gap:16}}>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Gasto mensual</h3>
          <button className="btn btn-sm" onClick={exportarCSV}><Icono n="bajar" s={15} />Exportar CSV</button>
        </div>
        {mensual.length === 0 ? <Vacio icono="reportes" titulo="Sin datos" texto="Registra gastos para ver reportes." /> : (
          <React.Fragment>
            <div style={{display:'flex',alignItems:'flex-end',gap:10,height:175,padding:'10px 0 0',overflowX:'auto'}}>
              {mensual.map((m) => (
                <div key={m.mes} style={{flex:'1 0 46px',display:'flex',flexDirection:'column',alignItems:'center',gap:7,height:'100%',justifyContent:'flex-end'}}>
                  <div className="mono" style={{fontSize:10.5,color:'var(--texto-2)',whiteSpace:'nowrap'}}>{dinero(m.total,true)}</div>
                  <div style={{width:'100%',maxWidth:60,height:Math.max(4,(m.total/maxMes)*118),background:'linear-gradient(180deg,var(--ambar-claro),var(--ambar-oscuro))',borderRadius:'7px 7px 3px 3px'}} />
                  <div style={{fontSize:10.5,color:'var(--texto-3)',whiteSpace:'nowrap',fontWeight:600}}>{m.etiqueta}</div>
                </div>
              ))}
            </div>
            <div className="sep" />
            <div className="tabla-cont">
              <table>
                <thead><tr><th>Mes</th><th className="der">Total</th><th className="der">Variación</th><th>Cat. dominante</th><th className="cen">Mov.</th></tr></thead>
                <tbody>
                  {mensual.slice().reverse().map((m) => (
                    <tr key={m.mes}>
                      <td style={{fontWeight:600}}>{m.etiqueta}</td>
                      <td className="der mono" style={{fontWeight:700}}>{dinero(m.total)}</td>
                      <td className={'der mono '+(m.variacion>0?'neg':m.variacion<0?'pos':'tenue')}>
                        {m.variacion===0?'—':<span style={{display:'inline-flex',alignItems:'center',gap:5}}><Icono n={m.variacion>0?'arribaT':'abajoT'} s={14} />{dinero(m.variacion,true)}</span>}
                      </td>
                      <td>{m.topCategoria?m.topCategoria.nombre:'—'}</td>
                      <td className="cen mono">{m.movimientos}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Gasto por tipo</h3></div>
          {porTipo.map((t) => (
            <div key={t.tipo} style={{padding:'8px 0',borderBottom:'1px solid var(--borde)'}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:5}}>
                <span style={{fontWeight:600}}>{t.label}</span>
                <span className="mono">{dinero(t.monto, true)} ({t.pct}%)</span>
              </div>
              <div className="barrita"><i style={{width:(t.monto/maxTipo*100)+'%'}} /></div>
            </div>
          ))}
        </div>

        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Top proveedores</h3></div>
          {topProvs.length === 0 ? <p className="mini">Sin datos.</p> :
            topProvs.map((p,i) => (
              <div key={i} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'8px 0',borderBottom:'1px solid var(--borde)'}}>
                <span style={{fontSize:14,display:'flex',alignItems:'center',gap:8}}><span className="mono tenue" style={{width:22}}>{i+1}.</span>{p.proveedor}</span>
                <span className="mono" style={{fontWeight:600,flexShrink:0}}>{dinero(p.total, true)}</span>
              </div>
            ))}
        </div>
      </div>

      <div className="tarjeta">
        <div className="tarjeta-cab"><h3>Avance por fase</h3></div>
        {fases.length === 0 ? <Vacio icono="edificio" titulo="Sin fases" texto="Asigna fases a tus categorías." /> :
          fases.map((f) => (
            <div className="fila-cat" key={f.fase}>
              <div className="fila-cat-top"><div className="fila-cat-nom">{f.fase}</div><Chip estado={f.estado.id} texto={f.ejecucion+'%'} /></div>
              <Barra pct={f.ejecucion} estado={f.estado.id} />
              <div className="fila-cat-cifras">
                <span className="mono">{dinero(f.gastado, true)} <span className="tenue">de {dinero(f.presupuesto, true)}</span></span>
                <span className={'mono '+(f.saldo>=0?'pos':'neg')}>{f.saldo>=0?'Ahorro ':'Sobrecosto '}{dinero(Math.abs(f.saldo),true)}</span>
              </div>
            </div>
          ))}
      </div>

      {flujo.length > 0 ? (
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Flujo de caja mensual</h3></div>
          <div className="tabla-cont">
            <table>
              <thead><tr><th>Mes</th><th className="der">Gastos pagados</th><th className="der">Pendientes</th><th className="der">Total mes</th></tr></thead>
              <tbody>
                {flujo.map((f) => (
                  <tr key={f.mes}>
                    <td style={{fontWeight:600}}>{f.etiqueta}</td>
                    <td className="der mono">{dinero(f.pagado)}</td>
                    <td className="der mono" style={{color:'var(--ambar)'}}>{dinero(f.pendiente)}</td>
                    <td className="der mono" style={{fontWeight:700}}>{dinero(f.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ) : null}

      <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Ahorros</h3><span className="mono pos" style={{fontWeight:700}}>{dinero(ahorros.reduce((s,d)=>s+d.ahorro,0),true)}</span></div>
          {ahorros.length===0?<p className="mini">Ningún ahorro todavía.</p>:ahorros.map((d)=>(
            <div key={d.categoriaId} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'9px 0',borderBottom:'1px solid var(--borde)'}}>
              <span style={{display:'flex',alignItems:'center',gap:8}}><Icono n={d.icono} s={16} c="var(--menta)" /><span style={{fontSize:14}}>{d.nombre}</span></span>
              <span className="mono pos" style={{fontWeight:600,flexShrink:0}}>{dinero(d.ahorro,true)}</span>
            </div>
          ))}
        </div>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Sobrecostos</h3><span className="mono neg" style={{fontWeight:700}}>{dinero(excesos.reduce((s,d)=>s+d.sobrecosto,0),true)}</span></div>
          {excesos.length===0?<p className="mini">Todo dentro del presupuesto.</p>:excesos.map((d)=>(
            <div key={d.categoriaId} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'9px 0',borderBottom:'1px solid var(--borde)'}}>
              <span style={{display:'flex',alignItems:'center',gap:8}}><Icono n={d.icono} s={16} c="var(--rojo)" /><span style={{fontSize:14}}>{d.nombre}</span></span>
              <span className="mono neg" style={{fontWeight:600,flexShrink:0}}>{dinero(d.sobrecosto,true)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   VISTA: PROYECTOS (cartera)
   ============================================================ */
const CHIP_PROYECTO = { activo: 'sano', pausado: 'alerta', terminado: 'neutro' };

function Proyectos({ estado, dinero, accion, brindar, irA }) {
  const [filtro, setFiltro] = useState('todos');
  const [proy, setProy] = useState(null);
  const [proyABorrar, setProyABorrar] = useState(null);
  const [textoConfirm, setTextoConfirm] = useState('');
  const cartera = useMemo(() => E.resumenCartera(estado, filtro), [estado, filtro]);
  const t = cartera.totales;

  const abrir = (p) => { accion((s) => ({ ...s, proyectoActivo: p.id })); irA('panel'); };

  const guardarProy = () => {
    if (!proy.nombre.trim()) return brindar('Nombre requerido.', 'err');
    if (proy.id) {
      accion((s) => ({ ...s, proyectos: s.proyectos.map((p) => p.id === proy.id ? { ...p, ...proy, nombre: proy.nombre.trim() } : p) }));
    } else {
      const nuevo = E.nuevoProyecto({ ...proy, nombre: proy.nombre.trim() });
      accion((s) => ({ ...s, proyectos: s.proyectos.concat([nuevo]), categorias: s.categorias.concat(E.categoriasIniciales(nuevo.id)), proyectoActivo: nuevo.id }));
    }
    brindar(proy.id ? 'Actualizado.' : 'Creado con 12 categorías base.', 'ok');
    setProy(null);
  };

  const ejecutarBorrado = () => {
    const p = proyABorrar;
    FOTOS.todas().then((fotos) => { const ids = estado.gastos.filter((g)=>g.proyectoId===p.id).map((g)=>g.id); fotos.filter((f)=>ids.includes(f.gastoId)).forEach((f)=>FOTOS.eliminar(f.id).catch(()=>{})); }).catch(()=>{});
    accion((s) => {
      const proyectos = s.proyectos.filter((x) => x.id !== p.id);
      return { ...s, proyectos, categorias: s.categorias.filter((x) => x.proyectoId !== p.id), gastos: s.gastos.filter((x) => x.proyectoId !== p.id), licitaciones: s.licitaciones.filter((x) => x.proyectoId !== p.id), ordenes: (s.ordenes||[]).filter((x) => x.proyectoId !== p.id), contratos: (s.contratos||[]).filter((x) => x.proyectoId !== p.id), proyectoActivo: s.proyectoActivo === p.id ? (proyectos[0]||{}).id || null : s.proyectoActivo };
    });
    setProyABorrar(null); setTextoConfirm('');
    brindar('Proyecto eliminado.', 'ok');
  };

  const cambiarEstado = (p, nuevo) => { accion((s) => ({ ...s, proyectos: s.proyectos.map((x) => x.id === p.id ? { ...x, estado: nuevo } : x) })); };

  return (
    <div className="rejilla" style={{gap:16}}>
      <div className="rejilla kpis">
        <Kpi etq="Proyectos" val={String(t.proyectos)} pie={t.excedidos>0?t.excedidos+' con sobrecosto':'todos en rango'} tono={t.excedidos>0?'rojo':''} />
        <Kpi etq="Presupuesto total" val={dinero(t.presupuesto,true)} pie={t.movimientos+' movimientos'} />
        <Kpi etq="Ejecutado total" val={dinero(t.gastado,true)} pie={t.ejecucion+'%'} />
        <Kpi etq={t.saldo>=0?'Disponible':'Sobrecosto'} val={dinero(Math.abs(t.saldo),true)} tono={t.saldo>=0?'menta':'rojo'} />
      </div>

      <div className="tarjeta-cab" style={{marginBottom:0}}>
        <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
          {[['todos','Todos']].concat(E.ESTADOS_PROYECTO.map((e)=>[e.id,e.label])).map(([id,etq])=>(
            <button key={id} className={'btn btn-sm'+(filtro===id?' btn-p':'')} onClick={()=>setFiltro(id)}>{etq}</button>
          ))}
        </div>
        <button className="btn btn-p btn-sm" onClick={() => setProy({id:null,nombre:'',ubicacion:'',responsable:'',inicio:E.hoy(),fin:'',estado:'activo',notas:''})}>
          <Icono n="mas" s={16} />Nuevo proyecto
        </button>
      </div>

      {cartera.filas.length === 0 ? (
        <div className="tarjeta"><Vacio icono="proyecto" titulo="Sin proyectos" texto="Crea el primero." /></div>
      ) : (
        <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))'}}>
          {cartera.filas.map((f) => {
            const p = f.proyecto;
            const esActivo = p.id === estado.proyectoActivo;
            return (
              <div className="tarjeta" key={p.id} style={esActivo?{borderColor:'rgba(242,169,59,.45)'}:null}>
                <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start'}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:16}}>{p.nombre}</div>
                    <div className="mini" style={{marginTop:3}}><Icono n="ubicacion" s={12} /> {p.ubicacion||'Sin ubicación'}</div>
                  </div>
                  <div style={{display:'flex',gap:5,flexShrink:0}}>
                    {esActivo?<Chip estado="alerta" texto="Abierto" />:null}
                    <Chip estado={CHIP_PROYECTO[p.estado||'activo']} texto={(E.ESTADOS_PROYECTO.find((e)=>e.id===(p.estado||'activo'))||{}).label||'Activo'} />
                  </div>
                </div>
                <div style={{margin:'14px 0 8px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:6}}>
                    <span className="mono">{dinero(f.v.gastado,true)} <span className="tenue">de {dinero(f.v.presupuesto,true)}</span></span>
                    <span className="mono" style={{fontWeight:700}}>{f.v.ejecucion}%</span>
                  </div>
                  <Barra pct={f.v.ejecucion} estado={f.v.estado.id} />
                </div>
                <div className="sep" style={{margin:'12px 0 10px'}} />
                <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                  <button className={'btn btn-sm'+(esActivo?'':' btn-p')} onClick={() => abrir(p)}><Icono n="derecha" s={15} />{esActivo?'Ir al panel':'Abrir'}</button>
                  <select value={p.estado||'activo'} onChange={(e) => cambiarEstado(p,e.target.value)} style={{background:'var(--panel-2)',border:'1px solid var(--borde)',borderRadius:8,padding:'7px 9px',color:'var(--texto-2)',fontSize:13}}>
                    {E.ESTADOS_PROYECTO.map((e)=><option key={e.id} value={e.id}>{e.label}</option>)}
                  </select>
                  <div style={{marginLeft:'auto',display:'flex',gap:2}}>
                    <button className="btn-icono" onClick={() => setProy({...p})}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => {setProyABorrar(p);setTextoConfirm('');}}><Icono n="basura" s={17} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {proyABorrar ? (
        <Modal titulo="Confirmar eliminación" onCerrar={() => {setProyABorrar(null);setTextoConfirm('');}}
          pie={<React.Fragment><button className="btn" onClick={() => {setProyABorrar(null);setTextoConfirm('');}}>Cancelar</button><button className="btn btn-peligro" disabled={textoConfirm!=='Eliminar'} onClick={ejecutarBorrado}><Icono n="basura" s={16} />Borrar</button></React.Fragment>}>
          <div className="aviso a-alto"><Icono n="alerta" s={18} /><span>Se borrarán el proyecto <strong>"{proyABorrar.nombre}"</strong> y todos sus datos. No se puede deshacer.</span></div>
          <Campo etq="Escribe Eliminar para confirmar"><input autoFocus value={textoConfirm} placeholder="Eliminar" onChange={(e)=>setTextoConfirm(e.target.value)} /></Campo>
        </Modal>
      ) : null}

      {proy ? (
        <Modal titulo={proy.id?'Editar proyecto':'Nuevo proyecto'} onCerrar={() => setProy(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setProy(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarProy}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Nombre"><input value={proy.nombre} autoFocus placeholder="Ej. Remodelación" onChange={(e)=>setProy({...proy,nombre:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Ubicación"><input value={proy.ubicacion||''} placeholder="Ej. Managua" onChange={(e)=>setProy({...proy,ubicacion:e.target.value})} /></Campo>
            <Campo etq="Responsable"><input value={proy.responsable||''} onChange={(e)=>setProy({...proy,responsable:e.target.value})} /></Campo>
          </div>
          <div className="tres">
            <Campo etq="Inicio"><input type="date" value={proy.inicio||''} onChange={(e)=>setProy({...proy,inicio:e.target.value})} /></Campo>
            <Campo etq="Fin previsto"><input type="date" value={proy.fin||''} onChange={(e)=>setProy({...proy,fin:e.target.value})} /></Campo>
            <Campo etq="Estado"><select value={proy.estado||'activo'} onChange={(e)=>setProy({...proy,estado:e.target.value})}>{E.ESTADOS_PROYECTO.map((e)=><option key={e.id} value={e.id}>{e.label}</option>)}</select></Campo>
          </div>
          <Campo etq="Notas"><textarea value={proy.notas||''} onChange={(e)=>setProy({...proy,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: AJUSTES
   ============================================================ */
function Ajustes({ estado, accion, brindar, instalar, puedeInstalar, irA }) {
  const archivo = useRef(null);

  const exportar = async () => {
    const fotos = await FOTOS.todas().catch(() => []);
    const paquete = Object.assign({}, estado, { fotos });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(paquete, null, 2)], { type: 'application/json' }));
    a.download = 'obra-control-respaldo-' + E.hoy() + '.json'; a.click();
    brindar('Respaldo descargado.', 'ok');
  };

  const importar = (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const lector = new FileReader();
    lector.onload = async () => {
      try {
        const d = JSON.parse(lector.result);
        if (!d || !Array.isArray(d.proyectos)) throw new Error('formato');
        if (!confirm('Esto reemplaza todos los datos. ¿Continuar?')) return;
        await FOTOS.vaciar().catch(() => {});
        if (Array.isArray(d.fotos)) await FOTOS.restaurar(d.fotos).catch(() => {});
        const { fotos, ...resto } = d;
        accion(() => Object.assign(E.estadoVacio(), resto));
        brindar('Respaldo restaurado.', 'ok');
      } catch (e) { brindar('Archivo no válido.', 'err'); }
      ev.target.value = '';
    };
    lector.readAsText(f);
  };

  return (
    <div className="rejilla" style={{gap:16}}>
      <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Preferencias</h3></div>
          <Campo etq="Símbolo de moneda"><input value={estado.moneda} maxLength={5} onChange={(e)=>accion((s)=>({...s,moneda:e.target.value}))} /></Campo>
          <p className="mini">Solo para mostrar. No convierte tipo de cambio.</p>
          {puedeInstalar ? <React.Fragment><div className="sep" /><button className="btn btn-p" onClick={instalar}><Icono n="instalar" s={16} />Instalar en este dispositivo</button></React.Fragment> : null}
        </div>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Respaldo de datos</h3></div>
          <p className="mini" style={{marginTop:0,marginBottom:14,lineHeight:1.6}}>Los datos viven en este dispositivo. Descarga un respaldo para pasarlos a otro.</p>
          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            <button className="btn" onClick={exportar}><Icono n="bajar" s={16} />Descargar respaldo</button>
            <button className="btn" onClick={() => archivo.current.click()}><Icono n="subir" s={16} />Restaurar</button>
            <input ref={archivo} type="file" accept=".json" style={{display:'none'}} onChange={importar} />
          </div>
          <div className="sep" />
          <button className="btn btn-peligro" onClick={() => {
            if (!confirm('Esto borra TODO. ¿Seguro?')) return;
            FOTOS.vaciar().catch(()=>{});
            accion(()=>{const v=E.estadoVacio();const p=E.nuevoProyecto({nombre:'Mi primer proyecto'});v.proyectos=[p];v.categorias=E.categoriasIniciales(p.id);v.proyectoActivo=p.id;return v;});
            brindar('Datos borrados.', 'ok');
          }}><Icono n="basura" s={16} />Borrar todos los datos</button>
        </div>
      </div>
      <div className="tarjeta">
        <div className="tarjeta-cab"><h3>Navegación rápida</h3></div>
        <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
          <button className="btn" onClick={() => irA('proyectos')}><Icono n="proyecto" s={16} />Cartera</button>
          <button className="btn" onClick={() => irA('ordenes')}><Icono n="orden" s={16} />Órdenes</button>
          <button className="btn" onClick={() => irA('contratos')}><Icono n="contrato" s={16} />Contratos</button>
          <button className="btn" onClick={() => irA('calendario')}><Icono n="calendario" s={16} />Calendario</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APLICACIÓN
   ============================================================ */
const SECCIONES = [
  { id: 'proyectos', etq: 'Proyectos', icono: 'proyecto' },
  { id: 'panel', etq: 'Panel', icono: 'panel' },
  { id: 'presupuesto', etq: 'Presupuesto', icono: 'presupuesto' },
  { id: 'gastos', etq: 'Gastos', icono: 'gastos' },
  { id: 'proveedores', etq: 'Proveedores', icono: 'mano_obra' },
  { id: 'ofertas', etq: 'Ofertas', icono: 'ofertas' },
  { id: 'ordenes', etq: 'Órdenes', icono: 'orden' },
  { id: 'pagos', etq: 'Pagos', icono: 'pago' },
  { id: 'contratos', etq: 'Contratos', icono: 'contrato' },
  { id: 'calendario', etq: 'Calendario', icono: 'calendario' },
  { id: 'reportes', etq: 'Reportes', icono: 'reportes' },
  { id: 'ajustes', etq: 'Ajustes', icono: 'ajustes' },
];
const TABS_MOVIL = SECCIONES.filter((s) => ['proyectos','panel','gastos','ordenes','pagos','ofertas','reportes'].includes(s.id));

function App() {
  const [estado, setEstado] = useState(cargar);
  const [vista, setVista] = useState('panel');
  const [brindis, setBrindis] = useState(null);
  const [promptPWA, setPromptPWA] = useState(null);
  const [filtroGastos, setFiltroGastos] = useState(null);
  const dinero = useDinero(estado.moneda || 'C$');

  useEffect(() => { if (!guardar(estado)) setBrindis({ txt: 'No se pudo guardar.', tipo: 'err' }); }, [estado]);
  useEffect(() => { const h = (e) => { e.preventDefault(); setPromptPWA(e); }; window.addEventListener('beforeinstallprompt', h); return () => window.removeEventListener('beforeinstallprompt', h); }, []);

  const limpiezaHecha = useRef(false);
  useEffect(() => { if (limpiezaHecha.current) return; limpiezaHecha.current = true; FOTOS.limpiarHuerfanas(estado.gastos.map((g)=>g.id)).catch(()=>{}); }, []);

  useEffect(() => {
    setEstado((s) => {
      const existe = s.proyectos.some((p) => p.id === s.proyectoActivo);
      if (!existe && s.proyectos.length > 0) return { ...s, proyectoActivo: s.proyectos[0].id };
      return s;
    });
  }, [estado.proyectos.length]);

  const brindar = (txt, tipo) => setBrindis({ txt, tipo: tipo || 'ok' });
  useEffect(() => { if (!brindis) return; const t = setTimeout(() => setBrindis(null), 3200); return () => clearTimeout(t); }, [brindis]);

  const accion = (fn) => setEstado((s) => fn(s));
  const cambiarProyecto = (id) => { if (!id) return; setEstado((s) => s.proyectoActivo === id ? s : { ...s, proyectoActivo: id }); };
  const irAGastosPendientes = () => { setFiltroGastos('pendientes'); setVista('gastos'); };

  const proyecto = estado.proyectos.find((p) => p.id === estado.proyectoActivo) || null;
  const v = useMemo(() => E.varianzaProyecto(estado.proyectoActivo, estado.categorias, estado.gastos), [estado.proyectoActivo, estado.categorias, estado.gastos]);
  const avisos = useMemo(() => E.alertas(estado.proyectoActivo, estado.categorias, estado.gastos, estado.licitaciones), [estado.proyectoActivo, estado.categorias, estado.gastos, estado.licitaciones]);

  const instalar = () => { if (!promptPWA) return; promptPWA.prompt(); setPromptPWA(null); };

  if (!proyecto) {
    return (
      <div className="app">
        <div className="principal" style={{margin:0,width:'100%',display:'grid',placeItems:'center',minHeight:'100vh'}}>
          <div className="tarjeta" style={{maxWidth:420,textAlign:'center'}}>
            <div className="marca-icono" style={{margin:'0 auto 16px'}}><Icono n="edificio" s={22} /></div>
            <h2 style={{fontSize:24,textTransform:'uppercase',letterSpacing:'.06em'}}>Obra Control</h2>
            <p className="mini" style={{margin:'10px 0 20px'}}>No hay proyectos. Crea el primero.</p>
            <button className="btn btn-p" onClick={() => {
              const p = E.nuevoProyecto({nombre:'Mi primer proyecto'});
              accion((s)=>({...s,proyectos:[p],categorias:E.categoriasIniciales(p.id),proyectoActivo:p.id}));
            }}><Icono n="mas" s={16} />Crear proyecto</button>
          </div>
        </div>
      </div>
    );
  }

  const contenido = {
    proyectos: <Proyectos estado={estado} dinero={dinero} accion={accion} brindar={brindar} irA={setVista} />,
    panel: <Panel estado={estado} v={v} alertas={avisos} dinero={dinero} irA={setVista} irAGastosPendientes={irAGastosPendientes} />,
    presupuesto: <Presupuesto estado={estado} v={v} dinero={dinero} accion={accion} brindar={brindar} />,
    gastos: <Gastos estado={estado} dinero={dinero} accion={accion} brindar={brindar} filtroInicial={filtroGastos} limpiarFiltroInicial={() => setFiltroGastos(null)} />,
    proveedores: <Proveedores estado={estado} accion={accion} brindar={brindar} dinero={dinero} />,
    ofertas: <Ofertas estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    ordenes: <Ordenes estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    pagos: <Pagos estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    contratos: <Contratos estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    calendario: <Calendario estado={estado} dinero={dinero} />,
    reportes: <Reportes estado={estado} v={v} dinero={dinero} brindar={brindar} />,
    ajustes: <Ajustes estado={estado} accion={accion} brindar={brindar} instalar={instalar} puedeInstalar={!!promptPWA} irA={setVista} />,
  }[vista];

  const titulos = {
    proyectos:'Cartera de proyectos', panel:'Panel general', presupuesto:'Presupuesto',
    gastos:'Gastos', proveedores:'Proveedores', ofertas:'Ofertas', ordenes:'Órdenes de compra',
    pagos:'Pagos y adelantos', contratos:'Contratos', calendario:'Calendario de pagos', reportes:'Reportes', ajustes:'Ajustes',
  };

  return (
    <div className="app">
      <aside className="lateral">
        <div className="marca">
          <div className="marca-icono"><Icono n="edificio" s={21} /></div>
          <div className="marca-txt">
            <div className="n">Obra Control</div>
            <div className="s">Gestión integral</div>
          </div>
        </div>
        {SECCIONES.map((s, i) => (
          <React.Fragment key={s.id}>
            {(i === 9) ? <div className="nav-sep" /> : null}
            <button className={'nav-btn' + (vista === s.id ? ' on' : '')} onClick={() => setVista(s.id)}>
              <Icono n={s.icono} s={19} />{s.etq}
            </button>
          </React.Fragment>
        ))}
        <div className="lateral-pie">
          <div style={{fontWeight:600,color:'var(--texto-2)'}}>{proyecto.nombre}</div>
          <div style={{marginTop:3}}>{v.ejecucion}% ejecutado · {v.movimientos} mov.</div>
        </div>
      </aside>

      <main className="principal">
        <header className="cabecera">
          <div>
            <h1>{titulos[vista]}</h1>
            <div className="sub">
              {vista === 'proyectos'
                ? estado.proyectos.length + ' proyecto(s)'
                : proyecto.nombre + (proyecto.ubicacion ? ' · ' + proyecto.ubicacion : '')}
            </div>
          </div>
          <div className="acciones">
            {estado.proyectos.length > 1 && vista !== 'proyectos' ? (
              <select value={estado.proyectoActivo} onChange={(e) => cambiarProyecto(e.target.value)}
                style={{background:'var(--panel)',border:'1px solid var(--borde)',borderRadius:10,padding:'10px 12px',color:'var(--texto)',fontWeight:600,maxWidth:220}}>
                {estado.proyectos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
            ) : null}
            {!['gastos','proyectos','proveedores','ordenes','contratos','pagos'].includes(vista) ? (
              <button className="btn btn-p" onClick={() => setVista('gastos')}><Icono n="mas" s={16} />Registrar gasto</button>
            ) : null}
            <button className="btn ajustes-movil" onClick={() => setVista('ajustes')} title="Ajustes" style={{flex:'0 0 auto'}}>
              <Icono n="ajustes" s={17} />
            </button>
          </div>
        </header>
        {contenido}
      </main>

      <nav className="barra-inf">
        {TABS_MOVIL.map((s) => (
          <button key={s.id} className={'tab' + (vista === s.id ? ' on' : '')} onClick={() => {setVista(s.id);window.scrollTo(0,0);}}>
            <Icono n={s.icono} s={20} />{s.etq}
          </button>
        ))}
      </nav>

      {brindis ? (
        <div className={'brindis ' + brindis.tipo}>
          <Icono n={brindis.tipo === 'ok' ? 'check' : 'alerta'} s={17} />{brindis.txt}
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.log('Service worker no registrado:', e.message);
    });
  });
}
</script>
</body>
</html>
