function Proveedores({ estado, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [buscar, setBuscar] = useState('');
  const provs = (estado.proveedores || [])
    .filter((p) => !buscar.trim() || p.nombre.toLowerCase().includes(buscar.toLowerCase()) || (p.telefono || '').includes(buscar) || (p.correo || '').toLowerCase().includes(buscar.toLowerCase()))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  const vacio = () => ({ id: null, nombre: '', contacto: '', telefono: '', correo: '', direccion: '', notas: '', calificacion: 0, categoria: '', condicionesPago: '' });

  const guardar = () => {
    if (!form.nombre.trim()) return brindar('El proveedor necesita un nombre.', 'err');
    const dupl = (estado.proveedores || []).some((p) => p.id !== form.id && p.nombre.trim().toLowerCase() === form.nombre.trim().toLowerCase());
    if (dupl) return brindar('Ya existe un proveedor con ese nombre.', 'err');
    if (form.id) {
      accion((s) => ({ ...s, proveedores: (s.proveedores || []).map((p) => p.id === form.id ? { ...p, ...form, nombre: form.nombre.trim() } : p) }));
      brindar('Proveedor actualizado.', 'ok');
    } else {
      const nuevo = { id: E.uid('pv'), nombre: form.nombre.trim(), contacto: form.contacto || '', telefono: form.telefono || '', correo: form.correo || '', direccion: form.direccion || '', notas: form.notas || '', calificacion: form.calificacion || 0, categoria: form.categoria || '', condicionesPago: form.condicionesPago || '', creado: new Date().toISOString() };
      accion((s) => ({ ...s, proveedores: (s.proveedores || []).concat([nuevo]) }));
      brindar('Proveedor creado.', 'ok');
    }
    setForm(null);
  };

  const borrar = (p) => {
    if (!confirm('¿Borrar el proveedor "' + p.nombre + '"? Si ya está usado en gastos, los gastos conservan el nombre pero ya no estará en la base.')) return;
    accion((s) => ({ ...s, proveedores: (s.proveedores || []).filter((x) => x.id !== p.id) }));
    brindar('Proveedor eliminado.', 'ok');
  };

  return (
    <div>

        <div className="tarjeta-cab">
          <h3>Proveedores</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(vacio())}><Icono n="mas" s={16} />Nuevo proveedor</button>
        </div>
        <div className="filtros" style={{ marginBottom: 14 }}>
          <input placeholder="Buscar por nombre, teléfono o correo…" value={buscar} onChange={(e) => setBuscar(e.target.value)} style={{ flex: 1 }} />
        </div>
        {provs.length === 0 ? (
          <Vacio icono="mano_obra" titulo="Sin proveedores" texto="Agrega los proveedores que usas habitualmente para seleccionarlos rápido al registrar un gasto."
            accion={<button className="btn btn-p" onClick={() => setForm(vacio())}><Icono n="mas" s={16} />Nuevo proveedor</button>} />
        ) : (
          <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', gap: 12 }}>
            {provs.map((p) => (
              <div key={p.id} className="tarjeta" style={{ padding: '14px 16px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>{p.nombre}</div>
                    {p.calificacion > 0 ? <div style={{display:'flex',gap:2,marginTop:3}}>{[1,2,3,4,5].map((n) => <span key={n} style={{color: n <= p.calificacion ? 'var(--ambar)' : 'var(--texto-3)', fontSize:14}}>★</span>)}</div> : null}
                  </div>
                  <div style={{ display: 'flex', gap: 2, flexShrink: 0 }}>
                    <button className="btn-icono" onClick={() => setForm({ ...p, calificacion: p.calificacion||0, categoria: p.categoria||'', condicionesPago: p.condicionesPago||'' })}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrar(p)}><Icono n="basura" s={17} /></button>
                  </div>
                </div>
                {p.categoria ? <div style={{marginTop:6}}><Chip estado="neutro" texto={p.categoria} /></div> : null}
                {p.contacto ? <div className="mini" style={{ marginTop: 6, display: 'flex', alignItems: 'center', gap: 6 }}><Icono n="mano_obra" s={13} />{p.contacto}</div> : null}
                {p.telefono ? <div className="mini" style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 6 }}><Icono n="reloj" s={13} />{p.telefono}</div> : null}
                {p.correo ? <div className="mini" style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 6 }}><Icono n="info" s={13} />{p.correo}</div> : null}
                {p.direccion ? <div className="mini" style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 6 }}><Icono n="ubicacion" s={13} />{p.direccion}</div> : null}

      {form ? (
        <Modal titulo={form.id ? 'Editar proveedor' : 'Nuevo proveedor'} onCerrar={() => setForm(null)}

          <Campo etq="Nombre del contacto"><input value={form.contacto || ''} onChange={(e) => setForm({ ...form, contacto: e.target.value })} placeholder="Ej. Juan Pérez" /></Campo>
          <div className="dos">
            <Campo etq="Teléfono"><input value={form.telefono || ''} onChange={(e) => setForm({ ...form, telefono: e.target.value })} placeholder="Ej. 8888-0000" /></Campo>
            <Campo etq="Correo electrónico"><input type="email" value={form.correo || ''} onChange={(e) => setForm({ ...form, correo: e.target.value })} placeholder="correo@ejemplo.com" /></Campo>
          </div>
          <Campo etq="Dirección"><input value={form.direccion || ''} onChange={(e) => setForm({ ...form, direccion: e.target.value })} placeholder="Ej. Carretera Sur km 5" /></Campo>
          <div className="dos">
            <Campo etq="Categoría"><input value={form.categoria || ''} onChange={(e) => setForm({ ...form, categoria: e.target.value })} placeholder="Ej. Ferretería, Mano de obra" /></Campo>
            <Campo etq="Condiciones de pago"><input value={form.condicionesPago || ''} onChange={(e) => setForm({ ...form, condicionesPago: e.target.value })} placeholder="Ej. 30 días crédito" /></Campo>
          </div>
          <Campo etq={'Calificación (' + (form.calificacion || 0) + '/5)'}>
            <div style={{display:'flex',gap:6,fontSize:24,cursor:'pointer'}}>{[1,2,3,4,5].map((n) => <span key={n} style={{color: n <= (form.calificacion||0) ? 'var(--ambar)' : 'var(--texto-3)'}} onClick={() => setForm({...form, calificacion: form.calificacion === n ? 0 : n})}>★</span>)}</div>
          </Campo>
          <Campo etq="Notas"><textarea value={form.notas || ''} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Observaciones, referencias…" /></Campo>

   ============================================================ */
function Ajustes({ estado, accion, brindar, instalar, puedeInstalar, irA }) {
  const archivo = useRef(null);

  const [exportando, setExportando] = useState(false);
  const [importando, setImportando] = useState(false);

  const exportar = async () => {
    setExportando(true);
    try {
      const fotos = await FOTOS.todas().catch(() => []);
      const paquete = Object.assign({}, estado, { fotos });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(paquete, null, 2)], { type: 'application/json' }));
      a.download = 'obra-firme-respaldo-' + E.hoy() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      brindar(fotos.length > 0 ? 'Respaldo descargado con ' + fotos.length + ' foto(s).' : 'Respaldo descargado.', 'ok');
    } finally {
      setExportando(false);
    }
  };

  const importar = (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const lector = new FileReader();
    lector.onload = async () => {
      try {
        const d = JSON.parse(lector.result);
        if (!d || !Array.isArray(d.proyectos)) throw new Error('formato');
        const avisoFotos = Array.isArray(d.fotos) && d.fotos.length > 0 ? ' e incluye ' + d.fotos.length + ' foto(s) de factura' : '';
        if (!confirm('Esto reemplaza todos los datos que tienes en este dispositivo' + avisoFotos + '. ¿Continuar?')) return;
        setImportando(true);
        await FOTOS.vaciar().catch(() => {});
        if (Array.isArray(d.fotos) && d.fotos.length > 0) await FOTOS.restaurar(d.fotos).catch(() => {
          brindar('Se restauraron los datos, pero las fotos no se pudieron copiar en este dispositivo.', 'err');
        });
        const { fotos, ...resto } = d;
        accion(() => Object.assign(E.estadoVacio(), resto));
        brindar('Respaldo restaurado.', 'ok');
      } catch (e) {
        brindar('El archivo no es un respaldo válido de Obra Firme.', 'err');
      } finally {
        setImportando(false);
      }
      ev.target.value = '';
    };
    lector.readAsText(f);
  };

  return (
    <div className="rejilla" style={{ gap: 16 }}>
      <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(300px,1fr))' }}>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Preferencias</h3></div>
          <Campo etq="Símbolo de moneda">
            <input value={estado.moneda} maxLength={5}
              onChange={(e) => accion((s) => ({ ...s, moneda: e.target.value }))} />
          </Campo>
          <p className="mini">Se usa solo para mostrar. No hace conversión de tipo de cambio.</p>
          {puedeInstalar ? (
            <React.Fragment>
              <div className="sep" />
              <button className="btn btn-p" onClick={instalar}><Icono n="instalar" s={16} />Instalar en este dispositivo</button>
            </React.Fragment>
          ) : null}
        </div>

        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Respaldo de datos</h3></div>
          <div className="aviso a-ok" style={{ marginBottom: 14 }}>
            <Icono n="sincro" s={17} />
            <span>Los datos se sincronizan automáticamente con Supabase. Cualquier dispositivo con acceso a la app verá los mismos datos.</span>
          </div>
          <p className="mini" style={{ marginTop: 0, marginBottom: 14, lineHeight: 1.6 }}>
            El respaldo manual incluye también las fotos de facturas. Descárgalo como copia de seguridad extra o para mover datos entre cuentas.
          </p>
          <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap' }}>
            <button className="btn" onClick={exportar} disabled={exportando}><Icono n="bajar" s={16} />{exportando ? 'Preparando…' : 'Descargar respaldo'}</button>
            <button className="btn" onClick={() => archivo.current.click()} disabled={importando}><Icono n="subir" s={16} />{importando ? 'Restaurando…' : 'Restaurar respaldo'}</button>
            <input ref={archivo} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={importar} />
          </div>
          <div className="sep" />
          <button className="btn btn-peligro" onClick={() => {
            if (!confirm('Esto borra TODO en este dispositivo, incluidas las fotos de facturas, y deja la app vacía. ¿Seguro?')) return;
            FOTOS.vaciar().catch(() => {});
            accion(() => {
              const v = E.estadoVacio();
              const p = E.nuevoProyecto({ nombre: 'Mi primer proyecto' });
              v.proyectos = [p]; v.categorias = E.categoriasIniciales(p.id); v.proyectoActivo = p.id;
              return v;
            });
            brindar('Datos borrados. Empezamos de cero.', 'ok');
          }}><Icono n="basura" s={16} />Borrar todos los datos</button>
        </div>
      </div>

      <div className="tarjeta">
        <div className="tarjeta-cab"><h3>Proyectos</h3></div>
        <p className="mini" style={{ marginTop: 0, marginBottom: 14, lineHeight: 1.6 }}>
          Crear, copiar, pausar y borrar proyectos se hace desde la cartera. Ahí ves todos juntos con su presupuesto y su avance.
        </p>
        <button className="btn" onClick={() => irA('proyectos')}><Icono n="proyecto" s={16} />Ir a la cartera</button>
      </div>
    </div>
  );
}

   APLICACIÓN
   ============================================================ */
const SECCIONES = [
  { id: 'proyectos', etq: 'Proyectos', icono: 'proyecto' },
  { id: 'panel', etq: 'Panel', icono: 'panel' },
  { id: 'presupuesto', etq: 'Presupuesto', icono: 'presupuesto' },
  { id: 'gastos', etq: 'Gastos', icono: 'gastos' },
  { id: 'ordenes', etq: 'Órdenes', icono: 'orden' },
  { id: 'contratos', etq: 'Contratos', icono: 'contrato' },
  { id: 'pagos', etq: 'Pagos', icono: 'pago' },
  { id: 'proveedores', etq: 'Proveedores', icono: 'mano_obra' },
  { id: 'calendario', etq: 'Calendario', icono: 'calendario' },
  { id: 'ofertas', etq: 'Ofertas', icono: 'ofertas' },
  { id: 'reportes', etq: 'Reportes', icono: 'reportes' },
  { id: 'ajustes', etq: 'Ajustes', icono: 'ajustes' },
];
// En móvil la barra inferior muestra 6 secciones: excluye Ajustes (botón en encabezado)
// y Proveedores se mantiene (es una sección de uso frecuente en obra).
const TABS_MOVIL = SECCIONES.filter((s) => s.id !== 'ajustes');

function App() {
  const [estado, setEstado] = useState(cargar);
  const [vista, setVista] = useState('panel');
  const [brindis, setBrindis] = useState(null);
  const [promptPWA, setPromptPWA] = useState(null);
  const [filtroGastos, setFiltroGastos] = useState(null);
  // 'spin' = sincronizando, 'ok' = en línea, 'err' = sin conexión
  const [syncEstado, setSyncEstado] = useState('spin');
  const dinero = useDinero(estado.moneda || 'C$');

  // ── Tiempo real: escuchar cambios de otros dispositivos ──
  const estadoRef = useRef(estado);
  useEffect(() => { estadoRef.current = estado; }, [estado]);

  // Evita que el guardado local (efecto de abajo) suba datos a Supabase
  // antes de que termine la carga inicial desde la nube. Sin esto, el
  // primer render sube el estado local viejo mientras la descarga sigue
  // en curso, y si la subida termina primero, borra lo que otro
  // dispositivo ya había sincronizado.
  const cargaInicialLista = useRef(false);
  // Evita re-subir a Supabase un estado que acaba de llegar de la nube
  // (el "eco" de nuestro propio polling), que además pisaba el
  // 'actualizado' de la fila en cada ciclo de 8s.
  const aplicandoRemoto = useRef(false);

  /* ── Fotos en la nube ──────────────────────────────────────────
     estado.fotosNube es un índice liviano {id, gastoId, url, ancho,
     alto, bytes, creado} — la imagen vive en el bucket de Storage,
     no en el JSON del estado. Cada dispositivo reconcilia su
     IndexedDB local contra ese índice:
       1) foto local que la nube no conoce todavía → subirla
       2) foto en la nube que no está localmente     → bajarla
       3) foto que confirmamos antes y ya no está en la nube
          (la borraron en otro dispositivo)           → borrarla local
       4) foto que confirmamos antes y ya no está local
          (la borré yo en este dispositivo)            → avisar a la nube
     'fotosConfirmadas' vive solo en memoria (se reinicia al recargar
     la página) — es lo que permite distinguir "foto nueva, hay que
     subirla" de "foto que ya no está en algún lado, hay que borrarla
     en el otro" sin arriesgarse a borrar por error algo que este
     dispositivo simplemente no ha descargado todavía. */
  const fotosConfirmadas = useRef(new Set());
  const fotosOcupado = useRef(false);
  const fotosPendiente = useRef(false);

  async function fotosReconciliar() {
    if (fotosOcupado.current) { fotosPendiente.current = true; return; }
    fotosOcupado.current = true;
    try {
      const locales = await FOTOS.todas().catch(() => []);
      const idsLocales = new Set(locales.map((f) => f.id));
      const nube = estadoRef.current.fotosNube || [];
      const idsNube = new Set(nube.map((f) => f.id));

      const nuevasParaNube = [];
      for (const f of locales) {
        if (idsNube.has(f.id) || fotosConfirmadas.current.has(f.id)) continue;
        try {
          const url = await supaFotoSubir(f);
          nuevasParaNube.push({ id: f.id, gastoId: f.gastoId, url, ancho: f.ancho, alto: f.alto, bytes: f.bytes, creado: f.creado });
          fotosConfirmadas.current.add(f.id);
          idsNube.add(f.id);
        } catch { /* sin red — se reintenta en el próximo ciclo */ }
      }
      if (nuevasParaNube.length > 0) {
        setEstado((s) => ({ ...s, fotosNube: (s.fotosNube || []).concat(nuevasParaNube) }));
      }

      for (const f of nube) {
        if (idsLocales.has(f.id)) { fotosConfirmadas.current.add(f.id); continue; }
        try {
          const dataURL = await supaFotoDescargar(f.url);
          await FOTOS.restaurar([{ id: f.id, gastoId: f.gastoId, dataURL, ancho: f.ancho, alto: f.alto, bytes: f.bytes, creado: f.creado }]);
          fotosConfirmadas.current.add(f.id);
          idsLocales.add(f.id);
        } catch { /* sin red — se reintenta en el próximo ciclo */ }
      }

      for (const id of Array.from(fotosConfirmadas.current)) {
        if (!idsNube.has(id) && idsLocales.has(id)) {
          await FOTOS.eliminar(id).catch(() => {});
          fotosConfirmadas.current.delete(id);
        }
      }

      const borradasAqui = [];
      for (const id of fotosConfirmadas.current) {
        if (idsNube.has(id) && !idsLocales.has(id)) borradasAqui.push(id);
      }
      if (borradasAqui.length > 0) {
        setEstado((s) => ({ ...s, fotosNube: (s.fotosNube || []).filter((f) => borradasAqui.indexOf(f.id) === -1) }));
        const gastoDe = {};
        nube.forEach((f) => { gastoDe[f.id] = f.gastoId; });
        borradasAqui.forEach((id) => {
          fotosConfirmadas.current.delete(id);
          supaFotoBorrar(gastoDe[id], id);
        });
      }
    } finally {
      fotosOcupado.current = false;
      if (fotosPendiente.current) {
        fotosPendiente.current = false;
        fotosReconciliar();
      }
    }
  }

  // ── Al arrancar: intentar traer datos de Supabase ──
  const syncArranqueHecho = useRef(false);
  useEffect(() => {
    if (syncArranqueHecho.current) return;
    syncArranqueHecho.current = true;
    setSyncEstado('spin');
    supaCargar().then((nube) => {
      if (nube && nube.proyectos && nube.proyectos.length > 0) {
        aplicandoRemoto.current = true;
        setEstado(nube);
        guardarLocal(nube);
      } else {
        // No hay nada en la nube todavía (fila nueva o primer dispositivo):
        // subimos el estado local para crear/poblar la fila.
        supaGuardar(estadoRef.current).catch(() => {});
      }
      cargaInicialLista.current = true;
      setSyncEstado('ok');
      fotosReconciliar();
    }).catch(() => {
      // Sin red al arrancar: igual dejamos subir cambios futuros del usuario,
      // pero no tocamos la nube con el snapshot local de este arranque.
      cargaInicialLista.current = true;
      setSyncEstado('err');
    });
  }, []);

  // Red de seguridad: además de reconciliar cuando llega un cambio remoto,
  // se revisa cada 12s por si el usuario tomó una foto y este dispositivo
  // todavía no la subió (por ejemplo, si en ese momento no había red).
  useEffect(() => {
    const t = setInterval(() => fotosReconciliar(), 12000);
    return () => clearInterval(t);
  }, []);

  // ── Guardar: localStorage inmediato + Supabase con debounce de 800ms ──
  // El debounce evita que cambios rápidos (ej. cambiar de proyecto) generen
  // múltiples escrituras a Supabase que se pisen entre sí.
  useEffect(() => {
    guardarLocal(estado);
    if (aplicandoRemoto.current) {
      // Este cambio de estado vino de la nube (polling), no del usuario:
      // ya está sincronizado, no hace falta re-subirlo.
      aplicandoRemoto.current = false;
      return;
    }
    if (!cargaInicialLista.current) return; // esperar a que termine la carga inicial
    setSyncEstado('spin');
    const timer = setTimeout(() => {
      supaGuardar(estado)
        .then(() => setSyncEstado('ok'))
        .catch(() => setSyncEstado('err'));
    }, 800);
    return () => clearTimeout(timer);
  }, [estado]);

  useEffect(() => {
    const desuscribir = supaEscuchar((nuevoEstado) => {
      // Comparamos TODO el estado sincronizable, no solo "proyectos".
      // Antes, un cambio en gastos, proveedores o licitaciones no movía
      // la aguja de "proyectos" y el polling lo ignoraba por completo:
      // ese dispositivo nunca recibía el cambio, y su próximo guardado
      // (con datos viejos) terminaba borrando lo que el otro había hecho.
      const { proyectoActivo: _pa1, ...nubeComparable } = nuevoEstado;
      const { proyectoActivo: _pa2, ...esteComparable } = estadoRef.current;
      if (JSON.stringify(nubeComparable) !== JSON.stringify(esteComparable)) {
        // Preservar el proyecto activo LOCAL — es una preferencia de UI por dispositivo.
        // Sin esto, el polling de Supabase revertía el cambio de proyecto que el usuario
        // acaba de hacer al traer el estado anterior de la nube.
        const estadoNube = Object.assign({}, nuevoEstado, {
          proyectoActivo: estadoRef.current.proyectoActivo,
        });
        aplicandoRemoto.current = true;
        setEstado(estadoNube);
        guardarLocal(estadoNube);
        setBrindis({ txt: 'Datos actualizados desde otro dispositivo.', tipo: 'ok' });
        fotosReconciliar();
      }
      setSyncEstado('ok');
    });
    return desuscribir;
  }, []);

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setPromptPWA(e); };
    window.addEventListener('beforeinstallprompt', h);
    return () => window.removeEventListener('beforeinstallprompt', h);
  }, []);

  const limpiezaHecha = useRef(false);
  useEffect(() => {
    if (limpiezaHecha.current) return;
    limpiezaHecha.current = true;
    FOTOS.limpiarHuerfanas(estado.gastos.map((g) => g.id)).catch(() => {});
  }, []);

  useEffect(() => {
    const existe = estado.proyectos.some((p) => p.id === estado.proyectoActivo);
    if (!existe && estado.proyectos.length > 0) {
      setEstado((s) => ({ ...s, proyectoActivo: s.proyectos[0].id }));
    }
  }, [estado.proyectos, estado.proyectoActivo]);

  const brindar = (txt, tipo) => setBrindis({ txt, tipo: tipo || 'ok' });
  useEffect(() => {
    if (!brindis) return;
    const t = setTimeout(() => setBrindis(null), 3200);
    return () => clearTimeout(t);
  }, [brindis]);

  const accion = (fn) => setEstado((s) => fn(s));

  const cambiarProyecto = (id) => {
    if (!id) return;
    setEstado((s) => (s.proyectoActivo === id ? s : { ...s, proyectoActivo: id }));
  };

  const irAGastosPendientes = () => {
    setFiltroGastos('pendientes');
    setVista('gastos');
  };

  const proyecto = estado.proyectos.filter((p) => p.id === estado.proyectoActivo)[0] || null;
  const v = useMemo(
    () => E.varianzaProyecto(estado.proyectoActivo, estado.categorias, estado.gastos),
    [estado.proyectoActivo, estado.categorias, estado.gastos]
  );
  const avisos = useMemo(
    () => E.alertas(estado.proyectoActivo, estado.categorias, estado.gastos, estado.licitaciones),
    [estado.proyectoActivo, estado.categorias, estado.gastos, estado.licitaciones]
  );

  const instalar = () => {
    if (!promptPWA) return;
    promptPWA.prompt();
    setPromptPWA(null);
  };

  if (!proyecto) {
    return (
      <div className="app">
        <div className="principal" style={{ margin: 0, width: '100%', display: 'grid', placeItems: 'center', minHeight: '100vh' }}>
          <div className="tarjeta" style={{ maxWidth: 420, textAlign: 'center' }}>
            <div className="marca-icono" style={{ margin: '0 auto 16px' }}><Icono n="edificio" s={22} /></div>
            <h2 style={{ fontSize: 24, textTransform: 'uppercase', letterSpacing: '.06em' }}>Obra Firme</h2>
            <p className="mini" style={{ margin: '10px 0 20px' }}>No hay ningún proyecto abierto. Crea el primero para empezar.</p>
            <button className="btn btn-p" onClick={() => {
              const p = E.nuevoProyecto({ nombre: 'Mi primer proyecto' });
              accion((s) => ({ ...s, proyectos: [p], categorias: E.categoriasIniciales(p.id), proyectoActivo: p.id }));
            }}><Icono n="mas" s={16} />Crear proyecto</button>
          </div>
        </div>
      </div>
    );
  }

  const contenido = {
    proyectos: <Proyectos estado={estado} dinero={dinero} accion={accion} brindar={brindar} irA={setVista} />,
    panel: <Panel estado={estado} v={v} alertas={avisos} dinero={dinero} irA={setVista} irAGastosPendientes={irAGastosPendientes} />,
    presupuesto: <Presupuesto estado={estado} v={v} dinero={dinero} accion={accion} brindar={brindar} />,
    gastos: <Gastos estado={estado} dinero={dinero} accion={accion} brindar={brindar} filtroInicial={filtroGastos} limpiarFiltroInicial={() => setFiltroGastos(null)} />,
    ordenes: <Ordenes estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    contratos: <Contratos estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    pagos: <Pagos estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    proveedores: <Proveedores estado={estado} accion={accion} brindar={brindar} />,
    calendario: <CalendarioPagos estado={estado} dinero={dinero} />,
    ofertas: <Ofertas estado={estado} dinero={dinero} accion={accion} brindar={brindar} />,
    reportes: <Reportes estado={estado} v={v} dinero={dinero} brindar={brindar} />,
    ajustes: <Ajustes estado={estado} accion={accion} brindar={brindar} instalar={instalar} puedeInstalar={!!promptPWA} irA={setVista} />,
  }[vista];

  const titulos = {
    proyectos: 'Cartera de proyectos', panel: 'Panel general', presupuesto: 'Presupuesto',
    gastos: 'Gastos', ordenes: 'Órdenes de compra', contratos: 'Contratos', pagos: 'Pagos',
    proveedores: 'Proveedores', calendario: 'Calendario de pagos', ofertas: 'Ofertas', reportes: 'Reportes', ajustes: 'Ajustes',
  };

  return (
    <div className="app">
      <aside className="lateral">
        <div className="marca">
          <div className="marca-icono"><Icono n="edificio" s={21} /></div>
          <div className="marca-txt">
            <div className="n">Obra Firme</div>
            <div className="s">Control de obra</div>
          </div>
        </div>
        {SECCIONES.map((s) => (
          <button key={s.id} className={'nav-btn' + (vista === s.id ? ' on' : '')} onClick={() => setVista(s.id)}>
            <Icono n={s.icono} s={19} />{s.etq}
          </button>
        ))}
        <div className="lateral-pie">
          <div style={{ fontWeight: 600, color: 'var(--texto-2)' }}>{proyecto.nombre}</div>
          <div style={{ marginTop: 3 }}>{v.ejecucion}% ejecutado · {v.movimientos} movimientos</div>
        </div>
      </aside>

      <main className="principal">
        <header className="cabecera">
          <div>
            <h1>{titulos[vista]}</h1>
            <div className="sub">
              {vista === 'proyectos'
                ? estado.proyectos.length + ' proyecto(s) · ' + estado.proyectos.filter((p) => (p.estado || 'activo') === 'activo').length + ' activo(s)'
                : proyecto.nombre + (proyecto.ubicacion ? ' · ' + proyecto.ubicacion : '')}
            </div>
          </div>
          <div className="acciones">
            {estado.proyectos.length > 1 && vista !== 'proyectos' ? (
              <select
                value={estado.proyectoActivo}
                onChange={(e) => cambiarProyecto(e.target.value)}
                title="Cambiar de proyecto"
                style={{ background: 'var(--panel)', border: '1px solid var(--borde)', borderRadius: 10, padding: '10px 12px', color: 'var(--texto)', fontWeight: 600, maxWidth: 220 }}>
                {estado.proyectos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
            ) : null}
            {vista !== 'gastos' && vista !== 'proyectos' && vista !== 'proveedores' ? (
              <button className="btn btn-p" onClick={() => setVista('gastos')}><Icono n="mas" s={16} />Registrar gasto</button>
            ) : null}
            <button className="btn ajustes-movil" onClick={() => setVista('ajustes')} title="Ajustes" style={{ flex: '0 0 auto' }}>
              <Icono n="ajustes" s={17} />
            </button>
            {/* Indicador de sincronización con Supabase */}
            <div title={{ spin: 'Sincronizando…', ok: 'Sincronizado con la nube', err: 'Sin conexión — guardado localmente' }[syncEstado]}
              style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 8, background: 'var(--panel)', border: '1px solid var(--borde)', flexShrink: 0, cursor: 'default' }}>
              <div className={'sync-dot sync-' + syncEstado} />
              <span className="mini" style={{ whiteSpace: 'nowrap' }}>
                {{ spin: 'Sync…', ok: 'En línea', err: 'Sin red' }[syncEstado]}
              </span>
            </div>
          </div>
        </header>

        {contenido}
      </main>

      <nav className="barra-inf">
        {TABS_MOVIL.map((s) => (
          <button key={s.id} className={'tab' + (vista === s.id ? ' on' : '')} onClick={() => { setVista(s.id); window.scrollTo(0, 0); }}>
            <Icono n={s.icono} s={21} />{s.etq}
          </button>
        ))}
      </nav>

      {brindis ? (
        <div className={'brindis ' + brindis.tipo}>
          <Icono n={brindis.tipo === 'ok' ? 'check' : 'alerta'} s={17} />{brindis.txt}
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.log('Service worker no registrado:', e.message);
    });
  });
}
</script>
</body>
</html>
