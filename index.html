function Presupuesto({ estado, v, dinero, accion, brindar }) {
  const [editando, setEditando] = useState(null);
  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaV = {};
  v.detalle.forEach((d) => (mapaV[d.categoriaId] = d));

  const abrirNueva = () => setEditando({ id: null, nombre: '', icono: 'obra_gris', fase: E.FASES[0], presupuesto: '' });

  const guardarCat = () => {
    const d = editando;
    if (!d.nombre.trim()) return brindar('Ponle nombre a la categoría.', 'err');
    const duplicada = estado.categorias.some((c) => c.proyectoId === estado.proyectoActivo && c.id !== d.id && c.nombre.trim().toLowerCase() === d.nombre.trim().toLowerCase());
    if (duplicada) return brindar('Ya existe esa categoría.', 'err');
    if (d.id) {
      accion((s) => ({ ...s, categorias: s.categorias.map((c) => c.id === d.id ? { ...c, nombre: d.nombre.trim(), icono: d.icono, fase: d.fase, presupuesto: E.r2(d.presupuesto) } : c) }));
      brindar('Categoría actualizada.', 'ok');
    } else {
      accion((s) => ({ ...s, categorias: s.categorias.concat([{ id: E.uid('ct'), proyectoId: s.proyectoActivo, nombre: d.nombre.trim(), icono: d.icono, fase: d.fase, presupuesto: E.r2(d.presupuesto) }]) }));
      brindar('Categoría creada.', 'ok');
    }
    setEditando(null);
  };

  const borrarCat = (c) => {
    if (!confirm('¿Borrar "' + c.nombre + '"?')) return;
    accion((s) => ({ ...s, categorias: s.categorias.filter((x) => x.id !== c.id) }));
    brindar('Categoría eliminada.', 'ok');
  };

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Presupuesto por categoría</h3>
          <button className="btn btn-p btn-sm" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva categoría</button>
        </div>
        {cats.length === 0 ? (
          <Vacio icono="presupuesto" titulo="Sin categorías" texto="Crea las partidas del proyecto."
            accion={<button className="btn btn-p" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva categoría</button>} />
        ) : (
          <div className="tabla-cont">
            <table>
              <thead><tr><th>Categoría</th><th className="der">Presupuesto</th><th className="der">Ejecutado</th><th className="der">Saldo</th><th style={{width:150}}>Avance</th><th className="der">Acciones</th></tr></thead>
              <tbody>
                {cats.map((c) => {
                  const d = mapaV[c.id] || { presupuesto: 0, gastado: 0, saldo: 0, ejecucion: 0, estado: E.ESTADOS.sinPresupuesto, movimientos: 0 };
                  return (
                    <tr key={c.id}>
                      <td>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <div className="cat-icono"><Icono n={c.icono} s={17} /></div>
                          <div><div style={{ fontWeight: 600 }}>{c.nombre}</div><div className="mini">{c.fase} · {d.movimientos} mov.</div></div>
                        </div>
                      </td>
                      <td className="der mono">{dinero(d.presupuesto)}</td>
                      <td className="der mono">{dinero(d.gastado)}</td>
                      <td className={'der mono ' + (d.saldo >= 0 ? 'pos' : 'neg')}>{d.saldo >= 0 ? '+' : ''}{dinero(d.saldo)}</td>
                      <td><Barra pct={d.ejecucion} estado={d.estado.id} /><div className="mini mono" style={{marginTop:5}}>{d.ejecucion}%</div></td>
                      <td className="der" style={{whiteSpace:'nowrap'}}>
                        <button className="btn-icono" onClick={() => setEditando({ ...c, presupuesto: String(c.presupuesto || '') })}><Icono n="lapiz" s={17} /></button>
                        <button className="btn-icono" onClick={() => borrarCat(c)}><Icono n="basura" s={17} /></button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop: '2px solid var(--borde-fuerte)' }}>
                  <td style={{ fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', fontSize: 12 }}>Total</td>
                  <td className="der mono" style={{ fontWeight: 700 }}>{dinero(v.presupuesto)}</td>
                  <td className="der mono" style={{ fontWeight: 700 }}>{dinero(v.gastado)}</td>
                  <td className={'der mono ' + (v.saldo >= 0 ? 'pos' : 'neg')} style={{ fontWeight: 700 }}>{v.saldo >= 0 ? '+' : ''}{dinero(v.saldo)}</td>
                  <td><Chip estado={v.estado.id} texto={v.ejecucion + '%'} /></td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </div>
      {editando ? (
        <Modal titulo={editando.id ? 'Editar categoría' : 'Nueva categoría'} onCerrar={() => setEditando(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setEditando(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarCat}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Nombre"><input value={editando.nombre} autoFocus onChange={(e) => setEditando({ ...editando, nombre: e.target.value })} placeholder="Ej. Acabados de fachada" /></Campo>
          <div className="dos">
            <Campo etq="Fase"><select value={editando.fase} onChange={(e) => setEditando({ ...editando, fase: e.target.value })}>{E.FASES.map((f) => <option key={f} value={f}>{f}</option>)}</select></Campo>
            <Campo etq="Presupuesto"><input className="mono" inputMode="decimal" value={editando.presupuesto} onChange={(e) => setEditando({ ...editando, presupuesto: e.target.value })} placeholder="0.00" /></Campo>
          </div>
          <Campo etq="Icono">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {E.ICONOS.map((ic) => (
                <button key={ic} onClick={() => setEditando({ ...editando, icono: ic })}
                  style={{ width: 42, height: 42, borderRadius: 10, display: 'grid', placeItems: 'center',
                    background: editando.icono === ic ? 'rgba(242,169,59,.16)' : 'var(--panel-2)',
                    color: editando.icono === ic ? 'var(--ambar)' : 'var(--texto-2)',
                    border: '1px solid ' + (editando.icono === ic ? 'var(--ambar)' : 'transparent') }}>
                  <Icono n={ic} s={19} />
                </button>
              ))}
            </div>
          </Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: GASTOS
   ============================================================ */
function formGastoVacio(catId) {
  return { id: E.uid('gs'), categoriaId: catId || '', fecha: E.hoy(), descripcion: '', proveedor: '', tipo: 'material', cantidad: '1', unidad: 'Unidad', precioUnitario: '', pagado: true, notas: '', fechaVencimiento: '', _esNuevo: true };
}

function Gastos({ estado, dinero, accion, brindar, filtroInicial, limpiarFiltroInicial }) {
  const [form, setForm] = useState(null);
  const [fCat, setFCat] = useState('');
  const [fTipo, setFTipo] = useState('');
  const [fMes, setFMes] = useState('');
  const [txt, setTxt] = useState('');
  const [fotos, setFotos] = useState([]);
  const [subiendo, setSubiendo] = useState(false);
  const [conteoFotos, setConteoFotos] = useState({});
  const [soloPendientes, setSoloPendientes] = useState(false);
  const [fotoAmpliada, setFotoAmpliada] = useState(null);
  const inputCamara = useRef(null);
  const inputGaleria = useRef(null);

  useEffect(() => {
    if (filtroInicial === 'pendientes') { setSoloPendientes(true); if (limpiarFiltroInicial) limpiarFiltroInicial(); }
  }, [filtroInicial]);

  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaCat = {};
  estado.categorias.forEach((c) => (mapaCat[c.id] = c));

  const refrescarConteo = () => { FOTOS.todas().then((t) => setConteoFotos(FOTOS.contarPorGasto(t))).catch(() => {}); };
  useEffect(refrescarConteo, [estado.gastos]);

  useEffect(() => {
    if (!form) { setFotos([]); return; }
    let vivo = true;
    FOTOS.listarPorGasto(form.id).then((l) => { if (vivo) setFotos(l); }).catch(() => { if (vivo) setFotos([]); });
    return () => { vivo = false; };
  }, [form && form.id]);

  useEffect(() => {
    if (!fotoAmpliada) return;
    const esc = (e) => { if (e.key === 'Escape') setFotoAmpliada(null); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [fotoAmpliada]);

  const todos = estado.gastos.filter((g) => g.proyectoId === estado.proyectoActivo);
  const meses = Array.from(new Set(todos.map((g) => E.mesDe(g.fecha)).filter(Boolean))).sort().reverse();

  const lista = todos
    .filter((g) => (!fCat || g.categoriaId === fCat) && (!fTipo || g.tipo === fTipo) && (!fMes || E.mesDe(g.fecha) === fMes))
    .filter((g) => (!soloPendientes || g.pagado === false))
    .filter((g) => { if (!txt.trim()) return true; const q = txt.toLowerCase(); return String(g.descripcion||'').toLowerCase().includes(q) || String(g.proveedor||'').toLowerCase().includes(q); })
    .sort((a, b) => soloPendientes ? ((a.fechaVencimiento||'') < (b.fechaVencimiento||'') ? -1 : 1) : (a.fecha < b.fecha ? 1 : -1));

  const total = E.r2(lista.reduce((s, g) => s + E.num(g.monto), 0));
  const previo = E.r2(E.num(form && form.cantidad) * E.num(form && form.precioUnitario));

  const cerrarForm = () => { if (form && form._esNuevo) FOTOS.eliminarPorGasto(form.id).catch(() => {}); setForm(null); };

  const agregarFotos = async (archivos) => {
    if (!archivos || archivos.length === 0) return;
    setSubiendo(true);
    try {
      for (const archivo of Array.from(archivos)) {
        if (!FOTOS.puedeAgregarMas(fotos)) { brindar('Máximo ' + FOTOS.MAX_FOTOS_POR_GASTO + ' fotos.', 'err'); break; }
        if (!/^image\//.test(archivo.type)) { brindar('"' + archivo.name + '" no es una imagen.', 'err'); continue; }
        try {
          const { dataURL, ancho, alto } = await FOTOS.comprimirArchivo(archivo);
          const registro = await FOTOS.guardar(form.id, dataURL, ancho, alto);
          setFotos((f) => f.concat([registro]));
        } catch (e) { brindar('No se pudo procesar la imagen.', 'err'); }
      }
    } finally { setSubiendo(false); refrescarConteo(); }
  };

  const quitarFoto = (id) => { FOTOS.eliminar(id).then(() => { setFotos((f) => f.filter((x) => x.id !== id)); refrescarConteo(); }).catch(() => brindar('Error al borrar foto.', 'err')); };

  const guardarGasto = () => {
    if (!form.categoriaId) return brindar('Elige una categoría.', 'err');
    if (!form.descripcion.trim()) return brindar('Describe el gasto.', 'err');
    if (E.num(form.precioUnitario) <= 0) return brindar('El precio unitario debe ser mayor a cero.', 'err');
    const limpio = E.normalizarGasto({ id: form.id, proyectoId: estado.proyectoActivo, categoriaId: form.categoriaId, fecha: form.fecha, descripcion: form.descripcion.trim(), proveedor: form.proveedor.trim(), tipo: form.tipo, cantidad: form.cantidad, unidad: form.unidad, precioUnitario: form.precioUnitario, pagado: form.pagado, notas: form.notas, fechaVencimiento: form.fechaVencimiento, creado: form.creado });
    accion((s) => ({ ...s, gastos: form._esNuevo ? s.gastos.concat([limpio]) : s.gastos.map((g) => g.id === form.id ? limpio : g) }));
    brindar(form._esNuevo ? 'Gasto registrado.' : 'Gasto actualizado.', 'ok');
    setForm(null); refrescarConteo();
  };

  const borrarGasto = (g) => {
    if (!confirm('¿Borrar "' + (g.descripcion || '') + '"?')) return;
    accion((s) => ({ ...s, gastos: s.gastos.filter((x) => x.id !== g.id) }));
    FOTOS.eliminarPorGasto(g.id).then(refrescarConteo).catch(() => {});
    brindar('Gasto eliminado.', 'ok');
  };

  const alternarPago = (g) => { accion((s) => ({ ...s, gastos: s.gastos.map((x) => x.id === g.id ? { ...x, pagado: !x.pagado } : x) })); };

  const UNIDADES = ['Unidad', 'm²', 'm³', 'Libras', 'Bolsa', 'Caja', 'Global', 'Jornal', 'qq', 'ml', 'L'];

  return (
    <div>
      {fotoAmpliada ? (
        <div onMouseDown={(e) => { if (e.target === e.currentTarget) setFotoAmpliada(null); }}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.92)', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <img src={fotoAmpliada} alt="Factura" style={{ maxWidth: '90vw', maxHeight: '85vh', borderRadius: 12, objectFit: 'contain' }} />
          <button onClick={() => setFotoAmpliada(null)} style={{ position: 'fixed', top: 18, right: 18, width: 40, height: 40, borderRadius: '50%', background: 'rgba(255,255,255,.12)', border: '1px solid rgba(255,255,255,.22)', display: 'grid', placeItems: 'center', color: '#fff' }}>
            <Icono n="equis" s={20} c="#fff" />
          </button>
        </div>
      ) : null}

      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Movimientos</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(formGastoVacio(fCat || (cats[0] || {}).id))}><Icono n="mas" s={16} />Registrar gasto</button>
        </div>
        <div className="filtros">
          <input placeholder="Buscar…" value={txt} onChange={(e) => setTxt(e.target.value)} />
          <select value={fCat} onChange={(e) => setFCat(e.target.value)}><option value="">Todas</option>{cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select>
          <select value={fTipo} onChange={(e) => setFTipo(e.target.value)}><option value="">Todo tipo</option>{E.TIPOS_GASTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <select value={fMes} onChange={(e) => setFMes(e.target.value)}><option value="">Todo el periodo</option>{meses.map((m) => <option key={m} value={m}>{E.nombreMes(m)}</option>)}</select>
        </div>
        {soloPendientes ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '0 0 12px', padding: '9px 12px', background: 'rgba(242,169,59,.1)', border: '1px solid rgba(242,169,59,.3)', borderRadius: 10 }}>
            <Icono n="reloj" s={16} c="var(--ambar)" />
            <span style={{ fontSize: 13.5, color: 'var(--ambar-claro)', flex: 1 }}>Mostrando solo pendientes de pago</span>
            <button className="btn btn-sm" onClick={() => setSoloPendientes(false)}>Quitar filtro</button>
          </div>
        ) : null}
        {lista.length === 0 ? (
          <Vacio icono="gastos" titulo="No hay gastos" texto="Ajusta filtros o registra el primero."
            accion={<button className="btn btn-p" onClick={() => setForm(formGastoVacio((cats[0]||{}).id))}><Icono n="mas" s={16} />Registrar</button>} />
        ) : (
          <React.Fragment>
            <div className="tabla-cont">
              <table>
                <thead><tr><th style={{width:78}}>Fecha</th><th>Detalle</th><th>Categoría</th><th className="der">Monto</th><th>Vence</th><th className="cen">Foto</th><th className="cen">Pagado</th><th className="der"></th></tr></thead>
                <tbody>
                  {lista.map((g) => {
                    const c = mapaCat[g.categoriaId];
                    const nFotos = conteoFotos[g.id] || 0;
                    const dias = g.fechaVencimiento ? E.diasHasta(g.fechaVencimiento) : null;
                    return (
                      <tr key={g.id}>
                        <td className="mono" style={{fontSize:13}}>{fFecha(g.fecha)}</td>
                        <td>
                          <div style={{fontWeight:600}}>{g.descripcion || 'Sin descripción'}</div>
                          <div className="mini">{g.proveedor || 'Sin proveedor'} · {(E.TIPOS_GASTO.find((t)=>t.id===g.tipo)||{label:'Otro'}).label}</div>
                        </td>
                        <td>{c ? <span style={{display:'inline-flex',alignItems:'center',gap:7}}><Icono n={c.icono} s={15} c="var(--ambar)" /><span style={{fontSize:13.5}}>{c.nombre}</span></span> : <Chip estado="excedido" texto="Sin cat." />}</td>
                        <td className="der mono" style={{fontWeight:700}}>{dinero(g.monto)}</td>
                        <td>
                          {!g.pagado && g.fechaVencimiento ? (
                            <span className="mono" style={{fontSize:12.5,fontWeight:dias!==null&&dias<=3?700:400,color:dias<0?'var(--rojo)':dias<=3?'var(--ambar)':undefined}}>
                              {fFecha(g.fechaVencimiento)} {dias!==null?'('+dias+'d)':''}
                            </span>
                          ) : <span className="tenue" style={{fontSize:12}}>—</span>}
                        </td>
                        <td className="cen">
                          <button className="btn-icono" onClick={() => setForm({...g,cantidad:String(g.cantidad),precioUnitario:String(g.precioUnitario),descripcion:g.descripcion||'',proveedor:g.proveedor||'',notas:g.notas||'',_esNuevo:false})}>
                            <Icono n="camara" s={17} c={nFotos?'var(--ambar)':'var(--texto-3)'} />
                          </button>
                          {nFotos > 0 ? <span className="mini mono">{nFotos}</span> : null}
                        </td>
                        <td className="cen">
                          <button className="btn-icono" onClick={() => alternarPago(g)}>
                            <Icono n={g.pagado ? 'check' : 'reloj'} s={18} c={g.pagado ? 'var(--menta)' : 'var(--ambar)'} />
                          </button>
                        </td>
                        <td className="der" style={{whiteSpace:'nowrap'}}>
                          <button className="btn-icono" onClick={() => setForm({...g,cantidad:String(g.cantidad),precioUnitario:String(g.precioUnitario),descripcion:g.descripcion||'',proveedor:g.proveedor||'',notas:g.notas||'',_esNuevo:false})}><Icono n="lapiz" s={17} /></button>
                          <button className="btn-icono" onClick={() => borrarGasto(g)}><Icono n="basura" s={17} /></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 14, borderTop: '2px solid var(--borde-fuerte)' }}>
              <span className="mini">{lista.length} movimiento(s)</span>
              <span className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{dinero(total)}</span>
            </div>
          </React.Fragment>
        )}
      </div>

      {form ? (
        <Modal titulo={form._esNuevo ? 'Registrar gasto' : 'Editar gasto'} onCerrar={cerrarForm}
          pie={<React.Fragment><button className="btn" onClick={cerrarForm}>Cancelar</button><button className="btn btn-p" onClick={guardarGasto}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Descripción"><input value={form.descripcion} autoFocus placeholder="Ej. Cemento gris" onChange={(e) => setForm({...form,descripcion:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Categoría"><select value={form.categoriaId} onChange={(e) => setForm({...form,categoriaId:e.target.value})}><option value="">Elegir…</option>{cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select></Campo>
            <Campo etq="Tipo"><select value={form.tipo} onChange={(e) => setForm({...form,tipo:e.target.value})}>{E.TIPOS_GASTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></Campo>
          </div>
          <div className="dos">
            <Campo etq="Fecha"><input type="date" value={form.fecha} onChange={(e) => setForm({...form,fecha:e.target.value})} /></Campo>
            <Campo etq="Proveedor"><CampoProveedor valor={form.proveedor} onChange={(v) => setForm({...form,proveedor:v})} proveedores={estado.proveedores} accion={accion} brindar={brindar} /></Campo>
          </div>
          <div className="tres">
            <Campo etq="Cantidad"><input className="mono" inputMode="decimal" value={form.cantidad} onChange={(e) => setForm({...form,cantidad:e.target.value})} /></Campo>
            <Campo etq="Unidad"><select value={UNIDADES.includes(form.unidad)?form.unidad:'Unidad'} onChange={(e)=>setForm({...form,unidad:e.target.value})}>{UNIDADES.map((u)=><option key={u}>{u}</option>)}</select></Campo>
            <Campo etq="Precio unitario"><input className="mono" inputMode="decimal" value={form.precioUnitario} placeholder="0.00" onChange={(e) => setForm({...form,precioUnitario:e.target.value})} /></Campo>
          </div>
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--panel-2)',borderRadius:10,padding:'12px 14px',marginBottom:14 }}>
            <span style={{fontSize:12,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700}}>Monto</span>
            <span className="mono" style={{fontSize:20,fontWeight:700,color:'var(--ambar)'}}>{dinero(previo)}</span>
          </div>
          <label className="interruptor" style={{marginBottom:form.pagado?18:10}}>
            <input type="checkbox" checked={form.pagado} onChange={(e) => setForm({...form,pagado:e.target.checked,fechaVencimiento:e.target.checked?'':form.fechaVencimiento})} />
            <span className="pista-sw" /><span>Ya está pagado</span>
          </label>
          {!form.pagado ? <Campo etq="Vence el"><input type="date" value={form.fechaVencimiento||''} onChange={(e) => setForm({...form,fechaVencimiento:e.target.value})} /></Campo> : null}
          <Campo etq={'Fotos (' + fotos.length + '/' + FOTOS.MAX_FOTOS_POR_GASTO + ')'}>
            <div style={{display:'flex',flexWrap:'wrap',gap:9}}>
              {fotos.map((f) => (
                <div key={f.id} style={{position:'relative',width:68,height:68,borderRadius:10,overflow:'hidden',border:'1px solid var(--borde)'}}>
                  <img src={f.dataURL} alt="Factura" style={{width:'100%',height:'100%',objectFit:'cover',cursor:'zoom-in'}} onClick={() => setFotoAmpliada(f.dataURL)} />
                  <button onClick={() => quitarFoto(f.id)} style={{position:'absolute',top:2,right:2,width:20,height:20,borderRadius:'50%',background:'rgba(8,17,19,.85)',display:'grid',placeItems:'center'}}><Icono n="equis" s={12} c="#fff" /></button>
                </div>
              ))}
              {FOTOS.puedeAgregarMas(fotos) ? (
                <React.Fragment>
                  <button onClick={() => inputCamara.current && inputCamara.current.click()} disabled={subiendo} style={{width:68,height:68,borderRadius:10,border:'1px dashed var(--borde-fuerte)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,color:'var(--texto-2)'}}><Icono n="camara" s={19} /><span style={{fontSize:10}}>Cámara</span></button>
                  <button onClick={() => inputGaleria.current && inputGaleria.current.click()} disabled={subiendo} style={{width:68,height:68,borderRadius:10,border:'1px dashed var(--borde-fuerte)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,color:'var(--texto-2)'}}><Icono n="ofertas" s={19} /><span style={{fontSize:10}}>Galería</span></button>
                </React.Fragment>
              ) : null}
            </div>
            <input ref={inputCamara} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={(e) => {agregarFotos(e.target.files);e.target.value='';}} />
            <input ref={inputGaleria} type="file" accept="image/*" multiple style={{display:'none'}} onChange={(e) => {agregarFotos(e.target.files);e.target.value='';}} />
            <div className="mini" style={{marginTop:8}}>Se guarda en este dispositivo, comprimida.</div>
          </Campo>
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} placeholder="Detalles, número de factura…" /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: OFERTAS (COMPARATIVO)
   ============================================================ */
function articuloVacio() { return { id: E.uid('ar'), descripcion: '', cantidad: '1', unidad: 'unidad' }; }
function ofertaVacia(articulos) {
  return { id: E.uid('of'), proveedor: '', precios: (articulos || []).map((a) => ({ articuloId: a.id, precioUnitario: '' })), total: '', dias: '', calidad: '3', garantia: '', notas: '' };
}
function licVacia(proyectoId, catId) {
  const arts = [articuloVacio()];
  return { id: null, proyectoId, categoriaId: catId || '', titulo: '', articulos: arts, notas: '', pesos: { ...E.PESOS_DEFECTO }, ofertas: [ofertaVacia(arts), ofertaVacia(arts), ofertaVacia(arts)], adjudicadaA: null };
}

function Ofertas({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [abierta, setAbierta] = useState(null);
  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaCat = {}; estado.categorias.forEach((c) => (mapaCat[c.id] = c));
  const lics = estado.licitaciones.filter((l) => l.proyectoId === estado.proyectoActivo);

  const guardarLic = () => {
    if (!form.titulo.trim()) return brindar('Ponle título.', 'err');
    const articulos = (form.articulos || []).filter((a) => a.descripcion.trim()).map((a) => ({ id: a.id, descripcion: a.descripcion.trim(), cantidad: E.num(a.cantidad), unidad: a.unidad || 'unidad' }));
    if (articulos.length === 0) return brindar('Agrega al menos un artículo.', 'err');
    const ofertas = form.ofertas.filter((o) => String(o.proveedor||'').trim() || E.num(o.total) > 0 || (o.precios||[]).some((p) => E.num(p.precioUnitario) > 0))
      .map((o) => ({ id: o.id, proveedor: String(o.proveedor||'').trim()||'Sin nombre', precios: (o.precios||[]).map((p) => ({ articuloId: p.articuloId, precioUnitario: E.r2(p.precioUnitario) })), total: E.r2(o.total), dias: E.num(o.dias), calidad: E.num(o.calidad), garantia: E.num(o.garantia), notas: o.notas||'' }));
    if (ofertas.length === 0) return brindar('Ingresa al menos una oferta con precio.', 'err');
    const lic = { id: form.id || E.uid('li'), proyectoId: estado.proyectoActivo, categoriaId: form.categoriaId, titulo: form.titulo.trim(), articulos, notas: form.notas, pesos: { precio: E.num(form.pesos.precio), calidad: E.num(form.pesos.calidad), tiempo: E.num(form.pesos.tiempo), garantia: E.num(form.pesos.garantia) }, ofertas, adjudicadaA: ofertas.some((o)=>o.id===form.adjudicadaA)?form.adjudicadaA:null, creado: form.creado || new Date().toISOString() };
    accion((s) => ({ ...s, licitaciones: form.id ? s.licitaciones.map((l) => l.id === form.id ? lic : l) : s.licitaciones.concat([lic]) }));
    brindar(form.id ? 'Actualizado.' : 'Creado.', 'ok');
    setAbierta(lic.id); setForm(null);
  };

  const borrarLic = (l) => { if (!confirm('¿Borrar "' + l.titulo + '"?')) return; accion((s) => ({ ...s, licitaciones: s.licitaciones.filter((x) => x.id !== l.id) })); brindar('Eliminado.', 'ok'); };
  const adjudicar = (l, ofertaId) => { accion((s) => ({ ...s, licitaciones: s.licitaciones.map((x) => x.id === l.id ? { ...x, adjudicadaA: x.adjudicadaA === ofertaId ? null : ofertaId } : x) })); };

  const editarLic = (l) => {
    const arts = (l.articulos || []).length > 0
      ? (l.articulos||[]).map((a) => ({ id: a.id||E.uid('ar'), descripcion: a.descripcion||'', cantidad: String(a.cantidad||1), unidad: a.unidad||'unidad' }))
      : [{ id: E.uid('ar'), descripcion: l.titulo||'', cantidad: String(l.cantidad||1), unidad: l.unidad||'unidad' }];
    const previas = (l.ofertas||[]).map((o) => ({
      id: o.id||E.uid('of'), proveedor: o.proveedor||'',
      precios: arts.map((a) => {
        const existente = (o.precios||[]).find((p) => p.articuloId === a.id);
        return { articuloId: a.id, precioUnitario: String(existente ? existente.precioUnitario : (o.precioUnitario||'')) };
      }),
      total: String(o.total||''), dias: String(o.dias||''), calidad: String(o.calidad||''), garantia: String(o.garantia||''), notas: o.notas||''
    }));
    while (previas.length < 3) previas.push(ofertaVacia(arts));
    setForm({ ...l, titulo: l.titulo||'', articulos: arts, notas: l.notas||'', pesos: { ...E.PESOS_DEFECTO, ...(l.pesos||{}) }, ofertas: previas });
  };

  return (
    <div>
      <div className="tarjeta-cab" style={{marginBottom:16}}>
        <div>
          <h3 style={{fontSize:18}}>Comparativo de ofertas</h3>
          <div className="mini" style={{marginTop:4}}>Ingresa propuestas por partida. El sistema marca la más económica y mejor relación valor/precio.</div>
        </div>
        <button className="btn btn-p btn-sm" onClick={() => setForm(licVacia(estado.proyectoActivo,(cats[0]||{}).id))}><Icono n="mas" s={16} />Nuevo comparativo</button>
      </div>
      {lics.length === 0 ? (
        <div className="tarjeta"><Vacio icono="ofertas" titulo="Sin comparativos" texto="Crea uno para comparar proveedores."
          accion={<button className="btn btn-p" onClick={() => setForm(licVacia(estado.proyectoActivo,(cats[0]||{}).id))}><Icono n="mas" s={16} />Nuevo</button>} /></div>
      ) : (
        <div className="rejilla" style={{gap:14}}>
          {lics.map((l) => {
            const r = E.compararOfertas(l);
            const cat = mapaCat[l.categoriaId];
            const expandida = abierta === l.id;
            return (
              <div className="tarjeta" key={l.id}>
                <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-start',flexWrap:'wrap'}}>
                  <div style={{display:'flex',gap:11,minWidth:0,flex:1}}>
                    <div className="cat-icono"><Icono n={cat?cat.icono:'ofertas'} s={17} /></div>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:15.5}}>{l.titulo}</div>
                      <div className="mini">{cat?cat.nombre:'Sin categoría'} · {(l.articulos||[]).length || 1} artículo(s) · {(l.ofertas||[]).length} oferta(s)</div>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:4,alignItems:'center'}}>
                    <button className="btn-icono" onClick={() => editarLic(l)}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrarLic(l)}><Icono n="basura" s={17} /></button>
                    <button className="btn btn-sm" onClick={() => setAbierta(expandida?null:l.id)}><Icono n={expandida?'abajo':'derecha'} s={15} />{expandida?'Ocultar':'Comparar'}</button>
                  </div>
                </div>
                {r.resumen ? (
                  <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10,marginTop:15}}>
                    <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px'}}><div className="mini">Más económica</div><div style={{fontWeight:700,fontSize:13.5,marginTop:3}}>{r.resumen.economica.proveedor}</div><div className="mono pos" style={{fontSize:13}}>{dinero(r.resumen.minTotal,true)}</div></div>
                    <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px'}}><div className="mini">Mejor valor</div><div style={{fontWeight:700,fontSize:13.5,marginTop:3}}>{r.resumen.mejorValor.proveedor}</div><div className="mono" style={{fontSize:13,color:'var(--ambar)'}}>{r.resumen.mejorValor.puntaje} pts</div></div>
                    <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px'}}><div className="mini">Brecha</div><div className="mono" style={{fontWeight:700,fontSize:13.5,marginTop:3}}>{dinero(r.resumen.rango,true)}</div><div className="mini">{r.resumen.rangoPct}%</div></div>
                    <div style={{background:'var(--panel-2)',borderRadius:10,padding:'10px 12px'}}><div className="mini">Adjudicada</div><div style={{fontWeight:700,fontSize:13.5,marginTop:3}}>{r.resumen.adjudicada?r.resumen.adjudicada.proveedor:'Pendiente'}</div></div>
                  </div>
                ) : <div className="aviso a-info" style={{marginTop:14}}><Icono n="info" s={17} /><span>Sin ofertas con precio.</span></div>}
                {expandida && r.resumen ? (
                  <React.Fragment>
                    <div className="sep" />
                    <div className="tabla-cont">
                      <table>
                        <thead><tr><th>Proveedor</th><th className="der">P.U.</th><th className="der">Total</th><th className="cen">Entrega</th><th className="cen">Calidad</th><th style={{width:100}}>Puntaje</th><th className="der">Acción</th></tr></thead>
                        <tbody>
                          {r.ofertas.map((o) => (
                            <tr key={o.id} className={o.esMejorValor?'ganadora':''}>
                              <td>
                                <div style={{fontWeight:600}}>{o.proveedor}</div>
                                <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:4}}>
                                  {o.esEconomica?<Chip estado="sano" texto="Más barata" />:null}
                                  {o.esMejorValor?<Chip estado="alerta" texto="Mejor valor" />:null}
                                  {o.esAdjudicada?<Chip estado="neutro" texto="Adjudicada" />:null}
                                </div>
                              </td>
                              <td className="der mono">{dinero(o.precioUnitario)}</td>
                              <td className="der mono" style={{fontWeight:700}}>{dinero(o.total)}</td>
                              <td className="cen mono">{o.dias>0?o.dias+'d':'—'}</td>
                              <td className="cen mono">{o.calidad>0?o.calidad+'/5':'—'}</td>
                              <td><div className="mono" style={{fontWeight:700,fontSize:14}}>{o.puntaje}</div><div className="barrita"><i style={{width:o.puntaje+'%'}} /></div></td>
                              <td className="der" style={{whiteSpace:'nowrap'}}>
                                <button className="btn btn-sm" onClick={() => adjudicar(l,o.id)}>{o.esAdjudicada?'Quitar':'Adjudicar'}</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </React.Fragment>
                ) : null}
              </div>
            );
          })}
        </div>
      )}
      {form ? (
        <Modal ancho={720} titulo={form.id?'Editar comparativo':'Nuevo comparativo'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarLic}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <div className="dos">
            <Campo etq="Título del comparativo"><input value={form.titulo} autoFocus placeholder="Ej. Materiales de piso" onChange={(e) => setForm({...form,titulo:e.target.value})} /></Campo>
            <Campo etq="Categoría"><select value={form.categoriaId} onChange={(e) => setForm({...form,categoriaId:e.target.value})}><option value="">Sin asignar</option>{cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select></Campo>
          </div>
          <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700,marginBottom:10}}>Artículos a cotizar</div>
          {(form.articulos||[]).map((art,ai) => (
            <div key={art.id} style={{display:'flex',gap:8,alignItems:'flex-end',marginBottom:8,flexWrap:'wrap'}}>
              <div style={{flex:2,minWidth:120}}><input value={art.descripcion} placeholder="Descripción" style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,articulos:form.articulos.map((a,j)=>j===ai?{...a,descripcion:e.target.value}:a)})} /></div>
              <div style={{width:70}}><input className="mono" value={art.cantidad} placeholder="Cant." style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,articulos:form.articulos.map((a,j)=>j===ai?{...a,cantidad:e.target.value}:a)})} /></div>
              <div style={{width:80}}><input value={art.unidad} placeholder="Unidad" style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,articulos:form.articulos.map((a,j)=>j===ai?{...a,unidad:e.target.value}:a)})} /></div>
              {(form.articulos||[]).length > 1 ? <button className="btn-icono" onClick={() => {
                const nuevosArts = form.articulos.filter((_,j)=>j!==ai);
                const artId = art.id;
                setForm({...form, articulos: nuevosArts, ofertas: form.ofertas.map((o) => ({...o, precios: (o.precios||[]).filter((p) => p.articuloId !== artId)}))});
              }}><Icono n="equis" s={16} /></button> : null}
            </div>
          ))}
          <button className="btn btn-sm" style={{marginBottom:14}} onClick={() => {
            const nuevoArt = articuloVacio();
            setForm({...form, articulos: (form.articulos||[]).concat([nuevoArt]), ofertas: form.ofertas.map((o) => ({...o, precios: (o.precios||[]).concat([{articuloId: nuevoArt.id, precioUnitario: ''}])}))});
          }}><Icono n="mas" s={15} />Agregar artículo</button>
          <div style={{background:'var(--panel-2)',borderRadius:12,padding:14,marginBottom:16}}>
            <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700,marginBottom:10}}>Peso de cada criterio</div>
            {[['precio','Precio'],['calidad','Calidad'],['tiempo','Entrega'],['garantia','Garantía']].map(([k,etq]) => (
              <div key={k} style={{marginBottom:9}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span>{etq}</span><span className="mono" style={{color:'var(--ambar)'}}>{form.pesos[k]}</span></div>
                <input type="range" min="0" max="100" step="5" value={form.pesos[k]} onChange={(e) => setForm({...form,pesos:{...form.pesos,[k]:Number(e.target.value)}})} />
              </div>
            ))}
          </div>
          <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700,marginBottom:10}}>Ofertas recibidas</div>
          {form.ofertas.map((o,i) => (
            <div key={o.id} style={{border:'1px solid var(--borde)',borderRadius:12,padding:13,marginBottom:11}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9}}>
                <span className="mono" style={{fontSize:11,color:'var(--texto-3)'}}>OFERTA {i+1}</span>
                {form.ofertas.length > 1 ? <button className="btn-icono" onClick={() => setForm({...form,ofertas:form.ofertas.filter((_,j)=>j!==i)})}><Icono n="equis" s={16} /></button> : null}
              </div>
              <Campo etq="Proveedor"><CampoProveedor valor={o.proveedor} onChange={(v) => setForm({...form,ofertas:form.ofertas.map((x,j)=>j===i?{...x,proveedor:v}:x)})} proveedores={estado.proveedores} accion={accion} brindar={brindar} /></Campo>
              {(form.articulos||[]).map((art, pi) => {
                const precio = (o.precios||[]).find((p) => p.articuloId === art.id);
                const pu = precio ? precio.precioUnitario : '';
                return (
                  <div key={art.id} style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
                    <span style={{flex:1,fontSize:12.5,color:'var(--texto-3)'}}>{art.descripcion || 'Artículo ' + (pi+1)} ({art.cantidad} {art.unidad})</span>
                    <input className="mono" style={{width:100,background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'7px 10px',color:'var(--texto)',fontSize:13}} inputMode="decimal" value={pu} placeholder="P.U." onChange={(e) => {
                      const nuevosPrecios = (o.precios||[]).map((p) => p.articuloId === art.id ? {...p, precioUnitario: e.target.value} : p);
                      if (!nuevosPrecios.some((p) => p.articuloId === art.id)) nuevosPrecios.push({articuloId: art.id, precioUnitario: e.target.value});
                      setForm({...form, ofertas: form.ofertas.map((x,j) => j===i ? {...x, precios: nuevosPrecios} : x)});
                    }} />
                    <span className="mono" style={{width:70,fontSize:12,textAlign:'right',fontWeight:600}}>{dinero(E.r2(E.num(pu)*E.num(art.cantidad)),true)}</span>
                  </div>
                );
              })}
              <Campo etq="Total global (opcional)"><input className="mono" inputMode="decimal" value={o.total} placeholder="Dejar vacío para calcular" onChange={(e) => setForm({...form,ofertas:form.ofertas.map((x,j)=>j===i?{...x,total:e.target.value}:x)})} /></Campo>
              <div className="tres">
                <Campo etq="Días entrega"><input className="mono" inputMode="numeric" value={o.dias} onChange={(e) => setForm({...form,ofertas:form.ofertas.map((x,j)=>j===i?{...x,dias:e.target.value}:x)})} /></Campo>
                <Campo etq="Calidad (1-5)"><select value={o.calidad} onChange={(e) => setForm({...form,ofertas:form.ofertas.map((x,j)=>j===i?{...x,calidad:e.target.value}:x)})}><option value="">—</option>{[1,2,3,4,5].map((n)=><option key={n} value={n}>{n}</option>)}</select></Campo>
                <Campo etq="Garantía (meses)"><input className="mono" inputMode="numeric" value={o.garantia} onChange={(e) => setForm({...form,ofertas:form.ofertas.map((x,j)=>j===i?{...x,garantia:e.target.value}:x)})} /></Campo>
              </div>
            </div>
          ))}
          {form.ofertas.length < 6 ? <button className="btn btn-sm" onClick={() => setForm({...form,ofertas:form.ofertas.concat([ofertaVacia(form.articulos)])})}><Icono n="mas" s={15} />Agregar oferta</button> : null}
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: ÓRDENES DE COMPRA
   ============================================================ */
function itemVacio() { return { id: E.uid('it'), descripcion: '', marca: '', cantidad: '1', unidad: 'Unidad', precioUnitario: '' }; }

function Ordenes({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [fEstado, setFEstado] = useState('');
  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const ordenes = (estado.ordenes || []).filter((o) => o.proyectoId === estado.proyectoActivo && (!fEstado || o.estado === fEstado))
    .sort((a, b) => a.fecha < b.fecha ? 1 : -1);

  const CHIP_ORDEN = { borrador: 'sinPresupuesto', aprobada: 'alerta', recibida: 'sano', cancelada: 'excedido' };
  const ETQ_ORDEN = { borrador: 'Borrador', aprobada: 'Aprobada', recibida: 'Recibida', cancelada: 'Cancelada' };

  const abrirNueva = () => setForm({ id: null, numero: 'OC-' + String(Date.now()).slice(-5), categoriaId: (cats[0]||{}).id||'', proveedor: '', fecha: E.hoy(), fechaEntrega: '', items: [itemVacio(), itemVacio()], impuesto: '0', retencionIR: false, estado: 'borrador', notas: '' });

  const subForm = () => {
    if (!form) return 0;
    return form.items.reduce((s, it) => s + E.r2(E.num(it.cantidad) * E.num(it.precioUnitario)), 0);
  };
  const totalForm = () => {
    if (!form) return 0;
    const sub = subForm();
    const imp = E.r2(sub * E.num(form.impuesto) / 100);
    const ret = form.retencionIR ? E.r2(sub * 0.02) : 0;
    return E.r2(sub + imp - ret);
  };

  const guardarOrden = () => {
    if (!form.proveedor.trim()) return brindar('Indica el proveedor.', 'err');
    const items = form.items.filter((it) => it.descripcion.trim() && E.num(it.precioUnitario) > 0);
    if (items.length === 0) return brindar('Agrega al menos un ítem con precio.', 'err');
    const orden = E.normalizarOrden({ id: form.id || E.uid('oc'), proyectoId: estado.proyectoActivo, categoriaId: form.categoriaId, numero: form.numero, proveedor: form.proveedor.trim(), fecha: form.fecha, fechaEntrega: form.fechaEntrega, items: items.map((it) => ({ id: it.id, descripcion: it.descripcion.trim(), marca: (it.marca||'').trim(), cantidad: E.num(it.cantidad), unidad: it.unidad || 'Unidad', precioUnitario: E.r2(it.precioUnitario) })), impuesto: E.num(form.impuesto), retencionIR: !!form.retencionIR, estado: form.estado, notas: form.notas, creado: form.creado });
    accion((s) => ({ ...s, ordenes: form.id ? (s.ordenes||[]).map((o) => o.id === form.id ? orden : o) : (s.ordenes||[]).concat([orden]) }));
    brindar(form.id ? 'Orden actualizada.' : 'Orden creada.', 'ok');
    setForm(null);
  };

  const cambiarEstadoOrden = (o, nuevoEstado) => {
    accion((s) => ({ ...s, ordenes: (s.ordenes||[]).map((x) => x.id === o.id ? { ...x, estado: nuevoEstado } : x) }));
    brindar('Orden ' + ETQ_ORDEN[nuevoEstado].toLowerCase() + '.', 'ok');
  };

  const borrarOrden = (o) => {
    if (!confirm('¿Borrar la orden ' + o.numero + '?')) return;
    accion((s) => ({ ...s, ordenes: (s.ordenes||[]).filter((x) => x.id !== o.id) }));
    brindar('Orden eliminada.', 'ok');
  };

  const imprimirOrden = (o) => {
    const items = o.items || [];
    const filas = items.map((it) =>
      '<tr><td>' + (it.descripcion||'') + (it.marca ? ' <small>(' + it.marca + ')</small>' : '') + '</td>' +
      '<td style="text-align:center">' + (it.unidad||'Unidad') + '</td>' +
      '<td style="text-align:right">' + E.num(it.cantidad).toLocaleString('es-NI') + '</td>' +
      '<td style="text-align:right">' + E.num(it.precioUnitario).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td>' +
      '<td style="text-align:right;font-weight:700">' + E.num(it.total).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td></tr>'
    ).join('');
    const retIR = o.retencionIR ? '<tr><td colspan="4" style="text-align:right">Retención IR 2%:</td><td style="text-align:right;color:#c00">-' + E.num(o.retencionIR).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td></tr>' : '';
    const w = window.open('', '_blank', 'width=800,height=600');
    w.document.write('<!DOCTYPE html><html><head><title>OC ' + o.numero + '</title>' +
      '<style>body{font-family:Arial,sans-serif;padding:30px;color:#111;font-size:13px}' +
      '.header{text-align:center;margin-bottom:24px;border-bottom:2px solid #333;padding-bottom:12px}' +
      '.header h2{margin:0;font-size:16px}.header p{margin:2px 0;font-size:12px;color:#555}' +
      'table{width:100%;border-collapse:collapse;margin-top:16px}' +
      'th,td{border:1px solid #ccc;padding:6px 8px;font-size:12px}' +
      'th{background:#f5f5f5;font-weight:700;text-align:left}' +
      '.info{display:flex;flex-wrap:wrap;gap:12px 30px;font-size:12px;margin:12px 0}' +
      '.info b{font-weight:700}.firmas{display:flex;justify-content:space-between;margin-top:60px}' +
      '.firma{text-align:center;width:200px;border-top:1px solid #333;padding-top:6px;font-size:11px}' +
      '@media print{body{padding:15px}}</style></head><body>' +
      '<div class="header"><h2>Iglesia Oasis de Amor</h2>' +
      '<p>RUC: J0810000163807</p>' +
      '<p>Km 10 carretera nueva a León, contiguo a DIINSA, Ciudad Sandino, Managua</p>' +
      '<p>Tel. 22691293</p></div>' +
      '<h3 style="margin:0 0 10px">ORDEN DE COMPRA: ' + o.numero + '</h3>' +
      '<div class="info">' +
      '<div><b>Proveedor:</b> ' + (o.proveedor||'') + '</div>' +
      '<div><b>Fecha:</b> ' + fFecha(o.fecha) + '</div>' +
      (o.fechaEntrega ? '<div><b>Entrega:</b> ' + fFecha(o.fechaEntrega) + '</div>' : '') +
      '<div><b>Estado:</b> ' + (ETQ_ORDEN[o.estado]||o.estado) + '</div></div>' +
      '<table><thead><tr><th>Descripción</th><th style="text-align:center">Unidad</th><th style="text-align:right">Cant.</th><th style="text-align:right">P.U.</th><th style="text-align:right">Total</th></tr></thead>' +
      '<tbody>' + filas + '</tbody>' +
      '<tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">Subtotal:</td><td style="text-align:right;font-weight:700">' + E.num(o.subtotal).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td></tr>' +
      (E.num(o.impuesto) > 0 ? '<tr><td colspan="4" style="text-align:right">Impuesto (' + o.impuesto + '%):</td><td style="text-align:right">' + E.r2(E.num(o.subtotal)*E.num(o.impuesto)/100).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td></tr>' : '') +
      retIR +
      '<tr style="font-size:14px"><td colspan="4" style="text-align:right;font-weight:700">TOTAL:</td><td style="text-align:right;font-weight:700">' + E.num(o.total).toLocaleString('es-NI',{minimumFractionDigits:2}) + '</td></tr>' +
      '</tfoot></table>' +
      (o.notas ? '<p style="margin-top:16px;font-size:11px"><b>Notas:</b> ' + o.notas + '</p>' : '') +
      '<div class="firmas"><div class="firma">Elaborado por</div><div class="firma">Autorizado por</div><div class="firma">Recibido por</div></div>' +
      '</body></html>');
    w.document.close();
    setTimeout(function() { w.print(); }, 400);
  };

  const pasarAGasto = (o) => {
    if (!o.categoriaId) return brindar('Asigna categoría a la orden primero.', 'err');
    if (!confirm('¿Registrar ' + dinero(o.total) + ' como gasto?')) return;
    const g = E.normalizarGasto({ proyectoId: estado.proyectoActivo, categoriaId: o.categoriaId, fecha: E.hoy(), descripcion: 'OC ' + o.numero + ': ' + o.proveedor, proveedor: o.proveedor, tipo: 'material', cantidad: 1, unidad: 'Global', precioUnitario: o.total, pagado: false, notas: 'Generado desde orden de compra ' + o.numero });
    accion((s) => ({ ...s, gastos: s.gastos.concat([g]) }));
    brindar('Gasto creado desde la orden.', 'ok');
  };

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Órdenes de compra</h3>
          <button className="btn btn-p btn-sm" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva orden</button>
        </div>
        <div className="filtros">
          <select value={fEstado} onChange={(e) => setFEstado(e.target.value)}>
            <option value="">Todos los estados</option>
            {Object.keys(ETQ_ORDEN).map((k) => <option key={k} value={k}>{ETQ_ORDEN[k]}</option>)}
          </select>
        </div>
        {ordenes.length === 0 ? (
          <Vacio icono="orden" titulo="Sin órdenes" texto="Crea tu primera orden de compra." accion={<button className="btn btn-p" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva orden</button>} />
        ) : (
          <div className="tabla-cont">
            <table>
              <thead><tr><th>N°</th><th>Proveedor</th><th>Fecha</th><th className="cen">Estado</th><th className="der">Total</th><th className="der">Acciones</th></tr></thead>
              <tbody>
                {ordenes.map((o) => (
                  <tr key={o.id}>
                    <td className="mono" style={{fontWeight:700,fontSize:13}}>{o.numero}</td>
                    <td><div style={{fontWeight:600}}>{o.proveedor}</div><div className="mini">{(o.items||[]).length} ítem(s)</div></td>
                    <td className="mono" style={{fontSize:13}}>{fFecha(o.fecha)}{o.fechaEntrega ? <span className="mini" style={{display:'block'}}>Entrega: {fFecha(o.fechaEntrega)}</span> : null}</td>
                    <td className="cen"><Chip estado={CHIP_ORDEN[o.estado]} texto={ETQ_ORDEN[o.estado]} /></td>
                    <td className="der mono" style={{fontWeight:700}}>{dinero(o.total)}</td>
                    <td className="der" style={{whiteSpace:'nowrap'}}>
                      {o.estado === 'borrador' ? <button className="btn btn-sm" style={{marginRight:4}} onClick={() => cambiarEstadoOrden(o,'aprobada')}>Aprobar</button> : null}
                      {o.estado === 'aprobada' ? <button className="btn btn-sm" style={{marginRight:4}} onClick={() => cambiarEstadoOrden(o,'recibida')}>Recibir</button> : null}
                      {o.estado === 'recibida' ? <button className="btn btn-sm" style={{marginRight:4}} onClick={() => pasarAGasto(o)}>A gasto</button> : null}
                      <button className="btn-icono" title="Imprimir" onClick={() => imprimirOrden(o)}><Icono n="imprimir" s={17} /></button>
                      <button className="btn-icono" onClick={() => {
                        const items = (o.items||[]).map((it)=>({...it,marca:it.marca||'',cantidad:String(it.cantidad),unidad:it.unidad||'Unidad',precioUnitario:String(it.precioUnitario)}));
                        while(items.length<2) items.push(itemVacio());
                        setForm({...o,impuesto:String(o.impuesto||0),retencionIR:!!o.retencionIR,items,notas:o.notas||''});
                      }}><Icono n="lapiz" s={17} /></button>
                      {o.estado !== 'recibida' ? <button className="btn-icono" onClick={() => borrarOrden(o)}><Icono n="basura" s={17} /></button> : null}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {form ? (
        <Modal ancho={700} titulo={form.id ? 'Editar orden' : 'Nueva orden de compra'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarOrden}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <div className="dos">
            <Campo etq="Número"><input value={form.numero} className="mono" onChange={(e) => setForm({...form,numero:e.target.value})} /></Campo>
            <Campo etq="Proveedor"><CampoProveedor valor={form.proveedor} onChange={(v) => setForm({...form,proveedor:v})} proveedores={estado.proveedores} accion={accion} brindar={brindar} /></Campo>
          </div>
          <div className="tres">
            <Campo etq="Categoría"><select value={form.categoriaId} onChange={(e) => setForm({...form,categoriaId:e.target.value})}><option value="">Sin asignar</option>{cats.map((c)=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></Campo>
            <Campo etq="Fecha"><input type="date" value={form.fecha} onChange={(e) => setForm({...form,fecha:e.target.value})} /></Campo>
            <Campo etq="Entrega prevista"><input type="date" value={form.fechaEntrega||''} onChange={(e) => setForm({...form,fechaEntrega:e.target.value})} /></Campo>
          </div>
          <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700,marginBottom:10}}>Ítems</div>
          {form.items.map((it,i) => (
            <div key={it.id} style={{display:'flex',gap:8,alignItems:'flex-end',marginBottom:8,flexWrap:'wrap'}}>
              <div style={{flex:2,minWidth:120}}><input value={it.descripcion} placeholder="Descripción" style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,items:form.items.map((x,j)=>j===i?{...x,descripcion:e.target.value}:x)})} /></div>
              <div style={{width:85}}><input value={it.marca||''} placeholder="Marca" style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,items:form.items.map((x,j)=>j===i?{...x,marca:e.target.value}:x)})} /></div>
              <div style={{width:70}}><input className="mono" value={it.cantidad} placeholder="Cant." style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,items:form.items.map((x,j)=>j===i?{...x,cantidad:e.target.value}:x)})} /></div>
              <div style={{width:80}}><select value={it.unidad||'Unidad'} style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:13}} onChange={(e) => setForm({...form,items:form.items.map((x,j)=>j===i?{...x,unidad:e.target.value}:x)})}>{['Unidad','m²','m³','Libras','Bolsa','Caja','Global','Jornal','qq','ml','L'].map((u)=><option key={u}>{u}</option>)}</select></div>
              <div style={{width:90}}><input className="mono" value={it.precioUnitario} placeholder="P.U." style={{background:'var(--fondo-2)',border:'1px solid var(--borde)',borderRadius:9,padding:'9px 10px',color:'var(--texto)',width:'100%',fontSize:14}} onChange={(e) => setForm({...form,items:form.items.map((x,j)=>j===i?{...x,precioUnitario:e.target.value}:x)})} /></div>
              <div className="mono" style={{width:85,fontSize:13,textAlign:'right',fontWeight:600}}>{dinero(E.r2(E.num(it.cantidad)*E.num(it.precioUnitario)),true)}</div>
              {form.items.length > 1 ? <button className="btn-icono" onClick={() => setForm({...form,items:form.items.filter((_,j)=>j!==i)})}><Icono n="equis" s={16} /></button> : null}
            </div>
          ))}
          <button className="btn btn-sm" style={{marginBottom:14}} onClick={() => setForm({...form,items:form.items.concat([itemVacio()])})}><Icono n="mas" s={15} />Agregar ítem</button>
          <label className="interruptor" style={{marginBottom:10}}>
            <input type="checkbox" checked={!!form.retencionIR} onChange={(e) => setForm({...form,retencionIR:e.target.checked})} />
            <span className="pista-sw" /><span>Aplicar retención IR 2%</span>
          </label>
          <div className="dos">
            <Campo etq="Impuesto (%)"><input className="mono" inputMode="decimal" value={form.impuesto} onChange={(e) => setForm({...form,impuesto:e.target.value})} /></Campo>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',justifyContent:'center',gap:4}}>
              {form.retencionIR ? <span className="mini mono" style={{color:'var(--rojo)'}}>IR 2%: -{dinero(E.r2(subForm() * 0.02))}</span> : null}
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:12,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--texto-3)',fontWeight:700}}>Total</span>
                <span className="mono" style={{fontSize:22,fontWeight:700,color:'var(--ambar)'}}>{dinero(totalForm())}</span>
              </div>
            </div>
          </div>
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
