<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obra Control — Gestión integral de proyectos</title>
<meta name="description" content="Control de presupuesto, gastos, ofertas, órdenes de compra y contratos para proyectos de construcción.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#081113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra Control">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --fondo:#081113;
  --fondo-2:#0B181B;
  --panel:#0F2126;
  --panel-2:#143036;
  --panel-3:#1B3D44;
  --borde:rgba(255,255,255,.09);
  --borde-fuerte:rgba(255,255,255,.16);
  --texto:#E9F3F4;
  --texto-2:#9BB2B7;
  --texto-3:#6B8085;
  --ambar:#F2A93B;
  --ambar-claro:#FFC96B;
  --ambar-oscuro:#C9871F;
  --menta:#45D6A6;
  --menta-oscuro:#1E8F6B;
  --rojo:#F2705B;
  --rojo-oscuro:#B03A28;
  --azul:#5BA8F2;
  --azul-oscuro:#2B6CB0;
  --sidebar:248px;
  --radio:14px;
  --radio-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);
  background-image:
    radial-gradient(1100px 600px at 12% -8%, rgba(242,169,59,.13), transparent 62%),
    radial-gradient(900px 620px at 96% 8%, rgba(69,214,166,.09), transparent 58%);
  background-attachment:fixed;
  color:var(--texto);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.02em;margin:0}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--ambar);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:9px}

.app{display:flex;min-height:100vh}
.lateral{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);
  background:linear-gradient(180deg,rgba(15,33,38,.98),rgba(8,17,19,.98));
  border-right:1px solid var(--borde);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:40;
  overflow-y:auto;
}
.marca{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
.marca-icono{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--ambar-claro),var(--ambar-oscuro));
  display:grid;place-items:center;color:#1A1005;
  box-shadow:0 6px 18px rgba(242,169,59,.28);
}
.marca-txt .n{font-family:'Oswald',sans-serif;font-size:20px;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.marca-txt .s{font-size:10.5px;color:var(--texto-3);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.nav-btn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radio-sm);
  color:var(--texto-2);font-weight:500;font-size:14px;transition:.15s;width:100%;text-align:left;
}
.nav-btn:hover{background:var(--panel);color:var(--texto)}
.nav-btn.on{background:var(--panel-2);color:var(--texto);box-shadow:inset 3px 0 0 var(--ambar)}
.nav-btn.on svg{color:var(--ambar)}
.nav-sep{height:1px;background:var(--borde);margin:8px 4px}
.lateral-pie{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--borde);font-size:11px;color:var(--texto-3)}

.principal{flex:1;margin-left:var(--sidebar);padding:26px 30px 60px;max-width:1500px}
.barra-inf{display:none}

.cabecera{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.cabecera h1{font-size:30px;text-transform:uppercase;letter-spacing:.05em}
.cabecera .sub{color:var(--texto-2);font-size:13.5px;margin-top:4px}
.acciones{display:flex;gap:9px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:var(--radio-sm);
  font-weight:600;font-size:14px;border:1px solid var(--borde);background:var(--panel);
  color:var(--texto);transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--borde-fuerte)}
.btn-p{background:linear-gradient(135deg,var(--ambar-claro),var(--ambar));color:#1A1005;border-color:transparent}
.btn-p:hover{background:linear-gradient(135deg,#FFD588,var(--ambar-claro));color:#1A1005}
.btn-peligro{color:var(--rojo);border-color:rgba(242,112,91,.35)}
.btn-peligro:hover{background:rgba(242,112,91,.12)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn-icono{padding:8px;border-radius:8px;color:var(--texto-2)}
.btn-icono:hover{background:var(--panel-2);color:var(--texto)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.rejilla{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}
.tarjeta{
  background:linear-gradient(160deg,var(--panel),var(--fondo-2));
  border:1px solid var(--borde);border-radius:var(--radio);padding:18px;
}
.kpi{position:relative;overflow:hidden}
.kpi-clickable{border:1px solid var(--borde);transition:.15s}
.kpi-clickable:hover{background:linear-gradient(160deg,var(--panel-3),var(--panel));border-color:var(--borde-fuerte)}
.kpi::after{content:'';position:absolute;left:18px;bottom:0;width:46px;height:3px;background:var(--ambar);border-radius:3px 3px 0 0}
.kpi.menta::after{background:var(--menta)}
.kpi.rojo::after{background:var(--rojo)}
.kpi.azul::after{background:var(--azul)}
.kpi .etq{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3);font-weight:600}
.kpi .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-top:9px;letter-spacing:-.02em;line-height:1.15}
.kpi .pie{font-size:12.5px;color:var(--texto-2);margin-top:6px}
.tarjeta h3{font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:var(--texto)}
.tarjeta-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}

.pista{height:8px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden}
.relleno{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.f-sano{background:linear-gradient(90deg,var(--menta-oscuro),var(--menta))}
.f-alerta{background:linear-gradient(90deg,var(--ambar-oscuro),var(--ambar-claro))}
.f-excedido{background:linear-gradient(90deg,var(--rojo-oscuro),var(--rojo))}
.f-sinPresupuesto{background:var(--panel-3)}

.fila-cat{padding:13px 0;border-bottom:1px solid var(--borde)}
.fila-cat:last-child{border-bottom:none}
.fila-cat-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.cat-icono{width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;color:var(--ambar);flex-shrink:0}
.fila-cat-nom{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-cat-cifras{display:flex;justify-content:space-between;font-size:12.5px;color:var(--texto-2);margin-top:7px;gap:10px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip-sano{background:rgba(69,214,166,.14);color:var(--menta)}
.chip-alerta{background:rgba(242,169,59,.15);color:var(--ambar-claro)}
.chip-excedido{background:rgba(242,112,91,.15);color:var(--rojo)}
.chip-sinPresupuesto{background:rgba(255,255,255,.07);color:var(--texto-3)}
.chip-neutro{background:var(--panel-2);color:var(--texto-2)}
.chip-azul{background:rgba(91,168,242,.14);color:var(--azul)}

.tabla-cont{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--texto-3);
  font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--borde);white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
.der{text-align:right}
.cen{text-align:center}

.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3);font-weight:700}
.campo input,.campo select,.campo textarea{
  background:var(--fondo-2);border:1px solid var(--borde);border-radius:9px;padding:11px 12px;
  color:var(--texto);width:100%;transition:.15s;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ambar);box-shadow:0 0 0 3px rgba(242,169,59,.14)}
.campo textarea{resize:vertical;min-height:64px}
.campo input.mono{font-family:'JetBrains Mono',monospace}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:var(--panel-3);border-radius:5px;padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--ambar);cursor:pointer;border:2px solid var(--fondo)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ambar);cursor:pointer;border:2px solid var(--fondo)}
.interruptor{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}
.interruptor input{display:none}
.pista-sw{width:40px;height:22px;border-radius:99px;background:var(--panel-3);position:relative;transition:.2s;flex-shrink:0}
.pista-sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--texto-2);transition:.2s}
.interruptor input:checked+.pista-sw{background:rgba(69,214,166,.35)}
.interruptor input:checked+.pista-sw::after{left:21px;background:var(--menta)}

.velo{position:fixed;inset:0;background:rgba(4,10,11,.78);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{
  background:linear-gradient(160deg,var(--panel),var(--fondo-2));border:1px solid var(--borde-fuerte);
  border-radius:18px;width:100%;max-width:560px;padding:22px;margin:auto;
  box-shadow:0 26px 70px rgba(0,0,0,.6);
}
.modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-cab h3{font-size:19px;text-transform:uppercase;letter-spacing:.05em}
.modal-pie{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.vacio{text-align:center;padding:44px 20px;color:var(--texto-3)}
.vacio svg{opacity:.35;margin-bottom:12px}
.vacio p{margin:0 0 4px;font-size:14px}
.aviso{display:flex;gap:11px;padding:12px 14px;border-radius:var(--radio-sm);font-size:13.5px;line-height:1.45;align-items:flex-start;margin-bottom:9px}
.aviso svg{flex-shrink:0;margin-top:1px}
.a-alto{background:rgba(242,112,91,.1);border:1px solid rgba(242,112,91,.24);color:#FFC3B8}
.a-medio{background:rgba(242,169,59,.09);border:1px solid rgba(242,169,59,.22);color:#FFDFA8}
.a-info{background:rgba(255,255,255,.045);border:1px solid var(--borde);color:var(--texto-2)}
.a-ok{background:rgba(69,214,166,.09);border:1px solid rgba(69,214,166,.22);color:#A9F0D8}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filtros select,.filtros input{
  background:var(--fondo-2);border:1px solid var(--borde);border-radius:9px;padding:9px 11px;color:var(--texto);font-size:13.5px;
}
.filtros input{flex:1;min-width:170px}
.filtros select:focus,.filtros input:focus{outline:none;border-color:var(--ambar)}
.brindis{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--panel-2);border:1px solid var(--borde-fuerte);border-radius:11px;padding:12px 18px;
  font-size:14px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;
  max-width:calc(100vw - 32px);
}
.brindis.ok{border-color:rgba(69,214,166,.4);color:var(--menta)}
.brindis.err{border-color:rgba(242,112,91,.4);color:var(--rojo)}
.pos{color:var(--menta)}
.neg{color:var(--rojo)}
.tenue{color:var(--texto-2)}
.mini{font-size:12px;color:var(--texto-3)}
.sep{height:1px;background:var(--borde);margin:16px 0}
.ganadora{background:rgba(69,214,166,.06)!important;box-shadow:inset 3px 0 0 var(--menta)}
.barrita{height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.barrita i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ambar-oscuro),var(--ambar-claro))}

.estrellas{display:inline-flex;gap:2px}
.estrella{cursor:pointer;color:var(--panel-3);transition:.15s}
.estrella.on{color:var(--ambar)}
.estrella:hover{color:var(--ambar-claro)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia{
  aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;position:relative;cursor:pointer;transition:.12s;
}
.cal-dia:hover{background:var(--panel-2)}
.cal-dia.hoy{background:var(--panel-2);border:1px solid var(--ambar);font-weight:700}
.cal-dia.sel{background:rgba(242,169,59,.18);border:1px solid var(--ambar)}
.cal-dia.otro{color:var(--texto-3);opacity:.4}
.cal-dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:4px}

.ajustes-movil{display:none}
@media(max-width:959px){
  .ajustes-movil{display:inline-flex}
  .lateral{display:none}
  .principal{margin-left:0;padding:20px 18px 100px}
  .barra-inf{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(11,24,27,.97);backdrop-filter:blur(14px);border-top:1px solid var(--borde);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;color:var(--texto-3);font-size:9px;font-weight:600;border-radius:9px}
  .tab.on{color:var(--ambar)}
  .cabecera h1{font-size:24px}
  .cabecera{align-items:flex-start;margin-bottom:18px}
  .kpi .val{font-size:22px}
}
@media(min-width:700px) and (max-width:959px){
  table{min-width:0}
  .tabla-cont{margin:0;padding:0}
}
@media(max-width:699px){
  body{font-size:14.5px}
  .principal{padding:16px 13px 100px}
  .tarjeta{padding:15px;border-radius:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:11px}
  .kpi .val{font-size:19px}
  .kpi .etq{font-size:9.5px}
  .kpi::after{left:15px;width:34px}
  .dos,.tres{grid-template-columns:1fr}
  .modal{padding:18px;border-radius:15px}
  .velo{padding:12px 10px}
  .acciones{width:100%}
  .acciones .btn{flex:1;justify-content:center}
  .tabla-cont{margin:0 -15px;padding:0 15px}
  .cal-dia{font-size:11px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function Icono({ n, s = 20, c }) {
  const def = TRAZOS[n] || TRAZOS.info;
  const partes = def.split('|');
  const nodos = [];
  partes.forEach((p, i) => {
    if (p.indexOf('c:') === 0) {
      const [x, y, r] = p.slice(2).split(',');
      nodos.push(<circle key={i} cx={x} cy={y} r={r} />);
    } else {
      nodos.push(<path key={i} d={p} />);
    }
  });
  return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c || 'currentColor'}
      strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
      {nodos}
    </svg>
  );
}

/* ============================================================
   FORMATO
   ============================================================ */
function useDinero(moneda) {
  return useMemo(() => {
    return (v, corto) => {
      const n = E.num(v);
      const neg = n < 0;
      const a = Math.abs(n);
      let txt;
      if (corto && a >= 1000000) txt = (a / 1000000).toFixed(a >= 10000000 ? 0 : 1) + 'M';
      else if (corto && a >= 10000) txt = (a / 1000).toFixed(a >= 100000 ? 0 : 1) + 'k';
      else txt = a.toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (neg ? '-' : '') + moneda + ' ' + txt;
    };
  }, [moneda]);
}
const fFecha = (f) => {
  if (!f) return '—';
  const [a, m, d] = String(f).split('-');
  return d + '/' + m + '/' + String(a).slice(2);
};

/* ============================================================
   PERSISTENCIA LOCAL
   ============================================================ */
function cargar() {
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (!crudo) return E.estadoDemo();
    const d = JSON.parse(crudo);
    const base = E.estadoVacio();
    return Object.assign(base, d);
  } catch (e) {
    return E.estadoDemo();
  }
}
function guardar(estado) {
  try { localStorage.setItem(CLAVE, JSON.stringify(estado)); return true; }
  catch (e) { return false; }
}

/* ============================================================
   COMPONENTES REUTILIZABLES
   ============================================================ */
function Kpi({ etq, val, pie, tono, onClick }) {
  const Tag = onClick ? 'button' : 'div';
  return (
    <Tag className={'tarjeta kpi ' + (tono || '') + (onClick ? ' kpi-clickable' : '')}
      onClick={onClick}
      style={onClick ? { cursor: 'pointer', textAlign: 'left', width: '100%' } : null}>
      <div className="etq">{etq}</div>
      <div className="val">{val}</div>
      {pie ? <div className="pie">{pie}</div> : null}
    </Tag>
  );
}

function Anillo({ pct, tam = 168, grosor = 15, estado, centro, sub }) {
  const p = Math.max(0, Math.min(pct, 120));
  const r = (tam - grosor) / 2;
  const c = 2 * Math.PI * r;
  const avance = Math.min(p, 100) / 100;
  const color =
    estado === 'excedido' ? 'var(--rojo)' : estado === 'alerta' ? 'var(--ambar)' : estado === 'sinPresupuesto' ? 'var(--panel-3)' : 'var(--menta)';
  return (
    <div style={{ position: 'relative', width: tam, height: tam, margin: '0 auto' }}>
      <svg width={tam} height={tam} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={tam / 2} cy={tam / 2} r={r} stroke="rgba(255,255,255,.07)" strokeWidth={grosor} fill="none" />
        <circle cx={tam / 2} cy={tam / 2} r={r} stroke={color} strokeWidth={grosor} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - avance)}
          style={{ transition: 'stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeContent: 'center', textAlign: 'center' }}>
        <div className="mono" style={{ fontSize: tam > 150 ? 32 : 24, fontWeight: 700, color }}>{centro}</div>
        <div style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', marginTop: 4 }}>{sub}</div>
      </div>
    </div>
  );
}

function Barra({ pct, estado }) {
  return (
    <div className="pista">
      <div className={'relleno f-' + estado} style={{ width: Math.min(Math.max(pct, 0), 100) + '%' }} />
    </div>
  );
}

function Chip({ estado, texto }) {
  return <span className={'chip chip-' + estado}>{texto}</span>;
}

function Modal({ titulo, onCerrar, children, pie, ancho }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === 'Escape') onCerrar(); };
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [onCerrar]);
  return (
    <div className="velo" onMouseDown={(e) => { if (e.target === e.currentTarget) onCerrar(); }}>
      <div className="modal" style={ancho ? { maxWidth: ancho } : null}>
        <div className="modal-cab">
          <h3>{titulo}</h3>
          <button className="btn-icono" onClick={onCerrar} aria-label="Cerrar"><Icono n="equis" /></button>
        </div>
        {children}
        {pie ? <div className="modal-pie">{pie}</div> : null}
      </div>
    </div>
  );
}

function Vacio({ icono, titulo, texto, accion }) {
  return (
    <div className="vacio">
      <Icono n={icono || 'info'} s={40} />
      <p style={{ color: 'var(--texto-2)', fontWeight: 600 }}>{titulo}</p>
      <p className="mini">{texto}</p>
      {accion ? <div style={{ marginTop: 16 }}>{accion}</div> : null}
    </div>
  );
}

function Campo({ etq, children }) {
  return <div className="campo"><label>{etq}</label>{children}</div>;
}

function CampoProveedor({ valor, onChange, proveedores, accion, brindar, placeholder }) {
  const [abierto, setAbierto] = useState(false);
  const [txt, setTxt] = useState(valor || '');
  const ref = useRef(null);
  useEffect(() => { setTxt(valor || ''); }, [valor]);
  useEffect(() => {
    if (!abierto) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setAbierto(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [abierto]);
  const nombres = (proveedores || []).map((p) => p.nombre);
  const filtrados = txt.trim() ? nombres.filter((n) => n.toLowerCase().includes(txt.toLowerCase())) : nombres;
  const exacto = nombres.some((n) => n.toLowerCase() === txt.trim().toLowerCase());
  return (
    <div ref={ref} style={{position:'relative'}}>
      <input value={txt} placeholder={placeholder || 'Proveedor'}
        onChange={(e) => { setTxt(e.target.value); onChange(e.target.value); setAbierto(true); }}
        onFocus={() => setAbierto(true)} />
      {abierto && (filtrados.length > 0 || (txt.trim() && !exacto)) ? (
        <div style={{position:'absolute',left:0,right:0,top:'100%',zIndex:50,background:'var(--panel)',border:'1px solid var(--borde)',borderRadius:10,maxHeight:180,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,.4)'}}>
          {filtrados.map((n) => (
            <button key={n} type="button" style={{display:'block',width:'100%',textAlign:'left',padding:'9px 12px',background:'none',border:'none',color:'var(--texto)',fontSize:14,cursor:'pointer'}}
              onMouseDown={(e) => { e.preventDefault(); setTxt(n); onChange(n); setAbierto(false); }}>{n}</button>
          ))}
          {txt.trim() && !exacto ? (
            <button type="button" style={{display:'flex',alignItems:'center',gap:6,width:'100%',textAlign:'left',padding:'9px 12px',background:'none',border:'none',color:'var(--menta)',fontSize:13,cursor:'pointer',borderTop:'1px solid var(--borde)'}}
              onMouseDown={(e) => {
                e.preventDefault();
                const nuevo = E.normalizarProveedor({ nombre: txt.trim() });
                accion((s) => ({ ...s, proveedores: (s.proveedores || []).concat([nuevo]) }));
                if (brindar) brindar('Proveedor "' + txt.trim() + '" creado.', 'ok');
                setAbierto(false);
              }}><Icono n="mas" s={14} />Crear "{txt.trim()}"</button>
          ) : null}
        </div>
      ) : null}
    </div>
  );
}

function Estrellas({ valor, onChange, tam = 18 }) {
  return (
    <div className="estrellas">
      {[1,2,3,4,5].map((n) => (
        <button key={n} className={'estrella' + (n <= valor ? ' on' : '')}
          onClick={onChange ? () => onChange(n) : undefined}
          style={{ cursor: onChange ? 'pointer' : 'default' }}>
          <Icono n="estrella" s={tam} c={n <= valor ? 'var(--ambar)' : 'var(--panel-3)'} />
        </button>
      ))}
    </div>
  );
}
