                      <table>
                        <thead>
                          <tr>
                            <th>Proveedor</th>
                            <th className="der">P. unitario</th>
                            <th className="der">Total</th>
                            <th className="der">Δ vs. mínima</th>
                            <th className="cen">Entrega</th>
                            <th className="cen">Calidad</th>
                            <th className="cen">Garantía</th>
                            <th style={{ width: 120 }}>Puntaje</th>
                            <th className="der">Acción</th>
                          </tr>
                        </thead>
                        <tbody>
                          {r.ofertas.map((o) => (
                            <tr key={o.id} className={o.esMejorValor ? 'ganadora' : ''}>
                              <td>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                  <span style={{ fontWeight: 600 }}>{o.proveedor}</span>
                                  {conteoFotosOfertas[o.id] ? (
                                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, color: 'var(--ambar)', fontSize: 12 }}>
                                      <Icono n="camara" s={14} c="var(--ambar)" />{conteoFotosOfertas[o.id]}
                                    </span>
                                  ) : null}
                                </div>
                                <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 4 }}>
                                  {o.esEconomica ? <Chip estado="sano" texto="Más barata" /> : null}
                                  {o.esMejorValor ? <Chip estado="alerta" texto="Mejor valor" /> : null}
                                  {o.esMasRapida && !o.esMejorValor ? <Chip estado="sinPresupuesto" texto="Más rápida" /> : null}
                                  {o.esAdjudicada ? <Chip estado="neutro" texto="Adjudicada" /> : null}
                                </div>
                                {o.notas ? <div className="mini" style={{ marginTop: 4 }}>{o.notas}</div> : null}
                              </td>
                              <td className="der mono">{dinero(o.precioUnitario)}</td>
                              <td className="der mono" style={{ fontWeight: 700 }}>{dinero(o.total)}</td>
                              <td className={'der mono ' + (o.diferencia > 0 ? 'neg' : 'pos')}>
                                {o.diferencia > 0 ? '+' + dinero(o.diferencia, true) + ' (' + o.diferenciaPct + '%)' : '—'}
                              </td>
                              <td className="cen mono">{o.dias > 0 ? o.dias + ' d' : '—'}</td>
                              <td className="cen mono">{o.calidad > 0 ? o.calidad + '/5' : '—'}</td>
                              <td className="cen mono">{o.garantia > 0 ? o.garantia + ' m' : '—'}</td>
                              <td>
                                <div className="mono" style={{ fontWeight: 700, fontSize: 14 }}>{o.puntaje}</div>
                                <div className="barrita"><i style={{ width: o.puntaje + '%' }} /></div>
                              </td>
                              <td className="der" style={{ whiteSpace: 'nowrap' }}>
                                <button className="btn btn-sm" onClick={() => adjudicar(l, o.id)}>
                                  {o.esAdjudicada ? 'Quitar' : 'Adjudicar'}
                                </button>
                                {o.esAdjudicada ? (
                                  <button className="btn btn-sm" style={{ marginLeft: 6 }} onClick={() => pasarAGasto(l, o)}>A gasto</button>
                                ) : null}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div className="mini" style={{ marginTop: 12, lineHeight: 1.6 }}>
                      Puntaje ponderado con los criterios que tienen datos:
                      {' '}precio {r.resumen.pesosEfectivos.precio}%
                      {r.resumen.criteriosUsados.calidad ? ' · calidad ' + r.resumen.pesosEfectivos.calidad + '%' : ''}
                      {r.resumen.criteriosUsados.tiempo ? ' · entrega ' + r.resumen.pesosEfectivos.tiempo + '%' : ''}
                      {r.resumen.criteriosUsados.garantia ? ' · garantía ' + r.resumen.pesosEfectivos.garantia + '%' : ''}.
                      {' '}Precio promedio del mercado consultado: {dinero(r.resumen.promedio)}.
                      {l.notas ? ' ' + l.notas : ''}
                    </div>
                  </React.Fragment>
                ) : null}
              </div>
            );
          })}
        </div>
      )}

      {form ? (
        <Modal ancho={720} titulo={form.id ? 'Editar comparativo' : 'Nuevo comparativo'} onCerrar={() => setForm(null)}
          pie={<React.Fragment>
            <button className="btn" onClick={() => setForm(null)}>Cancelar</button>
            <button className="btn btn-p" onClick={guardarLic}><Icono n="check" s={16} />Guardar</button>
          </React.Fragment>}>
          <Campo etq="¿Qué se está cotizando?">
            <input value={form.titulo} autoFocus placeholder="Ej. Piso porcelanato 60x60 — 180 m²"
              onChange={(e) => setForm({ ...form, titulo: e.target.value })} />
          </Campo>
          <div className="tres">
            <Campo etq="Categoría">
              <select value={form.categoriaId} onChange={(e) => setForm({ ...form, categoriaId: e.target.value })}>
                <option value="">Sin asignar</option>
                {cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </Campo>
            <Campo etq="Cantidad">
              <input className="mono" inputMode="decimal" value={form.cantidad}
                onChange={(e) => setForm({ ...form, cantidad: e.target.value })} />
            </Campo>
            <Campo etq="Unidad">
              <input value={form.unidad} onChange={(e) => setForm({ ...form, unidad: e.target.value })} placeholder="m², global, jornal…" />
            </Campo>
          </div>

          <div style={{ background: 'var(--panel-2)', borderRadius: 12, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700, marginBottom: 10 }}>
              Peso de cada criterio
            </div>
            {[['precio', 'Precio'], ['calidad', 'Calidad'], ['tiempo', 'Tiempo de entrega'], ['garantia', 'Garantía']].map(([k, etq]) => (
              <div key={k} style={{ marginBottom: 9 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 4 }}>
                  <span>{etq}</span><span className="mono" style={{ color: 'var(--ambar)' }}>{form.pesos[k]}</span>
                </div>
                <input type="range" min="0" max="100" step="5" value={form.pesos[k]}
                  onChange={(e) => setForm({ ...form, pesos: { ...form.pesos, [k]: Number(e.target.value) } })} />
              </div>
            ))}
            <div className="mini">Los criterios sin datos se descartan y su peso se reparte entre los demás.</div>
          </div>

          <div style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700, marginBottom: 10 }}>
            Ofertas recibidas
          </div>
          {form.ofertas.map((o, i) => (
            <div key={o.id} style={{ border: '1px solid var(--borde)', borderRadius: 12, padding: 13, marginBottom: 11 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 9 }}>
                <span className="mono" style={{ fontSize: 11, color: 'var(--texto-3)', letterSpacing: '.1em' }}>OFERTA {i + 1}</span>
                {form.ofertas.length > 1 ? (
                  <button className="btn-icono" onClick={() => setForm({ ...form, ofertas: form.ofertas.filter((_, j) => j !== i) })}>
                    <Icono n="equis" s={16} />
                  </button>
                ) : null}
              </div>
              <Campo etq="Proveedor">
                {/* T1a: combo inteligente con sugerencias de la base de proveedores */}
                <div style={{ position: 'relative' }}>
                  <input value={o.proveedor} placeholder="Nombre del proveedor" autoComplete="off"
                    onFocus={() => setProvAbiertoIdx(i)}
                    onBlur={() => setTimeout(() => setProvAbiertoIdx(null), 180)}
                    onChange={(e) => {
                      setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, proveedor: e.target.value } : x)) });
                      setProvAbiertoIdx(i);
                    }}
                    style={{ background: 'var(--fondo-2)', border: '1px solid var(--borde)', borderRadius: 9, padding: '11px 12px', color: 'var(--texto)', width: '100%' }} />
                  {provAbiertoIdx === i && (o.proveedor || '').trim().length > 0 ? (
                    <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'var(--panel-2)', border: '1px solid var(--borde-fuerte)', borderRadius: 10, zIndex: 60, marginTop: 4, boxShadow: '0 8px 24px rgba(0,0,0,.5)', overflow: 'hidden', maxHeight: 200, overflowY: 'auto' }}>
                      {proveedores.filter((p) => p.nombre.toLowerCase().includes((o.proveedor || '').toLowerCase())).map((p) => (
                        <button key={p.id} onMouseDown={() => {
                          setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, proveedor: p.nombre } : x)) });
                          setProvAbiertoIdx(null);
                        }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '10px 14px', color: 'var(--texto)', fontSize: 14 }}>
                          <div style={{ fontWeight: 600 }}>{p.nombre}</div>
                          {p.telefono ? <div className="mini">{p.telefono}</div> : null}
                        </button>
                      ))}
                      {!proveedores.some((p) => p.nombre.toLowerCase() === (o.proveedor || '').trim().toLowerCase()) ? (
                        <button onMouseDown={() => {
                          setNuevoProvIdx(i);
                          setNuevoProvDatos({ nombre: o.proveedor.trim(), contacto: '', telefono: '', correo: '', direccion: '' });
                          setProvAbiertoIdx(null);
                        }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '10px 14px', color: 'var(--ambar)', fontSize: 13.5, borderTop: '1px solid var(--borde)', fontWeight: 600 }}>
                          <Icono n="mas" s={14} />{' '}Agregar "{(o.proveedor || '').trim()}" a proveedores
                        </button>
                      ) : null}
                    </div>
                  ) : null}
                </div>
              </Campo>

              {/* T1a: panel inline para agregar proveedor nuevo desde el comparativo */}
              {nuevoProvIdx === i && nuevoProvDatos ? (
                <div style={{ background: 'var(--panel-2)', border: '1px solid var(--ambar)', borderRadius: 12, padding: 14, marginBottom: 10 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                    <h4 style={{ margin: 0, fontFamily: "'Oswald',sans-serif", fontSize: 13, textTransform: 'uppercase', letterSpacing: '.06em', color: 'var(--ambar)' }}>Nuevo proveedor</h4>
                    <button className="btn-icono" onClick={() => { setNuevoProvIdx(null); setNuevoProvDatos(null); }}><Icono n="equis" s={15} /></button>
                  </div>
                  <Campo etq="Nombre"><input value={nuevoProvDatos.nombre} autoFocus onChange={(e) => setNuevoProvDatos({ ...nuevoProvDatos, nombre: e.target.value })} /></Campo>
                  <Campo etq="Contacto"><input value={nuevoProvDatos.contacto} onChange={(e) => setNuevoProvDatos({ ...nuevoProvDatos, contacto: e.target.value })} /></Campo>
                  <div className="dos">
                    <Campo etq="Teléfono"><input value={nuevoProvDatos.telefono} onChange={(e) => setNuevoProvDatos({ ...nuevoProvDatos, telefono: e.target.value })} /></Campo>
                    <Campo etq="Correo"><input value={nuevoProvDatos.correo} onChange={(e) => setNuevoProvDatos({ ...nuevoProvDatos, correo: e.target.value })} /></Campo>
                  </div>
                  <Campo etq="Dirección"><input value={nuevoProvDatos.direccion} onChange={(e) => setNuevoProvDatos({ ...nuevoProvDatos, direccion: e.target.value })} /></Campo>
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 10 }}>
                    <button className="btn btn-sm" onClick={() => { setNuevoProvIdx(null); setNuevoProvDatos(null); }}>Cancelar</button>
                    <button className="btn btn-p btn-sm" onClick={() => {
                      if (!nuevoProvDatos.nombre.trim()) return brindar('El proveedor necesita un nombre.', 'err');
                      const prov = { id: E.uid('pv'), nombre: nuevoProvDatos.nombre.trim(), contacto: nuevoProvDatos.contacto || '', telefono: nuevoProvDatos.telefono || '', correo: nuevoProvDatos.correo || '', direccion: nuevoProvDatos.direccion || '', notas: '', creado: new Date().toISOString() };
                      accion((s) => ({ ...s, proveedores: (s.proveedores || []).concat([prov]) }));
                      setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, proveedor: prov.nombre } : x)) });
                      setNuevoProvIdx(null);
                      setNuevoProvDatos(null);
                      brindar('Proveedor guardado.', 'ok');
                    }}><Icono n="check" s={14} />Guardar</button>
                  </div>
                </div>
              ) : null}

              {/* T1b: fotos de la cotización de esta oferta */}
              <Campo etq={'Foto de cotización (' + (fotasOferta[o.id] || []).length + '/' + FOTOS.MAX_FOTOS_POR_GASTO + ')'}>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {(fotasOferta[o.id] || []).map((f) => (
                    <div key={f.id} style={{ position: 'relative', width: 60, height: 60, borderRadius: 9, overflow: 'hidden', border: '1px solid var(--borde)' }}>
                      <img src={f.dataURL} alt="Cotización" style={{ width: '100%', height: '100%', objectFit: 'cover', cursor: 'zoom-in' }}
                        onClick={() => setFotoAmpliada(f.dataURL)} />
                      <button onClick={() => quitarFotoOferta(o.id, f.id)}
                        style={{ position: 'absolute', top: 2, right: 2, width: 18, height: 18, borderRadius: '50%', background: 'rgba(8,17,19,.85)', display: 'grid', placeItems: 'center' }}>
                        <Icono n="equis" s={11} c="#fff" />
                      </button>
                    </div>
                  ))}
                  {FOTOS.puedeAgregarMas(fotasOferta[o.id] || []) ? (
                    <React.Fragment>
                      <label style={{ width: 60, height: 60, borderRadius: 9, border: '1px dashed var(--borde-fuerte)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2, color: 'var(--texto-2)', cursor: 'pointer' }}>
                        <Icono n="camara" s={17} /><span style={{ fontSize: 9 }}>Cámara</span>
                        <input type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={(e) => { agregarFotoOferta(o.id, e.target.files); e.target.value = ''; }} />
                      </label>
                      <label style={{ width: 60, height: 60, borderRadius: 9, border: '1px dashed var(--borde-fuerte)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2, color: 'var(--texto-2)', cursor: 'pointer' }}>
                        <Icono n="ofertas" s={17} /><span style={{ fontSize: 9 }}>Galería</span>
                        <input type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={(e) => { agregarFotoOferta(o.id, e.target.files); e.target.value = ''; }} />
                      </label>
                    </React.Fragment>
                  ) : null}
                </div>
              </Campo>
              <div className="dos">
                <Campo etq="Precio unitario">
                  <input className="mono" inputMode="decimal" value={o.precioUnitario} placeholder="0.00"
                    onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, precioUnitario: e.target.value } : x)) })} />
                </Campo>
                <Campo etq="Total (si es precio cerrado)">
                  <input className="mono" inputMode="decimal" value={o.total} placeholder="opcional"
                    onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, total: e.target.value } : x)) })} />
                </Campo>
              </div>
              <div className="tres">
                <Campo etq="Días de entrega">
                  <input className="mono" inputMode="numeric" value={o.dias} placeholder="—"
                    onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, dias: e.target.value } : x)) })} />
                </Campo>
                <Campo etq="Calidad (1-5)">
                  <select value={o.calidad}
                    onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, calidad: e.target.value } : x)) })}>
                    <option value="">Sin evaluar</option>
                    <option value="1">1 — Baja</option>
                    <option value="2">2 — Regular</option>
                    <option value="3">3 — Aceptable</option>
                    <option value="4">4 — Buena</option>
                    <option value="5">5 — Excelente</option>
                  </select>
                </Campo>
                <Campo etq="Garantía (meses)">
                  <input className="mono" inputMode="numeric" value={o.garantia} placeholder="—"
                    onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, garantia: e.target.value } : x)) })} />
                </Campo>
              </div>
              <Campo etq="Observación">
                <input value={o.notas} placeholder="Marca, condiciones, referencias…"
                  onChange={(e) => setForm({ ...form, ofertas: form.ofertas.map((x, j) => (j === i ? { ...x, notas: e.target.value } : x)) })} />
              </Campo>
            </div>
          ))}
          {form.ofertas.length < 6 ? (
            <button className="btn btn-sm" onClick={() => setForm({ ...form, ofertas: form.ofertas.concat([ofertaVacia()]) })}>
              <Icono n="mas" s={15} />Agregar otra oferta
            </button>
          ) : null}
          <Campo etq="Notas del comparativo"><textarea value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Alcance, exclusiones, condiciones de pago…" /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: REPORTES
   ============================================================ */
function Reportes({ estado, v, dinero, brindar }) {
  const mensual = useMemo(() => E.reporteMensual(estado.proyectoActivo, estado.categorias, estado.gastos), [estado]);
  const fases = useMemo(() => E.reportePorFase(estado.proyectoActivo, estado.categorias, estado.gastos), [estado]);
  const maxMes = Math.max.apply(null, [1].concat(mensual.map((m) => m.total)));
  const ahorros = v.detalle.filter((d) => d.ahorro > 0 && d.presupuesto > 0).sort((a, b) => b.ahorro - a.ahorro);
  const excesos = v.detalle.filter((d) => d.sobrecosto > 0).sort((a, b) => b.sobrecosto - a.sobrecosto);
  const totalAhorro = E.r2(ahorros.reduce((s, d) => s + d.ahorro, 0));
  const totalExceso = E.r2(excesos.reduce((s, d) => s + d.sobrecosto, 0));

  const exportarCSV = () => {
    const mapaCat = {};
    estado.categorias.forEach((c) => (mapaCat[c.id] = c));
    const filas = [['Fecha', 'Descripcion', 'Categoria', 'Fase', 'Tipo', 'Proveedor', 'Cantidad', 'Unidad', 'Precio unitario', 'Monto', 'Pagado']];
    estado.gastos.filter((g) => g.proyectoId === estado.proyectoActivo)
      .sort((a, b) => (a.fecha > b.fecha ? 1 : -1))
      .forEach((g) => {
        const c = mapaCat[g.categoriaId] || {};
        filas.push([g.fecha, g.descripcion || '', c.nombre || 'Sin categoria', c.fase || '', g.tipo || '', g.proveedor || '',
          g.cantidad, g.unidad || '', g.precioUnitario, g.monto, g.pagado ? 'Si' : 'No']);
      });
    const csv = '\ufeff' + filas.map((f) => f.map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = 'gastos-' + E.hoy() + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    brindar('Archivo CSV descargado.', 'ok');
  };

  return (
    <div className="rejilla" style={{ gap: 16 }}>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Gasto mensual</h3>
          <button className="btn btn-sm" onClick={exportarCSV}><Icono n="bajar" s={15} />Exportar CSV</button>
        </div>
        {mensual.length === 0 ? (
          <Vacio icono="reportes" titulo="Sin datos aún" texto="Los reportes aparecen cuando hay gastos registrados." />
        ) : (
          <React.Fragment>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, height: 175, padding: '10px 0 0', overflowX: 'auto' }}>
              {mensual.map((m) => (
                <div key={m.mes} style={{ flex: '1 0 46px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, height: '100%', justifyContent: 'flex-end' }}>
                  <div className="mono" style={{ fontSize: 10.5, color: 'var(--texto-2)', whiteSpace: 'nowrap' }}>{dinero(m.total, true)}</div>
                  <div style={{
                    width: '100%', maxWidth: 60,
                    height: Math.max(4, (m.total / maxMes) * 118),
                    background: 'linear-gradient(180deg,var(--ambar-claro),var(--ambar-oscuro))',
                    borderRadius: '7px 7px 3px 3px',
                  }} />
                  <div style={{ fontSize: 10.5, color: 'var(--texto-3)', whiteSpace: 'nowrap', fontWeight: 600 }}>{m.etiqueta}</div>
                </div>
              ))}
            </div>
            <div className="sep" />
            <div className="tabla-cont">
              <table>
                <thead>
                  <tr><th>Mes</th><th className="der">Total</th><th className="der">Variación</th><th>Categoría dominante</th><th className="cen">Mov.</th></tr>
                </thead>
                <tbody>
                  {mensual.slice().reverse().map((m) => (
                    <tr key={m.mes}>
                      <td style={{ fontWeight: 600 }}>{m.etiqueta}</td>
                      <td className="der mono" style={{ fontWeight: 700 }}>{dinero(m.total)}</td>
                      <td className={'der mono ' + (m.variacion > 0 ? 'neg' : m.variacion < 0 ? 'pos' : 'tenue')}>
                        {m.variacion === 0 ? '—' : (
                          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, justifyContent: 'flex-end' }}>
                            <Icono n={m.variacion > 0 ? 'arribaT' : 'abajoT'} s={14} />
                            {(m.variacion > 0 ? '+' : '') + dinero(m.variacion, true)} ({m.variacionPct}%)
                          </span>
                        )}
                      </td>
                      <td>{m.topCategoria ? m.topCategoria.nombre + ' · ' + dinero(m.topCategoria.monto, true) : '—'}</td>
                      <td className="cen mono">{m.movimientos}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="tarjeta">
        <div className="tarjeta-cab"><h3>Avance por fase</h3></div>
        {fases.length === 0 ? (
          <Vacio icono="edificio" titulo="Sin fases" texto="Asigna fases a tus categorías desde Presupuesto." />
        ) : (
          fases.map((f) => (
            <div className="fila-cat" key={f.fase}>
              <div className="fila-cat-top">
                <div className="fila-cat-nom">{f.fase}</div>
                <Chip estado={f.estado.id} texto={f.ejecucion + '%'} />
              </div>
              <Barra pct={f.ejecucion} estado={f.estado.id} />
              <div className="fila-cat-cifras">
                <span className="mono">{dinero(f.gastado, true)} <span className="tenue">de {dinero(f.presupuesto, true)}</span></span>
                <span className={'mono ' + (f.saldo >= 0 ? 'pos' : 'neg')}>
                  {f.saldo >= 0 ? 'Ahorro ' : 'Sobrecosto '}{dinero(Math.abs(f.saldo), true)}
                </span>
              </div>
            </div>
          ))
        )}
      </div>

      <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(300px,1fr))' }}>
        <div className="tarjeta">
          <div className="tarjeta-cab">
            <h3>Ahorros</h3>
            <span className="mono pos" style={{ fontWeight: 700 }}>{dinero(totalAhorro, true)}</span>
          </div>
          {ahorros.length === 0 ? <p className="mini">Ninguna categoría tiene saldo a favor todavía.</p> :
            ahorros.map((d) => (
              <div key={d.categoriaId} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, padding: '9px 0', borderBottom: '1px solid var(--borde)' }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                  <Icono n={d.icono} s={16} c="var(--menta)" />
                  <span style={{ fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.nombre}</span>
                </span>
                <span className="mono pos" style={{ fontWeight: 600, flexShrink: 0 }}>{dinero(d.ahorro, true)}</span>
              </div>
            ))}
        </div>
        <div className="tarjeta">
          <div className="tarjeta-cab">
            <h3>Sobrecostos</h3>
            <span className="mono neg" style={{ fontWeight: 700 }}>{dinero(totalExceso, true)}</span>
          </div>
          {excesos.length === 0 ? <p className="mini">Ninguna categoría se pasó del presupuesto. Buen control.</p> :
            excesos.map((d) => (
              <div key={d.categoriaId} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, padding: '9px 0', borderBottom: '1px solid var(--borde)' }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                  <Icono n={d.icono} s={16} c="var(--rojo)" />
                  <span style={{ fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.nombre}</span>
                </span>
                <span className="mono neg" style={{ fontWeight: 600, flexShrink: 0 }}>{dinero(d.sobrecosto, true)}</span>
              </div>
            ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   VISTA: ÓRDENES DE COMPRA (solicitud → aprobación → recepción)
   ============================================================ */
function Ordenes({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [filtroEst, setFiltroEst] = useState('');

  const ordenes = (estado.ordenes || []).filter((o) => o.proyectoId === estado.proyectoActivo
    && (!filtroEst || o.estado === filtroEst)
  ).sort((a, b) => a.fechaCreacion < b.fechaCreacion ? 1 : -1);

  const itemVacio = () => ({ descripcion: '', cantidad: 1, unidad: 'unidad', precioUnitario: '', marca: '' });
  const abrirNueva = () => {
    const n = (ordenes.length + 1);
    setForm({ id: null, numero: 'OC-' + String(n).padStart(3, '0'), proveedor: '', estado: 'borrador',
      items: [itemVacio()], iva: '15', retencionIR: false, fechaCreacion: E.hoy(), fechaEntrega: '',
      solicitadoPor: '', aprobadoPor: '', notas: '', _esNuevo: true });
  };

  const totalForm = () => {
    const sub = E.r2((form.items || []).reduce((s, it) => s + E.r2(E.num(it.cantidad) * E.num(it.precioUnitario)), 0));
    const imp = E.r2(sub * E.num(form.iva) / 100);
    const ir = form.retencionIR ? E.r2(sub * 0.02) : 0;
    return { subtotal: sub, impuesto: imp, retencionIR: ir, total: E.r2(sub + imp - ir) };
  };

  const guardarOrden = () => {
    if (!form.proveedor.trim()) return brindar('Indica el proveedor.', 'err');
    if (form.items.length === 0 || !form.items[0].descripcion.trim()) return brindar('Agrega al menos un ítem.', 'err');
    const o = E.normalizarOrden({ ...form, proyectoId: estado.proyectoActivo });
    accion((s) => ({ ...s, ordenes: form._esNuevo ? (s.ordenes||[]).concat([o]) : (s.ordenes||[]).map((x) => x.id === form.id ? o : x) }));
    brindar(form._esNuevo ? 'Orden creada.' : 'Orden actualizada.', 'ok');
    setForm(null);
  };

  const cambiarEstado = (o, nuevoEstado) => {
    const campos = { estado: nuevoEstado };
    if (nuevoEstado === 'aprobada') campos.fechaAprobacion = E.hoy();
    if (nuevoEstado === 'recibida') campos.fechaRecepcion = E.hoy();
    const actualizada = E.normalizarOrden({ ...o, ...campos });
    accion((s) => ({ ...s, ordenes: (s.ordenes||[]).map((x) => x.id === o.id ? actualizada : x) }));
    brindar('Estado actualizado a ' + nuevoEstado + '.', 'ok');
  };

  const borrarOrden = (o) => {
    if (!confirm('¿Borrar la orden ' + o.numero + '?')) return;
    accion((s) => ({ ...s, ordenes: (s.ordenes||[]).filter((x) => x.id !== o.id) }));
    brindar('Orden eliminada.', 'ok');
  };

  const CHIP_EST = { borrador: 'sinPresupuesto', solicitada: 'alerta', aprobada: 'sano', recibida: 'neutro', cancelada: 'excedido' };
  const etqEst = (e) => (E.ESTADOS_ORDEN.find((x) => x.id === e) || { label: e }).label;

  const imprimirOrden = (o) => {
    const w = window.open('', '_blank');
    const rows = o.items.map((it, i) => '<tr><td>'+(i+1)+'</td><td>'+it.descripcion+(it.marca?' — '+it.marca:'')+'</td><td class="c">'+it.cantidad+' '+it.unidad+'</td><td class="r">'+dinero(it.precioUnitario)+'</td><td class="r">'+dinero(E.r2(it.cantidad*it.precioUnitario))+'</td></tr>').join('');
    w.document.write('<!DOCTYPE html><html><head><title>'+o.numero+'</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#222}h1{font-size:18px}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}.c{text-align:center}.r{text-align:right}th{background:#f5f5f5}.tot{font-weight:700}.head{text-align:center;margin-bottom:20px}.head h2{margin:0;font-size:16px}.head p{margin:3px 0;font-size:12px;color:#555}.firma{display:flex;justify-content:space-between;margin-top:60px}.firma div{text-align:center;width:200px;border-top:1px solid #333;padding-top:8px;font-size:12px}@media print{body{padding:15px}}</style></head><body>');
    w.document.write('<div class="head"><h2>Iglesia Oasis de Amor</h2><p>RUC: J0810000163807</p><p>Km 10 carretera nueva a León contiguo a DIINSA Ciudad Sandino Managua</p><p>Tel. 22691293</p></div>');
    w.document.write('<h1>Orden de Compra: '+o.numero+'</h1>');
    w.document.write('<p><b>Proveedor:</b> '+o.proveedor+' | <b>Fecha:</b> '+fFecha(o.fechaCreacion)+' | <b>Estado:</b> '+etqEst(o.estado)+'</p>');
    w.document.write('<table><thead><tr><th>#</th><th>Descripción</th><th class="c">Cantidad</th><th class="r">P. Unit.</th><th class="r">Total</th></tr></thead><tbody>'+rows+'</tbody></table>');
    w.document.write('<table style="width:250px;margin-left:auto"><tr><td>Subtotal</td><td class="r">'+dinero(o.subtotal)+'</td></tr><tr><td>IVA ('+o.iva+'%)</td><td class="r">'+dinero(o.impuesto)+'</td></tr>'+(o.retencionIR?'<tr><td>IR 2%</td><td class="r">-'+dinero(o.retencionIR)+'</td></tr>':'')+'<tr class="tot"><td>TOTAL</td><td class="r">'+dinero(o.total)+'</td></tr></table>');
    if (o.notas) w.document.write('<p><b>Notas:</b> '+o.notas+'</p>');
    w.document.write('<div class="firma"><div>'+(o.solicitadoPor||'___________')+'<br>Solicitado por</div><div>'+(o.aprobadoPor||'___________')+'<br>Aprobado por</div><div>___________<br>Recibido por</div></div>');
    w.document.write('</body></html>');
    w.document.close();
    w.print();
  };

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Órdenes de compra</h3>
          <button className="btn btn-p btn-sm" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva orden</button>
        </div>
        <div className="filtros">
          <select value={filtroEst} onChange={(e) => setFiltroEst(e.target.value)}><option value="">Todos los estados</option>{E.ESTADOS_ORDEN.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}</select>
        </div>
        {ordenes.length === 0 ? (
          <Vacio icono="orden" titulo="Sin órdenes" texto="Crea órdenes de compra para controlar el flujo de solicitud, aprobación y recepción."
            accion={<button className="btn btn-p" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva orden</button>} />
        ) : (
          <div className="tabla-cont">
            <table>
              <thead><tr><th style={{width:80}}>N°</th><th>Proveedor</th><th className="cen">Estado</th><th className="cen">Ítems</th><th className="der">Total</th><th className="der">Acciones</th></tr></thead>
              <tbody>
                {ordenes.map((o) => (
                  <tr key={o.id}>
                    <td className="mono" style={{fontWeight:700}}>{o.numero}</td>
                    <td><div style={{fontWeight:600}}>{o.proveedor}</div><div className="mini">{fFecha(o.fechaCreacion)}{o.fechaEntrega ? ' · Entrega: '+fFecha(o.fechaEntrega) : ''}</div></td>
                    <td className="cen"><Chip estado={CHIP_EST[o.estado]||'neutro'} texto={etqEst(o.estado)} /></td>
                    <td className="cen mono">{o.items.length}</td>
                    <td className="der mono" style={{fontWeight:700}}>{dinero(o.total)}</td>
                    <td className="der" style={{whiteSpace:'nowrap'}}>
                      {o.estado === 'borrador' ? <button className="btn btn-sm" onClick={() => cambiarEstado(o,'solicitada')} title="Solicitar">Solicitar</button> : null}
                      {o.estado === 'solicitada' ? <button className="btn btn-sm" onClick={() => cambiarEstado(o,'aprobada')} title="Aprobar" style={{color:'var(--menta)'}}>Aprobar</button> : null}
                      {o.estado === 'aprobada' ? <button className="btn btn-sm" onClick={() => cambiarEstado(o,'recibida')} title="Recibir" style={{color:'var(--menta)'}}>Recibir</button> : null}
                      <button className="btn-icono" onClick={() => imprimirOrden(o)} title="Imprimir"><Icono n="imprimir" s={17} /></button>
                      <button className="btn-icono" onClick={() => setForm({...o, iva: String(o.iva), items: o.items.map((it) => ({...it, precioUnitario: String(it.precioUnitario)})), _esNuevo: false})}><Icono n="lapiz" s={17} /></button>
                      <button className="btn-icono" onClick={() => borrarOrden(o)}><Icono n="basura" s={17} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {form ? (
        <Modal titulo={form._esNuevo ? 'Nueva orden de compra' : 'Editar orden ' + form.numero} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarOrden}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <div className="dos">
            <Campo etq="N° de orden"><input value={form.numero} onChange={(e) => setForm({...form,numero:e.target.value})} /></Campo>
            <Campo etq="Proveedor"><input value={form.proveedor} autoFocus placeholder="Nombre del proveedor" onChange={(e) => setForm({...form,proveedor:e.target.value})} /></Campo>
          </div>
          <div className="dos">
            <Campo etq="Solicitado por"><input value={form.solicitadoPor} onChange={(e) => setForm({...form,solicitadoPor:e.target.value})} /></Campo>
            <Campo etq="Fecha entrega"><input type="date" value={form.fechaEntrega||''} onChange={(e) => setForm({...form,fechaEntrega:e.target.value})} /></Campo>
          </div>

          <h4 style={{margin:'18px 0 10px',fontSize:14}}>Ítems</h4>
          {form.items.map((it, idx) => (
            <div key={idx} style={{display:'grid',gridTemplateColumns:'1fr 70px 70px 90px 90px 32px',gap:8,marginBottom:8,alignItems:'end'}}>
              <Campo etq={idx===0?"Descripción":""}><input value={it.descripcion} placeholder="Descripción" onChange={(e) => { const items=[...form.items]; items[idx]={...it,descripcion:e.target.value}; setForm({...form,items}); }} /></Campo>
              <Campo etq={idx===0?"Cant.":""}><input className="mono" inputMode="decimal" value={it.cantidad} onChange={(e) => { const items=[...form.items]; items[idx]={...it,cantidad:e.target.value}; setForm({...form,items}); }} /></Campo>
              <Campo etq={idx===0?"Unidad":""}><input value={it.unidad} onChange={(e) => { const items=[...form.items]; items[idx]={...it,unidad:e.target.value}; setForm({...form,items}); }} /></Campo>
              <Campo etq={idx===0?"P.Unit.":""}><input className="mono" inputMode="decimal" value={it.precioUnitario} onChange={(e) => { const items=[...form.items]; items[idx]={...it,precioUnitario:e.target.value}; setForm({...form,items}); }} /></Campo>
              <Campo etq={idx===0?"Marca":""}><input value={it.marca} onChange={(e) => { const items=[...form.items]; items[idx]={...it,marca:e.target.value}; setForm({...form,items}); }} /></Campo>
              <button className="btn-icono" style={{marginBottom:2}} onClick={() => { const items=form.items.filter((_,i)=>i!==idx); setForm({...form,items:items.length?items:[itemVacio()]}); }}><Icono n="basura" s={15} /></button>
            </div>
          ))}
          <button className="btn btn-sm" onClick={() => setForm({...form,items:form.items.concat([itemVacio()])})}><Icono n="mas" s={14} />Agregar ítem</button>

          <div className="dos" style={{marginTop:14}}>
            <Campo etq="IVA (%)"><input className="mono" inputMode="decimal" value={form.iva} onChange={(e) => setForm({...form,iva:e.target.value})} /></Campo>
            <Campo etq="IR 2% retención">
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:14}}>
                <input type="checkbox" checked={form.retencionIR} onChange={(e) => setForm({...form,retencionIR:e.target.checked})} />
                Aplicar retención IR 2%
              </label>
            </Campo>
          </div>

          {(() => { const t = totalForm(); return (
            <div style={{background:'var(--fondo-elev)',borderRadius:8,padding:'12px 16px',marginTop:14,fontSize:13}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="tenue">Subtotal</span><span className="mono">{dinero(t.subtotal)}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}><span className="tenue">IVA</span><span className="mono">{dinero(t.impuesto)}</span></div>
              {form.retencionIR ? <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}><span className="tenue">IR 2%</span><span className="mono">-{dinero(t.retencionIR)}</span></div> : null}
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontWeight:700,fontSize:15}}><span>TOTAL</span><span className="mono">{dinero(t.total)}</span></div>
            </div>
          ); })()}

          <Campo etq="Notas"><textarea value={form.notas||''} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: CONTRATOS
   ============================================================ */
function Contratos({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const contratos = (estado.contratos || []).filter((c) => c.proyectoId === estado.proyectoActivo)
    .sort((a, b) => a.fechaInicio < b.fechaInicio ? 1 : -1);

  const CHIP_CONT = { vigente: 'sano', completado: 'neutro', cancelado: 'excedido' };
  const ETQ_CONT = { vigente: 'Vigente', completado: 'Completado', cancelado: 'Cancelado' };

  const abrirNuevo = () => setForm({ id: null, proveedor: '', titulo: '', montoContrato: '', anticipo: '0', retencion: '0', fechaInicio: E.hoy(), fechaFin: '', estado: 'vigente', avance: 0, notas: '' });

  const guardarContrato = () => {
    if (!form.titulo.trim()) return brindar('El contrato necesita un título.', 'err');
    if (E.num(form.montoContrato) <= 0) return brindar('El monto debe ser mayor a cero.', 'err');
    const c = E.normalizarContrato({ id: form.id || E.uid('co'), proyectoId: estado.proyectoActivo, proveedor: form.proveedor.trim(), titulo: form.titulo.trim(), montoContrato: form.montoContrato, anticipo: form.anticipo, retencion: form.retencion, fechaInicio: form.fechaInicio, fechaFin: form.fechaFin, estado: form.estado, avance: form.avance, notas: form.notas, creado: form.creado });
    accion((s) => ({ ...s, contratos: form.id ? (s.contratos||[]).map((x) => x.id === form.id ? c : x) : (s.contratos||[]).concat([c]) }));
    brindar(form.id ? 'Contrato actualizado.' : 'Contrato creado.', 'ok');
    setForm(null);
  };

  const borrarContrato = (c) => {
    if (!confirm('¿Borrar el contrato "' + c.titulo + '"?')) return;
    accion((s) => ({ ...s, contratos: (s.contratos||[]).filter((x) => x.id !== c.id) }));
    brindar('Contrato eliminado.', 'ok');
  };

  return (
    <div>
      <div className="tarjeta-cab" style={{marginBottom:16}}>
        <h3 style={{fontSize:18}}>Contratos</h3>
        <button className="btn btn-p btn-sm" onClick={abrirNuevo}><Icono n="mas" s={16} />Nuevo contrato</button>
      </div>
      {contratos.length === 0 ? (
        <div className="tarjeta"><Vacio icono="contrato" titulo="Sin contratos" texto="Registra contratos para dar seguimiento al avance y retenciones."
          accion={<button className="btn btn-p" onClick={abrirNuevo}><Icono n="mas" s={16} />Nuevo contrato</button>} /></div>
      ) : (
        <div className="rejilla" style={{gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
          {contratos.map((c) => {
            const montoAnticipo = E.r2(E.num(c.montoContrato) * E.num(c.anticipo) / 100);
            const montoRetencion = E.r2(E.num(c.montoContrato) * E.num(c.retencion) / 100);
            const abonado = E.r2((estado.pagos||[]).filter((p) => p.contratoId === c.id).reduce((s,p) => s + E.num(p.monto), 0));
            const saldoContrato = E.r2(E.num(c.montoContrato) - abonado);
            return (
              <div className="tarjeta" key={c.id}>
                <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start'}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:16}}>{c.titulo}</div>
                    <div className="mini" style={{marginTop:3}}>{c.proveedor || 'Sin proveedor'}</div>
                  </div>
                  <div style={{display:'flex',gap:4,alignItems:'center',flexShrink:0}}>
                    <Chip estado={CHIP_CONT[c.estado]} texto={ETQ_CONT[c.estado]} />
                    <button className="btn-icono" onClick={() => setForm({...c,montoContrato:String(c.montoContrato),anticipo:String(c.anticipo),retencion:String(c.retencion),notas:c.notas||''})}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrarContrato(c)}><Icono n="basura" s={17} /></button>
                  </div>
                </div>
                <div style={{margin:'14px 0 8px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6}}>
                    <span className="tenue">Avance</span><span className="mono" style={{fontWeight:700}}>{c.avance}%</span>
                  </div>
                  <Barra pct={c.avance} estado={c.avance >= 100 ? 'sano' : c.avance >= 75 ? 'alerta' : 'sinPresupuesto'} />
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px',fontSize:13,marginTop:12}}>
                  <div><span className="tenue">Monto: </span><span className="mono" style={{fontWeight:700}}>{dinero(c.montoContrato, true)}</span></div>
                  <div><span className="tenue">Anticipo: </span><span className="mono">{dinero(montoAnticipo, true)} ({c.anticipo}%)</span></div>
                  <div><span className="tenue">Retención: </span><span className="mono">{dinero(montoRetencion, true)} ({c.retencion}%)</span></div>
                  <div><span className="tenue">Periodo: </span><span className="mono">{fFecha(c.fechaInicio)} — {c.fechaFin ? fFecha(c.fechaFin) : '…'}</span></div>
                  <div><span className="tenue">Abonado: </span><span className="mono" style={{fontWeight:700,color:'var(--menta)'}}>{dinero(abonado, true)}</span></div>
                  <div><span className="tenue">Saldo: </span><span className="mono" style={{fontWeight:700,color: saldoContrato > 0 ? 'var(--rojo)' : 'var(--menta)'}}>{dinero(saldoContrato, true)}</span></div>
                </div>
                {c.notas ? <div className="mini tenue" style={{marginTop:10}}>{c.notas}</div> : null}
              </div>
            );
          })}
        </div>
      )}
      {form ? (
        <Modal titulo={form.id ? 'Editar contrato' : 'Nuevo contrato'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarContrato}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Título"><input value={form.titulo} autoFocus placeholder="Ej. Contrato de obra civil" onChange={(e) => setForm({...form,titulo:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Proveedor / Contratista"><input value={form.proveedor} placeholder="Nombre" onChange={(e) => setForm({...form,proveedor:e.target.value})} /></Campo>
            <Campo etq="Monto del contrato"><input className="mono" inputMode="decimal" value={form.montoContrato} placeholder="0.00" onChange={(e) => setForm({...form,montoContrato:e.target.value})} /></Campo>
          </div>
          <div className="tres">
            <Campo etq="Anticipo (%)"><input className="mono" inputMode="decimal" value={form.anticipo} onChange={(e) => setForm({...form,anticipo:e.target.value})} /></Campo>
            <Campo etq="Retención (%)"><input className="mono" inputMode="decimal" value={form.retencion} onChange={(e) => setForm({...form,retencion:e.target.value})} /></Campo>
            <Campo etq="Estado"><select value={form.estado} onChange={(e) => setForm({...form,estado:e.target.value})}>{Object.keys(ETQ_CONT).map((k) => <option key={k} value={k}>{ETQ_CONT[k]}</option>)}</select></Campo>
          </div>
          <div className="dos">
            <Campo etq="Fecha inicio"><input type="date" value={form.fechaInicio} onChange={(e) => setForm({...form,fechaInicio:e.target.value})} /></Campo>
            <Campo etq="Fecha fin"><input type="date" value={form.fechaFin||''} onChange={(e) => setForm({...form,fechaFin:e.target.value})} /></Campo>
          </div>
          <Campo etq={'Avance (' + form.avance + '%)'}>
            <input type="range" min="0" max="100" step="5" value={form.avance} onChange={(e) => setForm({...form,avance:Number(e.target.value)})} />
          </Campo>
          <Campo etq="Notas"><textarea value={form.notas} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: PAGOS (abonos, adelantos, anticipos)
   ============================================================ */
function Pagos({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [fTipo, setFTipo] = useState('');
  const [fCont, setFCont] = useState('');

  const contratosProyecto = (estado.contratos || []).filter((c) => c.proyectoId === estado.proyectoActivo);
  const contMap = {};
  contratosProyecto.forEach((c) => contMap[c.id] = c);
  const provMap = {};
  (estado.proveedores||[]).forEach((p) => provMap[p.id] = p.nombre);

  const pagos = (estado.pagos || []).filter((p) => p.proyectoId === estado.proyectoActivo
    && (!fTipo || p.tipo === fTipo)
    && (!fCont || p.contratoId === fCont)
  ).sort((a, b) => a.fecha < b.fecha ? 1 : -1);

  const total = E.r2(pagos.reduce((s, p) => s + E.num(p.monto), 0));
  const formVacio = () => ({ id: null, tipo: 'abono', metodo: 'efectivo', referencia: '', monto: '', fecha: E.hoy(), contratoId: '', proveedorId: '', trabajador: '', descripcion: '', notas: '', _esNuevo: true });

  const guardarPago = () => {
    if (E.num(form.monto) <= 0) return brindar('El monto debe ser mayor a cero.', 'err');
    if (!form.descripcion.trim()) return brindar('Agrega una descripción.', 'err');
    const p = E.normalizarPago({ ...form, proyectoId: estado.proyectoActivo });
    accion((s) => ({ ...s, pagos: form._esNuevo ? (s.pagos||[]).concat([p]) : (s.pagos||[]).map((x) => x.id === form.id ? p : x) }));
    brindar(form._esNuevo ? 'Pago registrado.' : 'Pago actualizado.', 'ok');
    setForm(null);
  };

  const borrarPago = (p) => {
    if (!confirm('¿Borrar este pago?')) return;
    accion((s) => ({ ...s, pagos: (s.pagos||[]).filter((x) => x.id !== p.id) }));
    brindar('Pago eliminado.', 'ok');
  };

  const CHIP_TIPO = { abono: 'sano', adelanto_material: 'alerta', adelanto_mano_obra: 'alerta', anticipo: 'sinPresupuesto', liquidacion: 'neutro' };
  const etqTipo = (t) => (E.TIPOS_PAGO.find((x) => x.id === t) || { label: t }).label;
  const etqMetodo = (m) => (E.METODOS_PAGO.find((x) => x.id === m) || { label: m }).label;

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Pagos y adelantos</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(formVacio())}><Icono n="mas" s={16} />Registrar pago</button>
        </div>
        <div className="filtros">
          <select value={fTipo} onChange={(e) => setFTipo(e.target.value)}><option value="">Todos los tipos</option>{E.TIPOS_PAGO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select>
          {contratosProyecto.length > 0 ? <select value={fCont} onChange={(e) => setFCont(e.target.value)}><option value="">Todos los contratos</option>{contratosProyecto.map((c) => <option key={c.id} value={c.id}>{c.titulo}</option>)}</select> : null}
        </div>
        {pagos.length === 0 ? (
          <Vacio icono="pago" titulo="Sin pagos registrados" texto="Registra abonos, adelantos y anticipos a contratos."
            accion={<button className="btn btn-p" onClick={() => setForm(formVacio())}><Icono n="mas" s={16} />Registrar</button>} />
        ) : (
          <React.Fragment>
            <div className="tabla-cont">
              <table>
                <thead><tr><th style={{width:78}}>Fecha</th><th>Descripción</th><th>Contrato</th><th className="cen">Tipo</th><th>Método</th><th className="der">Monto</th><th className="der"></th></tr></thead>
                <tbody>
                  {pagos.map((p) => (
                    <tr key={p.id}>
                      <td className="mono" style={{fontSize:13}}>{fFecha(p.fecha)}</td>
                      <td><div style={{fontWeight:600}}>{p.descripcion}</div>{p.referencia ? <div className="mini">Ref: {p.referencia}</div> : null}</td>
                      <td style={{fontSize:13}}>{contMap[p.contratoId] ? contMap[p.contratoId].titulo : '—'}</td>
                      <td className="cen"><Chip estado={CHIP_TIPO[p.tipo]||'neutro'} texto={etqTipo(p.tipo)} /></td>
                      <td style={{fontSize:13}}>{etqMetodo(p.metodo)}</td>
                      <td className="der mono" style={{fontWeight:700}}>{dinero(p.monto)}</td>
                      <td className="der" style={{whiteSpace:'nowrap'}}>
                        <button className="btn-icono" onClick={() => setForm({...p,monto:String(p.monto),contratoId:p.contratoId||'',referencia:p.referencia||'',trabajador:p.trabajador||'',descripcion:p.descripcion||'',notas:p.notas||'',_esNuevo:false})}><Icono n="lapiz" s={17} /></button>
                        <button className="btn-icono" onClick={() => borrarPago(p)}><Icono n="basura" s={17} /></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,paddingTop:14,borderTop:'2px solid var(--borde-fuerte)'}}>
              <span className="mini">{pagos.length} pago(s)</span>
              <span className="mono" style={{fontSize:18,fontWeight:700}}>{dinero(total)}</span>
            </div>
          </React.Fragment>
        )}
      </div>
      {form ? (
        <Modal titulo={form._esNuevo ? 'Registrar pago' : 'Editar pago'} onCerrar={() => setForm(null)}
          pie={<React.Fragment><button className="btn" onClick={() => setForm(null)}>Cancelar</button><button className="btn btn-p" onClick={guardarPago}><Icono n="check" s={16} />Guardar</button></React.Fragment>}>
          <Campo etq="Descripción"><input value={form.descripcion} autoFocus placeholder="Ej. Abono materiales semana 3" onChange={(e) => setForm({...form,descripcion:e.target.value})} /></Campo>
          <div className="dos">
            <Campo etq="Tipo"><select value={form.tipo} onChange={(e) => setForm({...form,tipo:e.target.value})}>{E.TIPOS_PAGO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></Campo>
            <Campo etq="Método"><select value={form.metodo} onChange={(e) => setForm({...form,metodo:e.target.value})}>{E.METODOS_PAGO.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}</select></Campo>
          </div>
          <div className="dos">
            <Campo etq="Monto"><input className="mono" inputMode="decimal" value={form.monto} placeholder="0.00" onChange={(e) => setForm({...form,monto:e.target.value})} /></Campo>
            <Campo etq="Fecha"><input type="date" value={form.fecha} onChange={(e) => setForm({...form,fecha:e.target.value})} /></Campo>
          </div>
          <Campo etq="Referencia (N° cheque, transf., etc.)"><input value={form.referencia} placeholder="Opcional" onChange={(e) => setForm({...form,referencia:e.target.value})} /></Campo>
          <Campo etq="Contrato (abono a)"><select value={form.contratoId} onChange={(e) => setForm({...form,contratoId:e.target.value})}><option value="">Ninguno (pago independiente)</option>{contratosProyecto.map((c) => <option key={c.id} value={c.id}>{c.titulo} — {dinero(c.montoContrato, true)}</option>)}</select></Campo>
          {form.contratoId && contMap[form.contratoId] ? (() => { const ct = contMap[form.contratoId]; const ab = E.r2((estado.pagos||[]).filter((p) => p.contratoId === form.contratoId && p.id !== form.id).reduce((s,p) => s + E.num(p.monto), 0)); const saldo = E.r2(E.num(ct.montoContrato) - ab); return <div style={{background:'var(--fondo-elev)',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:13}}><div className="dos"><div><span className="tenue">Monto contrato: </span><span className="mono" style={{fontWeight:700}}>{dinero(ct.montoContrato, true)}</span></div><div><span className="tenue">Ya abonado: </span><span className="mono">{dinero(ab, true)}</span></div></div><div style={{marginTop:6}}><span className="tenue">Saldo pendiente: </span><span className="mono" style={{fontWeight:700,color: saldo > 0 ? 'var(--rojo)' : 'var(--menta)'}}>{dinero(saldo, true)}</span></div></div>; })() : null}
          <Campo etq="Trabajador (opcional)"><input value={form.trabajador||''} placeholder="Nombre del trabajador" onChange={(e) => setForm({...form,trabajador:e.target.value})} /></Campo>
          <Campo etq="Notas"><textarea value={form.notas||''} onChange={(e) => setForm({...form,notas:e.target.value})} /></Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: CALENDARIO DE PAGOS
   ============================================================ */
function CalendarioPagos({ estado, dinero }) {
  const [mesActual, setMesActual] = useState(() => { const h = new Date(); return h.getFullYear() + '-' + String(h.getMonth()+1).padStart(2,'0'); });
  const [diaSel, setDiaSel] = useState(null);

  const [anio, mes] = mesActual.split('-').map(Number);
  const primerDia = new Date(anio, mes - 1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  const diasEnMes = ultimoDia.getDate();
  const inicioSemana = primerDia.getDay();
  const hoyStr = E.hoy();
  const DIAS_SEM = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const eventos = useMemo(() => E.calendarioPagos(estado.proyectoActivo, estado.gastos, estado.ordenes||[], estado.contratos||[], estado.pagos||[], mesActual), [estado, mesActual]);

  const eventosPorDia = {};
  eventos.forEach((ev) => { const d = parseInt(ev.fecha.split('-')[2], 10); if (!eventosPorDia[d]) eventosPorDia[d] = []; eventosPorDia[d].push(ev); });

  const mesAnterior = () => { const d = new Date(anio, mes - 2, 1); setMesActual(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); setDiaSel(null); };
  const mesSiguiente = () => { const d = new Date(anio, mes, 1); setMesActual(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); setDiaSel(null); };

  const eventosVista = diaSel ? (eventosPorDia[diaSel] || []) : eventos.sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  const totalVista = E.r2(eventosVista.reduce((s,ev) => s + E.num(ev.monto), 0));

  return (
    <div className="rejilla" style={{gap:16}}>
      <div className="tarjeta">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <button className="btn btn-sm" onClick={mesAnterior}><Icono n="derecha" s={16} c="var(--texto-2)" /></button>
          <h3 style={{fontSize:18}}>{MESES_LARGO[mes-1]} {anio}</h3>
          <button className="btn btn-sm" onClick={mesSiguiente}><Icono n="derecha" s={16} /></button>
        </div>
        <div className="cal-grid" style={{marginBottom:4}}>
          {DIAS_SEM.map((d) => <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--texto-3)',padding:'6px 0',textTransform:'uppercase',letterSpacing:'.08em'}}>{d}</div>)}
        </div>
        <div className="cal-grid">
          {Array.from({length:inicioSemana}).map((_,i) => <div key={'v'+i} className="cal-dia otro"></div>)}
          {Array.from({length:diasEnMes}).map((_,i) => {
            const dia = i + 1;
            const fechaDia = mesActual + '-' + String(dia).padStart(2,'0');
            const esHoy = fechaDia === hoyStr;
            const esSel = dia === diaSel;
            const tiene = eventosPorDia[dia];
            const diasH = E.diasHasta(fechaDia);
            return (
              <div key={dia} className={'cal-dia' + (esHoy ? ' hoy' : '') + (esSel ? ' sel' : '')} onClick={() => setDiaSel(esSel ? null : dia)}>
                <span>{dia}</span>
                {tiene ? <div className="cal-dot" style={{background: diasH < 0 ? 'var(--rojo)' : diasH === 0 ? 'var(--ambar)' : 'var(--texto-3)'}} /> : null}
              </div>
            );
          })}
        </div>
      </div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>{diaSel ? 'Pagos del ' + diaSel + '/' + String(mes).padStart(2,'0') : 'Pagos del mes'}</h3>
          {diaSel ? <button className="btn btn-sm" onClick={() => setDiaSel(null)}>Ver todo el mes</button> : null}
        </div>
        {eventosVista.length === 0 ? (
          <Vacio icono="calendario" titulo={diaSel ? 'Sin pagos este día' : 'Sin eventos este mes'} texto="Los pagos aparecen cuando hay gastos, órdenes o abonos con fecha en este mes." />
        ) : eventosVista.map((ev, i) => (
          <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,padding:'11px 0',borderBottom:'1px solid var(--borde)',alignItems:'center'}}>
            <div style={{display:'flex',gap:10,alignItems:'center',minWidth:0,flex:1}}>
              <div className="cat-icono" style={{background: ev.tipo==='pago'?'rgba(119,211,164,.15)':ev.tipo==='orden'?'rgba(91,168,242,.15)':undefined, color: ev.tipo==='pago'?'var(--menta)':ev.tipo==='orden'?'var(--azul)':undefined}}>
                <Icono n={ev.tipo === 'orden' ? 'orden' : ev.tipo === 'pago' ? 'pago' : 'gastos'} s={17} />
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14}}>{ev.desc}</div>
                <div className="mini">{ev.proveedor ? ev.proveedor + ' · ' : ''}{fFecha(ev.fecha)}</div>
              </div>
            </div>
            <div className="mono" style={{fontWeight:700,fontSize:14,flexShrink:0}}>{dinero(ev.monto, true)}</div>
          </div>
        ))}
        {eventosVista.length > 0 ? (
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:12,paddingTop:12,borderTop:'2px solid var(--borde-fuerte)'}}>
            <span className="mono" style={{fontWeight:700,fontSize:16}}>{dinero(totalVista)}</span>
          </div>
        ) : null}
      </div>
    </div>
  );
}

/* ============================================================
   VISTA: PROYECTOS (cartera)
   ============================================================ */
const CHIP_PROYECTO = { activo: 'sano', pausado: 'alerta', terminado: 'neutro' };

function TarjetaProyecto({ f, estado, dinero, setProy, copiarProy, borrarProy, cambiarEstado, abrir }) {
  const p = f.proyecto;
  const esActivo = p.id === estado.proyectoActivo;
  return (
    <div className="tarjeta"
      style={esActivo ? { borderColor: 'rgba(242,169,59,.45)', boxShadow: '0 0 0 1px rgba(242,169,59,.2)' } : null}>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 10, alignItems: 'flex-start' }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 16, overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.nombre}</div>
          <div className="mini" style={{ marginTop: 3, display: 'flex', alignItems: 'center', gap: 5 }}>
            <Icono n="ubicacion" s={12} />{p.ubicacion || 'Sin ubicación'}{p.responsable ? ' · ' + p.responsable : ''}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 5, flexShrink: 0, alignItems: 'center' }}>
          {esActivo ? <Chip estado="alerta" texto="Abierto" /> : null}
          <Chip estado={CHIP_PROYECTO[p.estado || 'activo']} texto={(E.ESTADOS_PROYECTO.filter((e) => e.id === (p.estado || 'activo'))[0] || {}).label || 'Activo'} />
        </div>
      </div>

      <div style={{ margin: '16px 0 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 6 }}>
          <span className="mono">{dinero(f.v.gastado, true)} <span className="tenue">de {dinero(f.v.presupuesto, true)}</span></span>
          <span className="mono" style={{ fontWeight: 700 }}>{f.v.ejecucion}%</span>
        </div>
        <Barra pct={f.v.ejecucion} estado={f.v.estado.id} />
      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 10, fontSize: 12.5, marginTop: 10 }}>
        <span className={'mono ' + (f.v.saldo >= 0 ? 'pos' : 'neg')}>
          {f.v.saldo >= 0 ? 'Disponible ' : 'Sobrecosto '}{dinero(Math.abs(f.v.saldo), true)}
        </span>
        <span className="mini">{f.ultima ? 'Último gasto ' + fFecha(f.ultima) : 'Sin gastos aún'}</span>
      </div>

      {(f.v.porPagar > 0 || f.licitacionesPendientes > 0) ? (
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 11 }}>
          {f.v.porPagar > 0 ? <Chip estado="alerta" texto={dinero(f.v.porPagar, true) + ' por pagar'} /> : null}
          {f.licitacionesPendientes > 0 ? <Chip estado="sinPresupuesto" texto={f.licitacionesPendientes + ' oferta(s) sin decidir'} /> : null}
        </div>
      ) : null}

      <div className="sep" style={{ margin: '14px 0 12px' }} />
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
        <button className={'btn btn-sm' + (esActivo ? '' : ' btn-p')} onClick={() => abrir(p)}>
          <Icono n="derecha" s={15} />{esActivo ? 'Ir al panel' : 'Abrir'}
        </button>
        <select value={p.estado || 'activo'} onChange={(e) => cambiarEstado(p, e.target.value)}
          style={{ background: 'var(--panel-2)', border: '1px solid var(--borde)', borderRadius: 8, padding: '7px 9px', color: 'var(--texto-2)', fontSize: 13 }}>
          {E.ESTADOS_PROYECTO.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
        </select>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 2 }}>
          <button className="btn-icono" title="Editar" onClick={() => setProy({ ...p })}><Icono n="lapiz" s={17} /></button>
          <button className="btn-icono" title="Copiar proyecto" onClick={() => copiarProy(p)}><Icono n="copiar" s={17} /></button>
          <button className="btn-icono" title="Borrar" onClick={() => borrarProy(p)}><Icono n="basura" s={17} /></button>
        </div>
      </div>
    </div>
  );
}

function Proyectos({ estado, dinero, accion, brindar, irA }) {
  const [filtro, setFiltro] = useState('todos');
  const [ubicacion, setUbicacion] = useState('todas');
  const [agrupar, setAgrupar] = useState(false);
  const [proy, setProy] = useState(null);
  // T7: proyecto pendiente de borrado (requiere escribir "Eliminar")
  const [proyABorrar, setProyABorrar] = useState(null);
  const [textoConfirm, setTextoConfirm] = useState('');
  const cartera = useMemo(() => E.resumenCartera(estado, filtro), [estado, filtro]);
  const porUbicacion = useMemo(() => E.resumenPorUbicacion(estado, filtro), [estado, filtro]);
  const ubicacionesUsadas = useMemo(() => E.ubicacionesUsadas(estado), [estado]);
  const t = cartera.totales;

  const filasVisibles = ubicacion === 'todas'
    ? cartera.filas
    : cartera.filas.filter((f) => (String(f.proyecto.ubicacion || '').trim() || 'Sin ubicación') === ubicacion);

  const riesgos = [];
  filasVisibles.forEach((f) => {
    f.v.detalle.filter((d) => d.sobrecosto > 0).forEach((d) => {
      riesgos.push({ proyectoId: f.proyecto.id, proyecto: f.proyecto.nombre, categoria: d.nombre, icono: d.icono, monto: d.sobrecosto });
    });
  });
  riesgos.sort((a, b) => b.monto - a.monto);

  const abrir = (p) => {
    accion((s) => ({ ...s, proyectoActivo: p.id }));
    irA('panel');
  };

  const guardarProy = () => {
    if (!proy.nombre.trim()) return brindar('El proyecto necesita un nombre.', 'err');
    if (proy.id) {
      accion((s) => ({ ...s, proyectos: s.proyectos.map((p) => (p.id === proy.id ? { ...p, ...proy, nombre: proy.nombre.trim() } : p)) }));
      brindar('Proyecto actualizado.', 'ok');
    } else {
      const nuevo = E.nuevoProyecto({ ...proy, nombre: proy.nombre.trim() });
      accion((s) => ({
        ...s,
        proyectos: s.proyectos.concat([nuevo]),
        categorias: s.categorias.concat(E.categoriasIniciales(nuevo.id)),
        proyectoActivo: nuevo.id,
      }));
      brindar('Proyecto creado con sus 12 categorías base.', 'ok');
    }
    setProy(null);
  };

  const copiarProy = (p) => {
    const nombre = prompt('¿Cómo se va a llamar el proyecto nuevo?', p.nombre + ' (copia)');
    if (nombre === null) return;
    const conGastos = confirm(
      'Se copian el presupuesto, las categorías y los comparativos.\n\n' +
      'Aceptar: copiar TAMBIÉN los gastos ya registrados.\n' +
      'Cancelar: dejar el proyecto nuevo sin gastos.'
    );
    accion((s) => {
      const c = E.clonarProyecto(s, p.id, nombre.trim(), conGastos);
      if (!c) return s;
      return {
        ...s,
        proyectos: s.proyectos.concat([c.proyecto]),
        categorias: s.categorias.concat(c.categorias),
        gastos: s.gastos.concat(c.gastos),
        licitaciones: s.licitaciones.concat(c.licitaciones),
        proyectoActivo: c.proyecto.id,
      };
    });
    brindar('Proyecto copiado. Ya quedó abierto.', 'ok');
  };

  const borrarProy = (p) => {
    // T7: no usar confirm() — mostrar modal con campo de texto obligatorio
    setProyABorrar(p);
    setTextoConfirm('');
  };

  const ejecutarBorrado = () => {
    const p = proyABorrar;
    if (!p) return;
    const gastosDelProyecto = estado.gastos.filter((x) => x.proyectoId === p.id);
    // Borrar fotos de cada gasto del proyecto
    Promise.all(gastosDelProyecto.map((g) => FOTOS.eliminarPorGasto(g.id).catch(() => {}))).catch(() => {});
    accion((s) => {
      const proyectos = s.proyectos.filter((x) => x.id !== p.id);
      return {
        ...s,
        proyectos,
        categorias: s.categorias.filter((x) => x.proyectoId !== p.id),
        gastos: s.gastos.filter((x) => x.proyectoId !== p.id),
        licitaciones: s.licitaciones.filter((x) => x.proyectoId !== p.id),
        proyectoActivo: s.proyectoActivo === p.id ? (proyectos[0] || {}).id || null : s.proyectoActivo,
      };
    });
    setProyABorrar(null);
    setTextoConfirm('');
    brindar('Proyecto eliminado.', 'ok');
  };

  const cambiarEstado = (p, nuevo) => {
    accion((s) => ({ ...s, proyectos: s.proyectos.map((x) => (x.id === p.id ? { ...x, estado: nuevo } : x)) }));
  };

  return (
    <div className="rejilla" style={{ gap: 16 }}>
      <div className="rejilla kpis">
        <Kpi etq="Proyectos" val={String(t.proyectos)}
          pie={t.excedidos > 0 ? t.excedidos + ' con sobrecosto' : t.enAlerta > 0 ? t.enAlerta + ' cerca del límite' : 'todos en rango'}
          tono={t.excedidos > 0 ? 'rojo' : ''} />
        <Kpi etq="Presupuesto total" val={dinero(t.presupuesto, true)} pie={t.movimientos + ' movimientos'} />
        <Kpi etq="Ejecutado total" val={dinero(t.gastado, true)} pie={t.ejecucion + '% de la cartera'} />
        <Kpi etq={t.saldo >= 0 ? 'Disponible total' : 'Sobrecosto total'} val={dinero(Math.abs(t.saldo), true)}
          pie={t.porPagar > 0 ? dinero(t.porPagar, true) + ' por pagar' : 'nada pendiente de pago'}
          tono={t.saldo >= 0 ? 'menta' : 'rojo'} />
      </div>

      {ubicacionesUsadas.length > 1 ? (
        <div className="tarjeta" style={{ padding: '13px 16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', alignItems: 'center' }}>
              <Icono n="ubicacion" s={16} c="var(--texto-3)" />
              <button className={'btn btn-sm' + (ubicacion === 'todas' ? ' btn-p' : '')} onClick={() => setUbicacion('todas')}>Todas las ubicaciones</button>
              {porUbicacion.grupos.map((g) => (
                <button key={g.ubicacion} className={'btn btn-sm' + (ubicacion === g.ubicacion ? ' btn-p' : '')} onClick={() => setUbicacion(g.ubicacion)}>
                  {g.ubicacion} <span className="mono" style={{ marginLeft: 5, opacity: .75 }}>{g.proyectos}</span>
                </button>
              ))}
            </div>
            <label className="interruptor">
              <input type="checkbox" checked={agrupar} onChange={(e) => setAgrupar(e.target.checked)} />
              <span className="pista-sw" />
              <span style={{ fontSize: 13 }}>Agrupar por ubicación</span>
            </label>
          </div>
        </div>
      ) : null}

      <div className="tarjeta-cab" style={{ marginBottom: 0 }}>
        <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
          {[['todos', 'Todos']].concat(E.ESTADOS_PROYECTO.map((e) => [e.id, e.label])).map(([id, etq]) => (
            <button key={id} className={'btn btn-sm' + (filtro === id ? ' btn-p' : '')} onClick={() => setFiltro(id)}>{etq}</button>
          ))}
        </div>
        <button className="btn btn-p btn-sm" onClick={() => setProy({ id: null, nombre: '', ubicacion: '', responsable: '', inicio: E.hoy(), fin: '', estado: 'activo', notas: '' })}>
          <Icono n="mas" s={16} />Nuevo proyecto
        </button>
      </div>

      {filasVisibles.length === 0 ? (
        <div className="tarjeta">
          <Vacio icono="proyecto" titulo={filtro === 'todos' && ubicacion === 'todas' ? 'Sin proyectos' : 'Nada que mostrar con este filtro'}
            texto={filtro === 'todos' && ubicacion === 'todas' ? 'Crea el primero para empezar a controlar la obra.' : 'Cambia el filtro para ver los demás.'} />
        </div>
      ) : agrupar ? (
        <div className="rejilla" style={{ gap: 18 }}>
          {porUbicacion.grupos
            .filter((g) => ubicacion === 'todas' || g.ubicacion === ubicacion)
            .map((g) => (
              <div key={g.ubicacion}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10, flexWrap: 'wrap' }}>
                  <Icono n="ubicacion" s={17} c="var(--ambar)" />
                  <h3 style={{ fontSize: 15.5, textTransform: 'uppercase', letterSpacing: '.05em' }}>{g.ubicacion}</h3>
                  <Chip estado={g.estado.id} texto={g.ejecucion + '%'} />
                  <span className="mini">
                    {dinero(g.gastado, true)} de {dinero(g.presupuesto, true)} · {g.proyectos} proyecto(s)
                  </span>
                </div>
                <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fill,minmax(320px,1fr))' }}>
                  {g.filas.map((f) => <TarjetaProyecto key={f.proyecto.id} f={f} estado={estado} dinero={dinero} accion={accion} setProy={setProy} copiarProy={copiarProy} borrarProy={borrarProy} cambiarEstado={cambiarEstado} abrir={abrir} />)}
                </div>
              </div>
            ))}
        </div>
      ) : (
        <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fill,minmax(320px,1fr))' }}>
          {filasVisibles.map((f) => <TarjetaProyecto key={f.proyecto.id} f={f} estado={estado} dinero={dinero} accion={accion} setProy={setProy} copiarProy={copiarProy} borrarProy={borrarProy} cambiarEstado={cambiarEstado} abrir={abrir} />)}
        </div>
      )}

      {(riesgos.length > 0 || t.comparativosPendientes > 0) ? (
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Qué atender primero</h3></div>
          {riesgos.slice(0, 8).map((r, i) => (
            <button key={i} onClick={() => abrir({ id: r.proyectoId })}
              style={{ display: 'flex', width: '100%', justifyContent: 'space-between', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--borde)', textAlign: 'left', alignItems: 'center' }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 9, minWidth: 0 }}>
                <Icono n={r.icono} s={16} c="var(--rojo)" />
                <span style={{ minWidth: 0 }}>
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{r.categoria}</span>
                  <span className="mini" style={{ display: 'block' }}>{r.proyecto}</span>
                </span>
              </span>
              <span className="mono neg" style={{ fontWeight: 700, flexShrink: 0 }}>+{dinero(r.monto, true)}</span>
            </button>
          ))}
          {t.comparativosPendientes > 0 ? (
            <div className="aviso a-info" style={{ marginTop: riesgos.length ? 14 : 0, marginBottom: 0 }}>
              <Icono n="ofertas" s={17} />
              <span>
                Tienes {t.comparativosPendientes} comparativo(s) de ofertas sin adjudicar.
                {t.ahorroEnMesa > 0 ? ' La diferencia entre la oferta más cara y la más barata suma ' + dinero(t.ahorroEnMesa) + '.' : ''}
              </span>
            </div>
          ) : null}
        </div>
      ) : null}

      {/* T7: modal de confirmación de borrado de proyecto */}
      {proyABorrar ? (
        <Modal titulo="Confirmar eliminación" onCerrar={() => { setProyABorrar(null); setTextoConfirm(''); }}
          pie={<React.Fragment>
            <button className="btn" onClick={() => { setProyABorrar(null); setTextoConfirm(''); }}>Cancelar</button>
            <button className="btn btn-peligro" disabled={textoConfirm !== 'Eliminar'} onClick={ejecutarBorrado}>
              <Icono n="basura" s={16} />Borrar definitivamente
            </button>
          </React.Fragment>}>
          <div className="aviso a-alto" style={{ marginBottom: 16 }}>
            <Icono n="alerta" s={18} />
            <span>Esta acción es permanente. Se borrarán el proyecto <strong>"{proyABorrar.nombre}"</strong>, todas sus categorías, gastos ({estado.gastos.filter((g) => g.proyectoId === proyABorrar.id).length}), fotos de facturas y comparativos. No se puede deshacer.</span>
          </div>
          <Campo etq="Escribe Eliminar para confirmar">
            <input autoFocus value={textoConfirm} placeholder="Eliminar" onChange={(e) => setTextoConfirm(e.target.value)}
              style={{ borderColor: textoConfirm === 'Eliminar' ? 'var(--rojo)' : undefined }} />
          </Campo>
          {textoConfirm.length > 0 && textoConfirm !== 'Eliminar' ? (
            <p className="mini" style={{ color: 'var(--texto-3)', marginTop: 4 }}>Escribe exactamente: <strong style={{ color: 'var(--rojo)' }}>Eliminar</strong> (con mayúscula E)</p>
          ) : null}
        </Modal>
      ) : null}

      {proy ? (
        <Modal titulo={proy.id ? 'Editar proyecto' : 'Nuevo proyecto'} onCerrar={() => setProy(null)}
          pie={<React.Fragment>
            <button className="btn" onClick={() => setProy(null)}>Cancelar</button>
            <button className="btn btn-p" onClick={guardarProy}><Icono n="check" s={16} />Guardar</button>
          </React.Fragment>}>
          <Campo etq="Nombre del proyecto">
