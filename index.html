<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obra Firme — Control de proyectos</title>
<meta name="description" content="Control de presupuesto, gastos y ofertas para proyectos de construcción y mantenimiento.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#081113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra Firme">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --fondo:#081113;
  --fondo-2:#0B181B;
  --panel:#0F2126;
  --panel-2:#143036;
  --panel-3:#1B3D44;
  --borde:rgba(255,255,255,.09);
  --borde-fuerte:rgba(255,255,255,.16);
  --texto:#E9F3F4;
  --texto-2:#9BB2B7;
  --texto-3:#6B8085;
  --ambar:#F2A93B;
  --ambar-claro:#FFC96B;
  --ambar-oscuro:#C9871F;
  --menta:#45D6A6;
  --menta-oscuro:#1E8F6B;
  --rojo:#F2705B;
  --rojo-oscuro:#B03A28;
  --sidebar:248px;
  --radio:14px;
  --radio-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);
  background-image:
    radial-gradient(1100px 600px at 12% -8%, rgba(242,169,59,.13), transparent 62%),
    radial-gradient(900px 620px at 96% 8%, rgba(69,214,166,.09), transparent 58%);
  background-attachment:fixed;
  color:var(--texto);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.02em;margin:0}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--ambar);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:9px}

/* ---------- estructura ---------- */
.app{display:flex;min-height:100vh}
.lateral{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);
  background:linear-gradient(180deg,rgba(15,33,38,.98),rgba(8,17,19,.98));
  border-right:1px solid var(--borde);
  padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:40;
}
.marca{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.marca-icono{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--ambar-claro),var(--ambar-oscuro));
  display:grid;place-items:center;color:#1A1005;
  box-shadow:0 6px 18px rgba(242,169,59,.28);
}
.marca-txt .n{font-family:'Oswald',sans-serif;font-size:20px;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.marca-txt .s{font-size:10.5px;color:var(--texto-3);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.nav-btn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radio-sm);
  color:var(--texto-2);font-weight:500;font-size:14.5px;transition:.15s;width:100%;text-align:left;
}
.nav-btn:hover{background:var(--panel);color:var(--texto)}
.nav-btn.on{background:var(--panel-2);color:var(--texto);box-shadow:inset 3px 0 0 var(--ambar)}
.nav-btn.on svg{color:var(--ambar)}
.lateral-pie{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--borde);font-size:11px;color:var(--texto-3)}

.principal{flex:1;margin-left:var(--sidebar);padding:26px 30px 60px;max-width:1500px}
.barra-inf{display:none}

/* ---------- encabezado ---------- */
.cabecera{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.cabecera h1{font-size:30px;text-transform:uppercase;letter-spacing:.05em}
.cabecera .sub{color:var(--texto-2);font-size:13.5px;margin-top:4px}
.acciones{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:var(--radio-sm);
  font-weight:600;font-size:14px;border:1px solid var(--borde);background:var(--panel);
  color:var(--texto);transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--borde-fuerte)}
.btn-p{background:linear-gradient(135deg,var(--ambar-claro),var(--ambar));color:#1A1005;border-color:transparent}
.btn-p:hover{background:linear-gradient(135deg,#FFD588,var(--ambar-claro));color:#1A1005}
.btn-peligro{color:var(--rojo);border-color:rgba(242,112,91,.35)}
.btn-peligro:hover{background:rgba(242,112,91,.12)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn-icono{padding:8px;border-radius:8px;color:var(--texto-2)}
.btn-icono:hover{background:var(--panel-2);color:var(--texto)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- tarjetas ---------- */
.rejilla{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tarjeta{
  background:linear-gradient(160deg,var(--panel),var(--fondo-2));
  border:1px solid var(--borde);border-radius:var(--radio);padding:18px;
}
.kpi{position:relative;overflow:hidden}
.kpi-clickable{border:1px solid var(--borde);transition:.15s}
.kpi-clickable:hover{background:linear-gradient(160deg,var(--panel-3),var(--panel));border-color:var(--borde-fuerte)}
.kpi-clickable:hover::after{width:62px}
.kpi::after{content:'';position:absolute;left:18px;bottom:0;width:46px;height:3px;background:var(--ambar);border-radius:3px 3px 0 0}
.kpi.menta::after{background:var(--menta)}
.kpi.rojo::after{background:var(--rojo)}
.kpi .etq{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3);font-weight:600}
.kpi .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-top:9px;letter-spacing:-.02em;line-height:1.15}
.kpi .pie{font-size:12.5px;color:var(--texto-2);margin-top:6px}
.tarjeta h3{font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:var(--texto)}
.tarjeta-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- barras y anillos ---------- */
.pista{height:8px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden}
.relleno{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.f-sano{background:linear-gradient(90deg,var(--menta-oscuro),var(--menta))}
.f-alerta{background:linear-gradient(90deg,var(--ambar-oscuro),var(--ambar-claro))}
.f-excedido{background:linear-gradient(90deg,var(--rojo-oscuro),var(--rojo))}
.f-sinPresupuesto{background:var(--panel-3)}

.fila-cat{padding:13px 0;border-bottom:1px solid var(--borde)}
.fila-cat:last-child{border-bottom:none}
.fila-cat-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.cat-icono{width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;color:var(--ambar);flex-shrink:0}
.fila-cat-nom{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-cat-cifras{display:flex;justify-content:space-between;font-size:12.5px;color:var(--texto-2);margin-top:7px;gap:10px}

/* ---------- etiquetas ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip-sano{background:rgba(69,214,166,.14);color:var(--menta)}
.chip-alerta{background:rgba(242,169,59,.15);color:var(--ambar-claro)}
.chip-excedido{background:rgba(242,112,91,.15);color:var(--rojo)}
.chip-sinPresupuesto{background:rgba(255,255,255,.07);color:var(--texto-3)}
.chip-neutro{background:var(--panel-2);color:var(--texto-2)}

/* ---------- tablas ---------- */
.tabla-cont{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--texto-3);
  font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--borde);white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
.der{text-align:right}
.cen{text-align:center}

/* ---------- formularios ---------- */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3);font-weight:700}
.campo input,.campo select,.campo textarea{
  background:var(--fondo-2);border:1px solid var(--borde);border-radius:9px;padding:11px 12px;
  color:var(--texto);width:100%;transition:.15s;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ambar);box-shadow:0 0 0 3px rgba(242,169,59,.14)}
.campo textarea{resize:vertical;min-height:64px}
.campo input.mono{font-family:'JetBrains Mono',monospace}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:var(--panel-3);border-radius:5px;padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--ambar);cursor:pointer;border:2px solid var(--fondo)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ambar);cursor:pointer;border:2px solid var(--fondo)}
.interruptor{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}
.interruptor input{display:none}
.pista-sw{width:40px;height:22px;border-radius:99px;background:var(--panel-3);position:relative;transition:.2s;flex-shrink:0}
.pista-sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--texto-2);transition:.2s}
.interruptor input:checked+.pista-sw{background:rgba(69,214,166,.35)}
.interruptor input:checked+.pista-sw::after{left:21px;background:var(--menta)}

/* ---------- modal ---------- */
.velo{position:fixed;inset:0;background:rgba(4,10,11,.78);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{
  background:linear-gradient(160deg,var(--panel),var(--fondo-2));border:1px solid var(--borde-fuerte);
  border-radius:18px;width:100%;max-width:560px;padding:22px;margin:auto;
  box-shadow:0 26px 70px rgba(0,0,0,.6);
}
.modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-cab h3{font-size:19px;text-transform:uppercase;letter-spacing:.05em}
.modal-pie{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* ---------- varios ---------- */
.vacio{text-align:center;padding:44px 20px;color:var(--texto-3)}
.vacio svg{opacity:.35;margin-bottom:12px}
.vacio p{margin:0 0 4px;font-size:14px}
.aviso{display:flex;gap:11px;padding:12px 14px;border-radius:var(--radio-sm);font-size:13.5px;line-height:1.45;align-items:flex-start;margin-bottom:9px}
.aviso svg{flex-shrink:0;margin-top:1px}
.a-alto{background:rgba(242,112,91,.1);border:1px solid rgba(242,112,91,.24);color:#FFC3B8}
.a-medio{background:rgba(242,169,59,.09);border:1px solid rgba(242,169,59,.22);color:#FFDFA8}
.a-info{background:rgba(255,255,255,.045);border:1px solid var(--borde);color:var(--texto-2)}
.a-ok{background:rgba(69,214,166,.09);border:1px solid rgba(69,214,166,.22);color:#A9F0D8}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:background .15s}
.cal-dia:hover{background:var(--fondo-elev)}
.cal-dia.hoy{background:var(--ambar-20);font-weight:700;color:var(--ambar)}
.cal-dia.sel{background:var(--ambar);color:#000;font-weight:700}
.cal-dia.otro{visibility:hidden}
.cal-dot{width:6px;height:6px;border-radius:50%;margin-top:4px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filtros select,.filtros input{
  background:var(--fondo-2);border:1px solid var(--borde);border-radius:9px;padding:9px 11px;color:var(--texto);font-size:13.5px;
}
.filtros input{flex:1;min-width:170px}
.filtros select:focus,.filtros input:focus{outline:none;border-color:var(--ambar)}
.sync-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:.3s}
.sync-ok{background:var(--menta)}
.sync-err{background:var(--rojo)}
.sync-spin{background:var(--ambar);animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.brindis{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--panel-2);border:1px solid var(--borde-fuerte);border-radius:11px;padding:12px 18px;
  font-size:14px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;
  max-width:calc(100vw - 32px);
}
.brindis.ok{border-color:rgba(69,214,166,.4);color:var(--menta)}
.brindis.err{border-color:rgba(242,112,91,.4);color:var(--rojo)}
.pos{color:var(--menta)}
.neg{color:var(--rojo)}
.tenue{color:var(--texto-2)}
.mini{font-size:12px;color:var(--texto-3)}
.sep{height:1px;background:var(--borde);margin:16px 0}
.ganadora{background:rgba(69,214,166,.06)!important;box-shadow:inset 3px 0 0 var(--menta)}
.barrita{height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.barrita i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ambar-oscuro),var(--ambar-claro))}

/* ---------- tablet ---------- */
.ajustes-movil{display:none}
@media(max-width:959px){
  .ajustes-movil{display:inline-flex}
  .lateral{display:none}
  .principal{margin-left:0;padding:20px 18px 100px}
  .barra-inf{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(11,24,27,.97);backdrop-filter:blur(14px);border-top:1px solid var(--borde);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--texto-3);font-size:10px;font-weight:600;border-radius:9px}
  .tab.on{color:var(--ambar)}
  .cabecera h1{font-size:24px}
  .cabecera{align-items:flex-start;margin-bottom:18px}
  .kpi .val{font-size:22px}
}
@media(min-width:700px) and (max-width:959px){
  table{min-width:0}
  .tabla-cont{margin:0;padding:0}
}
/* ---------- móvil ---------- */
@media(max-width:699px){
  body{font-size:14.5px}
  .principal{padding:16px 13px 100px}
  .tarjeta{padding:15px;border-radius:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:11px}
  .kpi .val{font-size:19px}
  .kpi .etq{font-size:9.5px}
  .kpi::after{left:15px;width:34px}
  .dos,.tres{grid-template-columns:1fr}
  .modal{padding:18px;border-radius:15px}
  .velo{padding:12px 10px}
  .acciones{width:100%}
  .acciones .btn{flex:1;justify-content:center}
  .tabla-cont{margin:0 -15px;padding:0 15px}
  /* Banner totales de presupuesto: 1 columna en móvil */
  .presup-banner{grid-template-columns:1fr!important}
  .presup-banner>div{border-left:none!important;border-right:none!important;padding-bottom:14px;border-bottom:1px solid var(--borde)}
  .presup-banner>div:last-child{border-bottom:none;padding-bottom:0}
  .presup-banner .mono{font-size:28px!important}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function useDinero(moneda) {
  return useMemo(() => {
    return (v, corto) => {
      const n = E.num(v);
      const neg = n < 0;
      const a = Math.abs(n);
      let txt;
      if (corto && a >= 1000000) txt = (a / 1000000).toFixed(a >= 10000000 ? 0 : 1) + 'M';
      else if (corto && a >= 10000) txt = (a / 1000).toFixed(a >= 100000 ? 0 : 1) + 'k';
      else txt = a.toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (neg ? '-' : '') + moneda + ' ' + txt;
    };
  }, [moneda]);
}
const fFecha = (f) => {
  if (!f) return '—';
  const [a, m, d] = String(f).split('-');
  return d + '/' + m + '/' + String(a).slice(2);
};

const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlYnNjbGxteGhveGFoa2N2bWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA0MTAsImV4cCI6MjEwMzM0NjQxMH0.6RDa6gQQb1bHmWYoNd0HpUthWl1L5DV_ozdiiQHkzgE';

// Cabeceras reutilizables

// Sube el estado actual a Supabase (upsert silencioso).
// No lanza errores — si falla, el estado sigue en localStorage.
async function supaGuardar(estado) {

    await fetch(
      SUPA_URL + '/rest/v1/' + SUPA_TABLA,
      {
        method: 'POST',
        headers: supaHeaders,
        body: JSON.stringify({ id: SUPA_FILA, datos: estado, actualizado: new Date().toISOString() }),
      }
    );
  } catch { /* sin red — ignorar */ }
}

// Abre una suscripción Realtime de Supabase usando su protocolo
// WebSocket/long-polling. Llama onCambio(nuevoEstado) cuando otro
// dispositivo sube datos. Devuelve una función para desuscribirse.
function supaEscuchar(onCambio) {
  // Supabase Realtime vía fetch long-poll (sin SDK pesado)
  // Usamos el endpoint REST con Prefer: return=representation + polling
  // ya que Realtime WebSocket requiere el SDK. Hacemos polling cada 8s.
  let activo = true;
  let ultimoActualizado = '';

  async function ciclo() {
    while (activo) {
      try {
        const res = await fetch(
          SUPA_URL + '/rest/v1/' + SUPA_TABLA + '?id=eq.' + SUPA_FILA + '&select=datos,actualizado',
          { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } }
        );
        if (res.ok) {
          const arr = await res.json();
          if (arr && arr.length && arr[0].actualizado !== ultimoActualizado) {
            ultimoActualizado = arr[0].actualizado || '';
            if (ultimoActualizado && arr[0].datos) {
              onCambio(Object.assign(E.estadoVacio(), arr[0].datos));
            }
          }
        }
      } catch { /* sin red */ }
      await new Promise(r => setTimeout(r, 8000)); // esperar 8 segundos
    }
  }
  ciclo();
  return () => { activo = false; };
}

/* ============================================================
   FOTOS EN LA NUBE — Supabase Storage
   Las fotos se guardan localmente en IndexedDB (ver photos.js) y,
   además, se suben al bucket de Storage para que otros dispositivos
   las descarguen. Por la nube NO viaja la imagen dentro del estado
   JSON (sería pesadísimo en cada sincronización); solo viaja un
   índice liviano (estado.fotosNube) con la URL de cada foto. La
   reconciliación entre ese índice y lo que hay en IndexedDB ocurre
   en App() (ver fotosReconciliar).
   ============================================================ */
const SUPA_BUCKET_FOTOS = 'obra-fotos';

function dataURLaBlob(dataURL) {
  const partes = String(dataURL).split(',');
  const mime = (partes[0].match(/data:(.*?);base64/) || [])[1] || 'image/jpeg';
  const bin = atob(partes[1] || '');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

function blobADataURL(blob) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer la foto descargada.'));
    lector.onload = () => resolve(lector.result);
    lector.readAsDataURL(blob);
  });
}

// Sube una foto (registro de FOTOS, con su dataURL) al bucket y
// devuelve la URL pública para guardarla en el índice.
async function supaFotoSubir(registro) {
  const ruta = registro.gastoId + '/' + registro.id + '.jpg';
  const res = await fetch(
    SUPA_URL + '/storage/v1/object/' + SUPA_BUCKET_FOTOS + '/' + ruta,
    {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'image/jpeg',
        'x-upsert': 'true',
      },
      body: dataURLaBlob(registro.dataURL),
    }
  );
  if (!res.ok) throw new Error('No se pudo subir la foto (HTTP ' + res.status + ').');
  return SUPA_URL + '/storage/v1/object/public/' + SUPA_BUCKET_FOTOS + '/' + ruta;
}

// Descarga una foto por su URL pública y la devuelve como dataURL.
async function supaFotoDescargar(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('No se pudo descargar la foto (HTTP ' + res.status + ').');
  return blobADataURL(await res.blob());
}

// Borra una foto del bucket (silencioso si falla: no bloquea al usuario).
async function supaFotoBorrar(gastoId, id) {
  try {
    await fetch(
      SUPA_URL + '/storage/v1/object/' + SUPA_BUCKET_FOTOS + '/' + gastoId + '/' + id + '.jpg',
      { method: 'DELETE', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } }
    );
  } catch { /* sin red — no importa, no queda referenciada desde ningún índice */ }
}

  const p = Math.max(0, Math.min(pct, 120));
  const r = (tam - grosor) / 2;
  const c = 2 * Math.PI * r;
  const avance = Math.min(p, 100) / 100;
  const color =
    estado === 'excedido' ? 'var(--rojo)' : estado === 'alerta' ? 'var(--ambar)' : estado === 'sinPresupuesto' ? 'var(--panel-3)' : 'var(--menta)';

        <circle cx={tam / 2} cy={tam / 2} r={r} stroke="rgba(255,255,255,.07)" strokeWidth={grosor} fill="none" />
        <circle cx={tam / 2} cy={tam / 2} r={r} stroke={color} strokeWidth={grosor} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - avance)}
          style={{ transition: 'stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeContent: 'center', textAlign: 'center' }}>

              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                <Icono n="alerta" s={19} c="var(--rojo)" />
                Vencimientos próximos ({proxVencer.length})
              </span>
            </h3>
            <button className="btn btn-sm" onClick={irAGastosPendientes}>Ver todos los pendientes</button>
          </div>
          {proxVencer.map(({ gasto: g, dias }) => (
            <div key={g.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid var(--borde)', flexWrap: 'wrap' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{g.descripcion || 'Sin descripción'}</div>
                <div className="mini" style={{ marginTop: 3 }}>
                  {g.proveedor ? g.proveedor + ' · ' : ''}
                  {fFecha(g.fechaVencimiento)}
                  {' '}
                  <span style={{ fontWeight: 700, color: dias < 0 ? 'var(--rojo)' : dias === 0 ? 'var(--rojo)' : 'var(--ambar)' }}>
                    {dias < 0 ? 'Vencida hace ' + Math.abs(dias) + ' día(s)' : dias === 0 ? 'Vence hoy' : 'Vence en ' + dias + ' día(s)'}
                  </span>
                </div>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <div className="mono" style={{ fontWeight: 700, fontSize: 14, color: 'var(--rojo)' }}>{dinero(g.monto, true)}</div>
              </div>
            </div>
          ))}
        </div>
      ) : null}

      <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(310px,1fr))' }}>
        <div className="tarjeta">
          <div className="tarjeta-cab"><h3>Señales del proyecto</h3></div>
          {alertas.map((a, i) => (
            <div className={'aviso a-' + a.nivel} key={i}>
              <Icono n={a.nivel === 'ok' ? 'check' : a.nivel === 'info' ? 'info' : 'alerta'} s={17} />
              <span>{a.texto}</span>
            </div>
          ))}
        </div>

        <div className="tarjeta">
          <div className="tarjeta-cab">
            <h3>Últimos gastos</h3>
            <button className="btn btn-sm" onClick={() => irA('gastos')}>Ver todos</button>
          </div>
          {ultimos.length === 0 ? (
            <Vacio icono="gastos" titulo="Todavía no hay gastos" texto="Registra el primer movimiento del proyecto." />
          ) : (
            ultimos.map((g) => (
              <div key={g.id} style={{ display: 'flex', justifyContent: 'space-between', gap: 12, padding: '10px 0', borderBottom: '1px solid var(--borde)' }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{g.descripcion || 'Sin descripción'}</div>
                  <div className="mini">{fFecha(g.fecha)} · {(mapaCat[g.categoriaId] || {}).nombre || 'Sin categoría'}</div>
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div className="mono" style={{ fontWeight: 700, fontSize: 14 }}>{dinero(g.monto, true)}</div>
                  {!g.pagado ? <div className="mini" style={{ color: 'var(--ambar)' }}>por pagar</div> : null}
                </div>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   VISTA: PRESUPUESTO
   ============================================================ */
function Presupuesto({ estado, v, dinero, accion, brindar }) {
  const [editando, setEditando] = useState(null);
  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaV = {};
  v.detalle.forEach((d) => (mapaV[d.categoriaId] = d));

  const abrirNueva = () =>
    setEditando({ id: null, nombre: '', icono: 'obra_gris', fase: E.FASES[0], presupuesto: '' });

  const guardarCat = () => {
    const d = editando;
    const nombreLimpio = d.nombre.trim();
    if (!nombreLimpio) return brindar('Ponle nombre a la categoría.', 'err');
    // No permitir dos categorías con el mismo nombre en el mismo proyecto.
    // Al editar, se ignora la propia categoría (para poder renombrarla a sí misma).
    const duplicada = estado.categorias.some((c) =>
      c.proyectoId === estado.proyectoActivo &&
      c.id !== d.id &&
      c.nombre.trim().toLowerCase() === nombreLimpio.toLowerCase()
    );
    if (duplicada) return brindar('Ya existe una categoría con ese nombre en este proyecto.', 'err');
    if (d.id) {
      accion((s) => ({
        ...s,
        categorias: s.categorias.map((c) =>
          c.id === d.id ? { ...c, nombre: d.nombre.trim(), icono: d.icono, fase: d.fase, presupuesto: E.r2(d.presupuesto) } : c
        ),
      }));
      brindar('Categoría actualizada.', 'ok');
    } else {
      accion((s) => ({
        ...s,
        categorias: s.categorias.concat([{
          id: E.uid('ct'), proyectoId: s.proyectoActivo, nombre: d.nombre.trim(),
          icono: d.icono, fase: d.fase, presupuesto: E.r2(d.presupuesto),
        }]),
      }));
      brindar('Categoría creada.', 'ok');
    }
    setEditando(null);
  };

  const borrarCat = (c) => {
    const usados = estado.gastos.filter((g) => g.categoriaId === c.id).length;
    const licit = estado.licitaciones.filter((l) => l.categoriaId === c.id).length;
    let msg = '¿Borrar la categoría "' + c.nombre + '"?';
    if (usados || licit) {
      msg += '\n\nTiene ' + usados + ' gasto(s) y ' + licit + ' comparativo(s) asociados. Los gastos NO se borran: quedarán como "sin categoría" y seguirán sumando al total.';
    }
    if (!confirm(msg)) return;
    accion((s) => ({ ...s, categorias: s.categorias.filter((x) => x.id !== c.id) }));
    brindar('Categoría eliminada.', 'ok');
  };

  return (
    <div>
      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Presupuesto por categoría</h3>
          <button className="btn btn-p btn-sm" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva categoría</button>
        </div>

        {/* T4: banner de totales resaltado */}
        <div className="presup-banner" style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 16, marginBottom: 20, padding: '18px 0 20px', borderBottom: '2px solid var(--borde)' }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700, marginBottom: 6 }}>Presupuesto total</div>
            <div className="mono" style={{ fontSize: 36, fontWeight: 700, color: 'var(--ambar)', lineHeight: 1.1, letterSpacing: '-.02em' }}>{dinero(v.presupuesto, true)}</div>
          </div>
          <div style={{ textAlign: 'center', borderLeft: '1px solid var(--borde)', borderRight: '1px solid var(--borde)' }}>
            <div style={{ fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700, marginBottom: 6 }}>Ejecutado</div>
            <div className="mono" style={{ fontSize: 36, fontWeight: 700, color: 'var(--texto)', lineHeight: 1.1, letterSpacing: '-.02em' }}>{dinero(v.gastado, true)}</div>
            <div style={{ fontSize: 12, color: 'var(--texto-2)', marginTop: 4 }}>{v.ejecucion}% del total</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700, marginBottom: 6 }}>{v.saldo >= 0 ? 'Disponible' : 'Sobrecosto'}</div>
            <div className="mono" style={{ fontSize: 36, fontWeight: 700, lineHeight: 1.1, letterSpacing: '-.02em', color: v.saldo >= 0 ? 'var(--menta)' : 'var(--rojo)' }}>{dinero(Math.abs(v.saldo), true)}</div>
          </div>
        </div>

        {cats.length === 0 ? (
          <Vacio icono="presupuesto" titulo="Sin categorías" texto="Crea las partidas de este proyecto para empezar a controlar el gasto."
            accion={<button className="btn btn-p" onClick={abrirNueva}><Icono n="mas" s={16} />Nueva categoría</button>} />
        ) : (
          <div className="tabla-cont">
            <table>
              <thead>
                <tr>
                  <th>Categoría</th>
                  <th className="der">Presupuesto</th>
                  <th className="der">Ejecutado</th>
                  <th className="der">Saldo</th>
                  <th style={{ width: 150 }}>Avance</th>
                  <th className="der">Acciones</th>
                </tr>
              </thead>
              <tbody>
                {cats.map((c) => {
                  const d = mapaV[c.id] || { presupuesto: 0, gastado: 0, saldo: 0, ejecucion: 0, estado: E.ESTADOS.sinPresupuesto, movimientos: 0 };
                  return (
                    <tr key={c.id}>
                      <td>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <div className="cat-icono"><Icono n={c.icono} s={17} /></div>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontWeight: 600 }}>{c.nombre}</div>
                            <div className="mini">{c.fase} · {d.movimientos} mov.</div>
                          </div>
                        </div>
                      </td>
                      <td className="der mono">{dinero(d.presupuesto)}</td>
                      <td className="der mono">{dinero(d.gastado)}</td>
                      <td className={'der mono ' + (d.saldo >= 0 ? 'pos' : 'neg')}>{d.saldo >= 0 ? '+' : ''}{dinero(d.saldo)}</td>
                      <td>
                        <Barra pct={d.ejecucion} estado={d.estado.id} />
                        <div className="mini mono" style={{ marginTop: 5 }}>{d.ejecucion}% · {d.estado.label}</div>
                      </td>
                      <td className="der" style={{ whiteSpace: 'nowrap' }}>
                        <button className="btn-icono" onClick={() => setEditando({ ...c, presupuesto: String(c.presupuesto || '') })} aria-label="Editar"><Icono n="lapiz" s={17} /></button>
                        <button className="btn-icono" onClick={() => borrarCat(c)} aria-label="Borrar"><Icono n="basura" s={17} /></button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop: '2px solid var(--borde-fuerte)' }}>
                  <td style={{ fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', fontSize: 12 }}>Total</td>
                  <td className="der mono" style={{ fontWeight: 700 }}>{dinero(v.presupuesto)}</td>
                  <td className="der mono" style={{ fontWeight: 700 }}>{dinero(v.gastado)}</td>
                  <td className={'der mono ' + (v.saldo >= 0 ? 'pos' : 'neg')} style={{ fontWeight: 700 }}>{v.saldo >= 0 ? '+' : ''}{dinero(v.saldo)}</td>
                  <td><Chip estado={v.estado.id} texto={v.ejecucion + '% · ' + v.estado.label} /></td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </div>

      {editando ? (
        <Modal titulo={editando.id ? 'Editar categoría' : 'Nueva categoría'} onCerrar={() => setEditando(null)}
          pie={<React.Fragment>
            <button className="btn" onClick={() => setEditando(null)}>Cancelar</button>
            <button className="btn btn-p" onClick={guardarCat}><Icono n="check" s={16} />Guardar</button>
          </React.Fragment>}>
          <Campo etq="Nombre">
            <input value={editando.nombre} autoFocus
              onChange={(e) => setEditando({ ...editando, nombre: e.target.value })}
              placeholder="Ej. Acabados de fachada" />
          </Campo>
          <div className="dos">
            <Campo etq="Fase">
              <select value={editando.fase} onChange={(e) => setEditando({ ...editando, fase: e.target.value })}>
                {E.FASES.map((f) => <option key={f} value={f}>{f}</option>)}
              </select>
            </Campo>
            <Campo etq="Presupuesto">
              <input className="mono" inputMode="decimal" value={editando.presupuesto}
                onChange={(e) => setEditando({ ...editando, presupuesto: e.target.value })} placeholder="0.00" />
            </Campo>
          </div>
          <Campo etq="Icono">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {E.ICONOS.map((ic) => (
                <button key={ic} onClick={() => setEditando({ ...editando, icono: ic })}
                  style={{
                    width: 42, height: 42, borderRadius: 10, display: 'grid', placeItems: 'center',
                    background: editando.icono === ic ? 'rgba(242,169,59,.16)' : 'var(--panel-2)',
                    color: editando.icono === ic ? 'var(--ambar)' : 'var(--texto-2)',
                    border: '1px solid ' + (editando.icono === ic ? 'var(--ambar)' : 'transparent'),
                  }}><Icono n={ic} s={19} /></button>
              ))}
            </div>
          </Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: GASTOS
   ============================================================ */
function formGastoVacio(catId) {
  return {
    id: E.uid('gs'), categoriaId: catId || '', fecha: E.hoy(), descripcion: '', proveedor: '',
    tipo: 'material', cantidad: '1', unidad: 'unidad', precioUnitario: '', pagado: true, notas: '',
    _esNuevo: true,
  };
}

function Gastos({ estado, dinero, accion, brindar, filtroInicial, limpiarFiltroInicial }) {
  const [form, setForm] = useState(null);
  const [fCat, setFCat] = useState('');
  const [fTipo, setFTipo] = useState('');
  const [fMes, setFMes] = useState('');
  const [txt, setTxt] = useState('');
  const [fotos, setFotos] = useState([]);
  const [subiendo, setSubiendo] = useState(false);
  const [conteoFotos, setConteoFotos] = useState({});
  // T8: filtro "solo pendientes de pago" activable desde la tarjeta KPI del panel.
  const [soloPendientes, setSoloPendientes] = useState(false);
  // T3: foto abierta en el visor a pantalla completa (dataURL o null).
  const [fotoAmpliada, setFotoAmpliada] = useState(null);
  // T5c: proveedor que se está creando en el panel inline (objeto o null).
  const [nuevoProv, setNuevoProv] = useState(null);
  // T5c: mostrar/ocultar la lista de sugerencias del combo proveedor.
  const [provAbierto, setProvAbierto] = useState(false);
  // Ref del form: protege el contenido del formulario durante operaciones
  // que disparan re-renders (guardar proveedor nuevo, etc.)
  const formRef = useRef(null);
  const inputCamara = useRef(null);
  const inputGaleria = useRef(null);

  const proveedores = estado.proveedores || [];
  formRef.current = form; // siempre refleja el form más reciente

  // T8: cuando el panel pide abrir Gastos con el filtro de pendientes, se activa
  // una sola vez y se limpia la señal para no re-activarlo en cada render.
  useEffect(() => {
    if (filtroInicial === 'pendientes') {
      setSoloPendientes(true);
      if (limpiarFiltroInicial) limpiarFiltroInicial();
    }
  }, [filtroInicial]);

  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaCat = {};
  estado.categorias.forEach((c) => (mapaCat[c.id] = c));

  const refrescarConteo = () => {
    FOTOS.todas().then((t) => setConteoFotos(FOTOS.contarPorGasto(t))).catch(() => {});
  };
  useEffect(refrescarConteo, [estado.gastos]);

  // Al abrir el formulario (nuevo o editar), se cargan las fotos que ya tenga ese gasto.
  useEffect(() => {
    if (!form) { setFotos([]); return; }
    let vivo = true;
    FOTOS.listarPorGasto(form.id).then((l) => { if (vivo) setFotos(l); }).catch(() => { if (vivo) setFotos([]); });
    return () => { vivo = false; };
  }, [form?.id]);

  // T3: cerrar el visor de foto con la tecla Escape
  useEffect(() => {
    if (!fotoAmpliada) return;
    const esc = (e) => { if (e.key === 'Escape') setFotoAmpliada(null); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [fotoAmpliada]);

  const todos = estado.gastos.filter((g) => g.proyectoId === estado.proyectoActivo);
  const meses = Array.from(new Set(todos.map((g) => E.mesDe(g.fecha)).filter(Boolean))).sort().reverse();

  const lista = todos
    .filter((g) => (!fCat || g.categoriaId === fCat) && (!fTipo || g.tipo === fTipo) && (!fMes || E.mesDe(g.fecha) === fMes))
    .filter((g) => (!soloPendientes || g.pagado === false))
    .filter((g) => {
      if (!txt.trim()) return true;
      const q = txt.toLowerCase();
      return (
        String(g.descripcion || '').toLowerCase().indexOf(q) !== -1 ||
        String(g.proveedor || '').toLowerCase().indexOf(q) !== -1 ||
        String((mapaCat[g.categoriaId] || {}).nombre || '').toLowerCase().indexOf(q) !== -1
      );
    })
    .sort((a, b) => {
      // Con el filtro de pendientes: ordenar por vencimiento ascendente,
      // los sin fecha al final. Sin filtro: por fecha del gasto, lo más reciente arriba.
      if (soloPendientes) {
        const va = a.fechaVencimiento || '';
        const vb = b.fechaVencimiento || '';
        if (va && vb) return va < vb ? -1 : va > vb ? 1 : 0;
        if (va && !vb) return -1;
        if (!va && vb) return 1;
        return 0;
      }
      return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.creado < b.creado ? 1 : -1);
    });

  const total = E.r2(lista.reduce((s, g) => s + E.num(g.monto), 0));
  const previo = E.r2(E.num(form && form.cantidad) * E.num(form && form.precioUnitario));

  const cerrarForm = () => {
    // Si era un gasto nuevo y se cancela sin guardar, las fotos que ya se
    // subieron durante la edición quedarían huérfanas en el almacén: se borran.
    if (form && form._esNuevo) {
      FOTOS.eliminarPorGasto(form.id).catch(() => {});
    }
    setForm(null);
  };

  const agregarFotos = async (archivos) => {
    if (!archivos || archivos.length === 0) return;
    setSubiendo(true);
    try {
      for (const archivo of Array.from(archivos)) {
        if (!FOTOS.puedeAgregarMas(fotos)) {
          brindar('Ya tienes el máximo de ' + FOTOS.MAX_FOTOS_POR_GASTO + ' fotos en este gasto.', 'err');
          break;
        }
        if (!/^image\//.test(archivo.type)) {
          brindar('"' + archivo.name + '" no es una imagen.', 'err');
          continue;
        }
        try {
          const { dataURL, ancho, alto } = await FOTOS.comprimirArchivo(archivo);
          const registro = await FOTOS.guardar(form.id, dataURL, ancho, alto);
          setFotos((f) => f.concat([registro]));
        } catch (e) {
          brindar('No se pudo procesar "' + archivo.name + '": ' + e.message, 'err');
        }
      }
    } finally {
      setSubiendo(false);
      refrescarConteo();
    }
  };

  const quitarFoto = (id) => {
    FOTOS.eliminar(id).then(() => {
      setFotos((f) => f.filter((x) => x.id !== id));
      refrescarConteo();
    }).catch(() => brindar('No se pudo borrar la foto.', 'err'));
  };

  const guardarGasto = () => {
    if (!form.categoriaId) return brindar('Elige una categoría.', 'err');
    if (!form.descripcion.trim()) return brindar('Describe el gasto.', 'err');
    if (E.num(form.precioUnitario) <= 0) return brindar('El precio unitario debe ser mayor a cero.', 'err');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(form.fecha)) return brindar('La fecha no es válida.', 'err');

    const limpio = E.normalizarGasto({
      id: form.id,
      proyectoId: estado.proyectoActivo,
      categoriaId: form.categoriaId,
      fecha: form.fecha,
      descripcion: form.descripcion.trim(),
      proveedor: form.proveedor.trim(),
      tipo: form.tipo,
      cantidad: form.cantidad,
      unidad: form.unidad,
      precioUnitario: form.precioUnitario,
      pagado: form.pagado,
      notas: form.notas,
      creado: form.creado,
    });
    accion((s) => ({
      ...s,
      gastos: form._esNuevo ? s.gastos.concat([limpio]) : s.gastos.map((g) => (g.id === form.id ? limpio : g)),
    }));
    brindar(form._esNuevo ? 'Gasto registrado.' : 'Gasto actualizado.', 'ok');
    setForm(null);
    refrescarConteo();
  };

  const borrarGasto = (g) => {
    if (!confirm('¿Borrar el gasto "' + (g.descripcion || 'sin descripción') + '" por ' + dinero(g.monto) + '?\n\nSi tiene fotos de factura, también se borran.')) return;
    accion((s) => ({ ...s, gastos: s.gastos.filter((x) => x.id !== g.id) }));
    FOTOS.eliminarPorGasto(g.id).then(refrescarConteo).catch(() => {});
    brindar('Gasto eliminado.', 'ok');
  };

  const alternarPago = (g) => {
    accion((s) => ({ ...s, gastos: s.gastos.map((x) => (x.id === g.id ? { ...x, pagado: !x.pagado } : x)) }));
  };

  const abrirEdicion = (g) => setForm({
    ...g, cantidad: String(g.cantidad), precioUnitario: String(g.precioUnitario),
    descripcion: g.descripcion || '', proveedor: g.proveedor || '', notas: g.notas || '', _esNuevo: false,
  });

  // Unidades predefinidas (T4)
  const UNIDADES = ['Unidad', 'm²', 'm³', 'Libras', 'Bolsa', 'Caja', 'Global', 'Jornal', 'qq', 'ml', 'L', 'Otra…'];
  const esUnidadPredefinida = (u) => UNIDADES.slice(0, -1).includes(u);
  const unidadSelect = form ? (esUnidadPredefinida(form.unidad) ? form.unidad : 'Otra…') : 'Unidad';
  const provsFiltrados = form
    ? proveedores.filter((p) => p.nombre.toLowerCase().includes((form.proveedor || '').toLowerCase()) && (form.proveedor || '').trim().length > 0)
    : [];

  return (
    <div>
      {/* T3: visor de foto a pantalla completa */}
      {fotoAmpliada ? (
        <div onMouseDown={(e) => { if (e.target === e.currentTarget) setFotoAmpliada(null); }}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.92)', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <img src={fotoAmpliada} alt="Factura ampliada"
            style={{ maxWidth: '90vw', maxHeight: '85vh', borderRadius: 12, boxShadow: '0 8px 40px rgba(0,0,0,.7)', objectFit: 'contain' }} />
          <button onClick={() => setFotoAmpliada(null)}
            style={{ position: 'fixed', top: 18, right: 18, width: 40, height: 40, borderRadius: '50%', background: 'rgba(255,255,255,.12)', border: '1px solid rgba(255,255,255,.22)', display: 'grid', placeItems: 'center', color: '#fff', fontSize: 20, cursor: 'pointer' }}>
            <Icono n="equis" s={20} c="#fff" />
          </button>
        </div>
      ) : null}

      {/* El panel de nuevo proveedor se renderiza DENTRO del Modal del gasto (ver abajo) */}

      <div className="tarjeta">
        <div className="tarjeta-cab">
          <h3>Movimientos</h3>
          <button className="btn btn-p btn-sm" onClick={() => setForm(formGastoVacio(fCat || (cats[0] || {}).id))}>
            <Icono n="mas" s={16} />Registrar gasto
          </button>
        </div>

        <div className="filtros">
          <input placeholder="Buscar descripción o proveedor…" value={txt} onChange={(e) => setTxt(e.target.value)} />
          <select value={fCat} onChange={(e) => setFCat(e.target.value)}>
            <option value="">Todas las categorías</option>
            {cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
          <select value={fTipo} onChange={(e) => setFTipo(e.target.value)}>
            <option value="">Todo tipo</option>
            {E.TIPOS_GASTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
          <select value={fMes} onChange={(e) => setFMes(e.target.value)}>
            <option value="">Todo el periodo</option>
            {meses.map((m) => <option key={m} value={m}>{E.nombreMes(m)}</option>)}
          </select>
        </div>

        {/* T8: chip visible cuando el filtro de pendientes está activo */}
        {soloPendientes ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '0 0 12px', padding: '9px 12px', background: 'rgba(242,169,59,.1)', border: '1px solid rgba(242,169,59,.3)', borderRadius: 10 }}>
            <Icono n="reloj" s={16} c="var(--ambar)" />
            <span style={{ fontSize: 13.5, color: 'var(--ambar-claro)', flex: 1 }}>Mostrando solo facturas pendientes de pago, ordenadas por vencimiento</span>
            <button className="btn btn-sm" onClick={() => setSoloPendientes(false)}>Quitar filtro</button>
          </div>
        ) : null}

        {lista.length === 0 ? (
          <Vacio icono="gastos" titulo="No hay gastos que mostrar" texto="Ajusta los filtros o registra el primer movimiento."
            accion={<button className="btn btn-p" onClick={() => setForm(formGastoVacio((cats[0] || {}).id))}><Icono n="mas" s={16} />Registrar gasto</button>} />
        ) : (
          <React.Fragment>
            <div className="tabla-cont">
              <table>
                <thead>
                  <tr>
                    <th style={{ width: 78 }}>Fecha</th>
                    <th>Detalle</th>
                    <th>Categoría</th>
                    <th className="der">Cant. × P.U.</th>
                    <th className="der">Monto</th>
                    <th>Vence</th>
                    <th className="cen">Factura</th>
                    <th className="cen">Pagado</th>
                    <th className="der"></th>
                  </tr>
                </thead>
                <tbody>
                  {lista.map((g) => {
                    const c = mapaCat[g.categoriaId];
                    const nFotos = conteoFotos[g.id] || 0;
                    const dias = g.fechaVencimiento ? E.diasHasta(g.fechaVencimiento) : null;
                    return (
                      <tr key={g.id}>
                        <td className="mono" style={{ fontSize: 13 }}>{fFecha(g.fecha)}</td>
                        <td>
                          <div style={{ fontWeight: 600 }}>{g.descripcion || 'Sin descripción'}</div>
                          <div className="mini">{g.proveedor || 'Sin proveedor'} · {(E.TIPOS_GASTO.filter((t) => t.id === g.tipo)[0] || { label: 'Otro' }).label}</div>
                        </td>
                        <td>
                          {c ? (
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
                              <Icono n={c.icono} s={15} c="var(--ambar)" />
                              <span style={{ fontSize: 13.5 }}>{c.nombre}</span>
                            </span>
                          ) : <Chip estado="excedido" texto="Sin categoría" />}
                        </td>
                        <td className="der mono" style={{ fontSize: 13, color: 'var(--texto-2)' }}>
                          {E.num(g.cantidad).toLocaleString('es-NI')} {g.unidad || ''} × {E.num(g.precioUnitario).toLocaleString('es-NI', { minimumFractionDigits: 2 })}
                        </td>
                        <td className="der mono" style={{ fontWeight: 700 }}>{dinero(g.monto)}</td>
                        <td>
                          {/* T6b: mostrar vencimiento y alerta si está próximo/vencido */}
                          {!g.pagado && g.fechaVencimiento ? (
                            <span className={'mono ' + (dias !== null && dias < 0 ? 'neg' : dias !== null && dias <= 3 ? '' : 'tenue')}
                              style={{ fontSize: 12.5, fontWeight: dias !== null && dias <= 3 ? 700 : 400, color: dias !== null && dias < 0 ? 'var(--rojo)' : dias !== null && dias <= 3 ? 'var(--ambar)' : undefined }}>
                              {fFecha(g.fechaVencimiento)}
                              {dias !== null ? (' (' + (dias < 0 ? dias + 'd' : dias === 0 ? 'hoy' : '+' + dias + 'd') + ')') : ''}
                            </span>
                          ) : <span className="tenue" style={{ fontSize: 12 }}>—</span>}
                        </td>
                        <td className="cen">
                          <button className="btn-icono" onClick={() => abrirEdicion(g)} title={nFotos ? 'Ver ' + nFotos + ' foto(s)' : 'Agregar foto de factura'}>
                            <Icono n="camara" s={17} c={nFotos ? 'var(--ambar)' : 'var(--texto-3)'} />
                          </button>
                          {nFotos > 0 ? <span className="mini mono">{nFotos}</span> : null}
                        </td>
                        <td className="cen">
                          <button className="btn-icono" onClick={() => alternarPago(g)} title={g.pagado ? 'Marcar como pendiente' : 'Marcar como pagado'}>
                            <Icono n={g.pagado ? 'check' : 'reloj'} s={18} c={g.pagado ? 'var(--menta)' : 'var(--ambar)'} />
                          </button>
                        </td>
                        <td className="der" style={{ whiteSpace: 'nowrap' }}>
                          <button className="btn-icono" onClick={() => abrirEdicion(g)}><Icono n="lapiz" s={17} /></button>
                          <button className="btn-icono" onClick={() => borrarGasto(g)}><Icono n="basura" s={17} /></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 14, borderTop: '2px solid var(--borde-fuerte)' }}>
              <span className="mini">{lista.length} movimiento(s) en pantalla</span>
              <span className="mono" style={{ fontSize: 18, fontWeight: 700 }}>{dinero(total)}</span>
            </div>
          </React.Fragment>
        )}
      </div>

      {form ? (
        <Modal titulo={form._esNuevo ? 'Registrar gasto' : 'Editar gasto'} onCerrar={cerrarForm}
          pie={<React.Fragment>
            <button className="btn" onClick={cerrarForm}>Cancelar</button>
            <button className="btn btn-p" onClick={guardarGasto}><Icono n="check" s={16} />Guardar</button>
          </React.Fragment>}>
          <Campo etq="Descripción">
            <input value={form.descripcion} autoFocus placeholder="Ej. Cemento gris 42.5 kg"
              onChange={(e) => setForm({ ...form, descripcion: e.target.value })} />
          </Campo>
          <div className="dos">
            <Campo etq="Categoría">
              <select value={form.categoriaId} onChange={(e) => setForm({ ...form, categoriaId: e.target.value })}>
                <option value="">Elegir…</option>
                {cats.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </Campo>
            <Campo etq="Tipo">
              <select value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}>
                {E.TIPOS_GASTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </Campo>
          </div>
          <div className="dos">
            <Campo etq="Fecha">
              <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} />
            </Campo>

            {/* T5c: combo inteligente de proveedor */}
            <div className="campo" style={{ position: 'relative' }}>
              <label style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700 }}>Proveedor</label>
              <input
                value={form.proveedor}
                placeholder="Escribe para buscar…"
                autoComplete="off"
                onFocus={() => setProvAbierto(true)}
                onBlur={() => setTimeout(() => setProvAbierto(false), 180)}
                onChange={(e) => { setForm({ ...form, proveedor: e.target.value }); setProvAbierto(true); }}
                style={{ background: 'var(--fondo-2)', border: '1px solid var(--borde)', borderRadius: 9, padding: '11px 12px', color: 'var(--texto)', width: '100%' }}
              />
              {provAbierto && (form.proveedor || '').trim().length > 0 ? (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'var(--panel-2)', border: '1px solid var(--borde-fuerte)', borderRadius: 10, zIndex: 50, marginTop: 4, boxShadow: '0 8px 24px rgba(0,0,0,.4)', overflow: 'hidden' }}>
                  {provsFiltrados.map((p) => (
                    <button key={p.id} onMouseDown={() => { setForm((f) => ({ ...f, proveedor: p.nombre })); setProvAbierto(false); }}
                      style={{ display: 'block', width: '100%', textAlign: 'left', padding: '10px 14px', color: 'var(--texto)', fontSize: 14 }}>
                      <div style={{ fontWeight: 600 }}>{p.nombre}</div>
                      {p.telefono ? <div className="mini">{p.telefono}</div> : null}
                    </button>
                  ))}
                  {/* Botón crear nuevo si no coincide exacto */}
                  {!proveedores.some((p) => p.nombre.toLowerCase() === (form.proveedor || '').trim().toLowerCase()) ? (
                    <button onMouseDown={() => { setNuevoProv({ nombre: form.proveedor.trim(), contacto: '', telefono: '', correo: '', direccion: '', notas: '' }); setProvAbierto(false); }}
                      style={{ display: 'block', width: '100%', textAlign: 'left', padding: '10px 14px', color: 'var(--ambar)', fontSize: 13.5, borderTop: '1px solid var(--borde)', fontWeight: 600 }}>
                      <Icono n="mas" s={14} />{' '}Crear proveedor "{form.proveedor.trim()}"
                    </button>
                  ) : null}
                  {provsFiltrados.length === 0 && proveedores.some((p) => p.nombre.toLowerCase() === (form.proveedor || '').trim().toLowerCase()) ? (
                    <div style={{ padding: '10px 14px', color: 'var(--texto-3)', fontSize: 13 }}>Proveedor ya existe</div>
                  ) : null}
                </div>
              ) : null}
            </div>
          </div>

          {/* Panel de nuevo proveedor — DENTRO del Modal para evitar re-renders externos */}
          {nuevoProv ? (
            <div style={{ background: 'var(--panel-2)', border: '1px solid var(--ambar)', borderRadius: 12, padding: 16, marginBottom: 4 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                <h4 style={{ margin: 0, fontFamily: "'Oswald',sans-serif", fontSize: 14, textTransform: 'uppercase', letterSpacing: '.06em', color: 'var(--ambar)' }}>Nuevo proveedor</h4>
                <button className="btn-icono" onClick={() => setNuevoProv(null)}><Icono n="equis" s={16} /></button>
              </div>
              <Campo etq="Nombre">
                <input value={nuevoProv.nombre} autoFocus placeholder="Ej. Ferretería Jenny"
                  onChange={(e) => setNuevoProv({ ...nuevoProv, nombre: e.target.value })} />
              </Campo>
              <Campo etq="Nombre del contacto">
                <input value={nuevoProv.contacto || ''} placeholder="Ej. Juan Pérez"
                  onChange={(e) => setNuevoProv({ ...nuevoProv, contacto: e.target.value })} />
              </Campo>
              <div className="dos">
                <Campo etq="Teléfono">
                  <input value={nuevoProv.telefono || ''}
                    onChange={(e) => setNuevoProv({ ...nuevoProv, telefono: e.target.value })} />
                </Campo>
                <Campo etq="Correo">
                  <input value={nuevoProv.correo || ''}
                    onChange={(e) => setNuevoProv({ ...nuevoProv, correo: e.target.value })} />
                </Campo>
              </div>
              <Campo etq="Dirección">
                <input value={nuevoProv.direccion || ''}
                  onChange={(e) => setNuevoProv({ ...nuevoProv, direccion: e.target.value })} />
              </Campo>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 12 }}>
                <button className="btn btn-sm" onClick={() => setNuevoProv(null)}>Cancelar</button>
                <button className="btn btn-p btn-sm" onClick={() => {
                  if (!nuevoProv.nombre.trim()) return brindar('El proveedor necesita un nombre.', 'err');
                  const prov = {
                    id: E.uid('pv'), nombre: nuevoProv.nombre.trim(),
                    contacto: nuevoProv.contacto || '', telefono: nuevoProv.telefono || '',
                    correo: nuevoProv.correo || '', direccion: nuevoProv.direccion || '',
                    notas: '', creado: new Date().toISOString(),
                  };
                  // setForm PRIMERO con el ref (valor más reciente), luego accion
                  setForm({ ...formRef.current, proveedor: prov.nombre });
                  setNuevoProv(null);
                  setProvAbierto(false);
                  accion((s) => ({ ...s, proveedores: (s.proveedores || []).concat([prov]) }));
                  brindar('Proveedor creado y seleccionado.', 'ok');
                }}><Icono n="check" s={14} />Guardar proveedor</button>
              </div>
            </div>
          ) : null}

          <div className="tres">
            <Campo etq="Cantidad">
              <input className="mono" inputMode="decimal" value={form.cantidad}
                onChange={(e) => setForm({ ...form, cantidad: e.target.value })} />
            </Campo>

            {/* T4: select de unidades con opción "Otra…" */}
            <div className="campo">
              <label style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700 }}>Unidad</label>
              <select value={unidadSelect}
                onChange={(e) => {
                  if (e.target.value === 'Otra…') setForm({ ...form, unidad: '' });
                  else setForm({ ...form, unidad: e.target.value });
                }}
                style={{ background: 'var(--fondo-2)', border: '1px solid var(--borde)', borderRadius: 9, padding: '11px 12px', color: 'var(--texto)', width: '100%' }}>
                {UNIDADES.map((u) => <option key={u} value={u}>{u}</option>)}
              </select>
              {unidadSelect === 'Otra…' ? (
                <input value={form.unidad} placeholder="Escribe la unidad…" style={{ marginTop: 6, background: 'var(--fondo-2)', border: '1px solid var(--borde)', borderRadius: 9, padding: '11px 12px', color: 'var(--texto)', width: '100%' }}
                  onChange={(e) => setForm({ ...form, unidad: e.target.value })} />
              ) : null}
            </div>

            <Campo etq="Precio unitario">
              <input className="mono" inputMode="decimal" value={form.precioUnitario} placeholder="0.00"
                onChange={(e) => setForm({ ...form, precioUnitario: e.target.value })} />
            </Campo>
          </div>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--panel-2)', borderRadius: 10, padding: '12px 14px', marginBottom: 14 }}>
            <span style={{ fontSize: 12, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--texto-3)', fontWeight: 700 }}>Monto</span>
            <span className="mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--ambar)' }}>{dinero(previo)}</span>
          </div>

          <label className="interruptor" style={{ marginBottom: Boolean(form.pagado) ? 18 : 10 }}>
            <input type="checkbox" checked={Boolean(form.pagado)}
              onChange={(e) => setForm({ ...form, pagado: Boolean(e.target.checked), fechaVencimiento: Boolean(e.target.checked) ? '' : (form.fechaVencimiento || '') })} />
            <span className="pista-sw" />
            <span>Ya está pagado</span>
          </label>

          {/* T6b: campo de vencimiento solo si NO está pagado */}
          {!Boolean(form.pagado) ? (
            <Campo etq="Vence el (crédito)">
              <input type="date" value={form.fechaVencimiento || ''}
                onChange={(e) => setForm({ ...form, fechaVencimiento: e.target.value })} />
            </Campo>
          ) : null}

          <Campo etq={'Foto de la factura (' + fotos.length + '/' + FOTOS.MAX_FOTOS_POR_GASTO + ')'}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 9 }}>
              {fotos.map((f) => (
                <div key={f.id} style={{ position: 'relative', width: 68, height: 68, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--borde)' }}>
                  {/* T3: clic en miniatura abre el visor */}
                  <img src={f.dataURL} alt="Factura"
                    style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', cursor: 'zoom-in' }}
                    onClick={() => setFotoAmpliada(f.dataURL)} />
                  <button onClick={() => quitarFoto(f.id)} title="Quitar foto"
                    style={{ position: 'absolute', top: 2, right: 2, width: 20, height: 20, borderRadius: '50%', background: 'rgba(8,17,19,.85)', display: 'grid', placeItems: 'center' }}>
                    <Icono n="equis" s={12} c="#fff" />
                  </button>
                </div>
              ))}
              {FOTOS.puedeAgregarMas(fotos) ? (
                <React.Fragment>
                  <button onClick={() => inputCamara.current && inputCamara.current.click()} disabled={subiendo}
                    style={{ width: 68, height: 68, borderRadius: 10, border: '1px dashed var(--borde-fuerte)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, color: 'var(--texto-2)' }}>
                    <Icono n="camara" s={19} /><span style={{ fontSize: 10 }}>Cámara</span>
                  </button>
                  <button onClick={() => inputGaleria.current && inputGaleria.current.click()} disabled={subiendo}
                    style={{ width: 68, height: 68, borderRadius: 10, border: '1px dashed var(--borde-fuerte)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, color: 'var(--texto-2)' }}>
                    <Icono n="ofertas" s={19} /><span style={{ fontSize: 10 }}>Galería</span>
                  </button>
                </React.Fragment>
              ) : null}
              {subiendo ? <div style={{ width: 68, height: 68, borderRadius: 10, background: 'var(--panel-2)', display: 'grid', placeItems: 'center' }}><span className="mini">…</span></div> : null}
            </div>
            <input ref={inputCamara} type="file" accept="image/*" capture="environment" style={{ display: 'none' }}
              onChange={(e) => { agregarFotos(e.target.files); e.target.value = ''; }} />
            <input ref={inputGaleria} type="file" accept="image/*" multiple style={{ display: 'none' }}
              onChange={(e) => { agregarFotos(e.target.files); e.target.value = ''; }} />
            <div className="mini" style={{ marginTop: 8 }}>Se guarda en este dispositivo, comprimida. No se sube a internet.</div>
          </Campo>

          <Campo etq="Notas (opcional)">
            <textarea value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Detalles, número de factura, condiciones…" />
          </Campo>
        </Modal>
      ) : null}
    </div>
  );
}

/* ============================================================
   VISTA: OFERTAS
   ============================================================ */
function ofertaVacia() {
  return { id: E.uid('of'), proveedor: '', precioUnitario: '', total: '', dias: '', calidad: '3', garantia: '', notas: '' };
}
function licVacia(proyectoId, catId) {
  return {
    id: null, proyectoId, categoriaId: catId || '', titulo: '', unidad: 'unidad', cantidad: '1', notas: '',
    pesos: { ...E.PESOS_DEFECTO },
    ofertas: [ofertaVacia(), ofertaVacia(), ofertaVacia()],
    adjudicadaA: null,
  };
}

function Ofertas({ estado, dinero, accion, brindar }) {
  const [form, setForm] = useState(null);
  const [abierta, setAbierta] = useState(null);
  // T1a: combo de proveedor por índice de oferta (cuál dropdown está abierto)
  const [provAbiertoIdx, setProvAbiertoIdx] = useState(null);
  // T1a: panel inline para nuevo proveedor desde el comparativo (índice de oferta o null)
  const [nuevoProvIdx, setNuevoProvIdx] = useState(null);
  const [nuevoProvDatos, setNuevoProvDatos] = useState(null);
  // T1b: visor de fotos a pantalla completa
  const [fotoAmpliada, setFotoAmpliada] = useState(null);
  // T1b: conteo de fotos por oferta {ofertaId: n}
  const [conteoFotosOfertas, setConteoFotasOfertas] = useState({});
  // T1b: fotos cargadas para la oferta que está siendo editada (solo en el formulario abierto)
  const [fotasOferta, setFotasOferta] = useState({});

  const proveedores = estado.proveedores || [];
  const cats = estado.categorias.filter((c) => c.proyectoId === estado.proyectoActivo);
  const mapaCat = {};
  estado.categorias.forEach((c) => (mapaCat[c.id] = c));
  const lics = estado.licitaciones.filter((l) => l.proyectoId === estado.proyectoActivo);

  // T1b: cerrar visor con Escape
  useEffect(() => {
    if (!fotoAmpliada) return;
    const esc = (e) => { if (e.key === 'Escape') setFotoAmpliada(null); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [fotoAmpliada]);

  // T1b: refresca el conteo de fotos de todas las ofertas del proyecto
  const refrescarConteoFotas = () => {
    FOTOS.todas().then((t) => {
      const cnt = FOTOS.contarPorGasto(t);
      setConteoFotasOfertas(cnt);
    }).catch(() => {});
  };
  useEffect(refrescarConteoFotas, [lics]);

  // T1b: cuando se abre el formulario, cargar fotos de cada oferta
  useEffect(() => {
    if (!form) { setFotasOferta({}); return; }
    let vivo = true;
    Promise.all(
      (form.ofertas || []).map((o) =>
        FOTOS.listarPorGasto(o.id).then((fotos) => ({ id: o.id, fotos })).catch(() => ({ id: o.id, fotos: [] }))
      )
    ).then((resultados) => {
      if (!vivo) return;
      const mapa = {};
      resultados.forEach(({ id, fotos }) => { mapa[id] = fotos; });
      setFotasOferta(mapa);
    });
    return () => { vivo = false; };
  }, [form?.id]);

  // T1b: subir foto a una oferta
  const agregarFotoOferta = async (ofertaId, archivos) => {
    if (!archivos || archivos.length === 0) return;
    for (const archivo of Array.from(archivos)) {
      if (!FOTOS.puedeAgregarMas(fotasOferta[ofertaId] || [])) {
        brindar('Máximo ' + FOTOS.MAX_FOTOS_POR_GASTO + ' fotos por oferta.', 'err'); break;
      }
      if (!/^image\//.test(archivo.type)) { brindar('"' + archivo.name + '" no es una imagen.', 'err'); continue; }
      try {
        const { dataURL, ancho, alto } = await FOTOS.comprimirArchivo(archivo);
        const reg = await FOTOS.guardar(ofertaId, dataURL, ancho, alto);
        setFotasOferta((prev) => ({ ...prev, [ofertaId]: (prev[ofertaId] || []).concat([reg]) }));
        refrescarConteoFotas();
      } catch (e) { brindar('No se pudo procesar la imagen: ' + e.message, 'err'); }
    }
  };

  const quitarFotoOferta = (ofertaId, fotoId) => {
    FOTOS.eliminar(fotoId).then(() => {
      setFotasOferta((prev) => ({ ...prev, [ofertaId]: (prev[ofertaId] || []).filter((f) => f.id !== fotoId) }));
      refrescarConteoFotas();
    }).catch(() => brindar('No se pudo borrar la foto.', 'err'));
  };

  const guardarLic = () => {
    if (!form.titulo.trim()) return brindar('Ponle un título al comparativo.', 'err');
    const ofertas = form.ofertas
      .filter((o) => String(o.proveedor || '').trim() || E.num(o.precioUnitario) > 0 || E.num(o.total) > 0)
      .map((o) => ({
        id: o.id, proveedor: String(o.proveedor || '').trim() || 'Sin nombre',
        precioUnitario: E.r2(o.precioUnitario), total: E.r2(o.total),
        dias: E.num(o.dias), calidad: E.num(o.calidad), garantia: E.num(o.garantia), notas: o.notas || '',
      }));
    if (ofertas.length === 0) return brindar('Ingresa al menos una oferta con precio.', 'err');

    const lic = {
      id: form.id || E.uid('li'),
      proyectoId: estado.proyectoActivo,
      categoriaId: form.categoriaId,
      titulo: form.titulo.trim(),
      unidad: form.unidad,
      cantidad: E.num(form.cantidad),
      notas: form.notas,
      pesos: {
        precio: E.num(form.pesos.precio), calidad: E.num(form.pesos.calidad),
        tiempo: E.num(form.pesos.tiempo), garantia: E.num(form.pesos.garantia),
      },
      ofertas,
      adjudicadaA: ofertas.some((o) => o.id === form.adjudicadaA) ? form.adjudicadaA : null,
      creado: form.creado || new Date().toISOString(),
    };
    accion((s) => ({
      ...s,
      licitaciones: form.id ? s.licitaciones.map((l) => (l.id === form.id ? lic : l)) : s.licitaciones.concat([lic]),
    }));
    brindar(form.id ? 'Comparativo actualizado.' : 'Comparativo creado.', 'ok');
    setAbierta(lic.id);
    setForm(null);
  };

  const borrarLic = (l) => {
    if (!confirm('¿Borrar el comparativo "' + l.titulo + '"? Las ofertas y sus fotos se pierden.')) return;
    // T1b: limpiar fotos de todas las ofertas de este comparativo
    (l.ofertas || []).forEach((o) => FOTOS.eliminarPorGasto(o.id).catch(() => {}));
    accion((s) => ({ ...s, licitaciones: s.licitaciones.filter((x) => x.id !== l.id) }));
    brindar('Comparativo eliminado.', 'ok');
  };

  const adjudicar = (l, ofertaId) => {
    accion((s) => ({
      ...s,
      licitaciones: s.licitaciones.map((x) => (x.id === l.id ? { ...x, adjudicadaA: x.adjudicadaA === ofertaId ? null : ofertaId } : x)),
    }));
  };

  const pasarAGasto = (l, o) => {
    if (!l.categoriaId) return brindar('Asigna una categoría al comparativo primero.', 'err');
    if (!confirm('¿Registrar ' + dinero(o.total) + ' de "' + o.proveedor + '" como gasto en ' + ((mapaCat[l.categoriaId] || {}).nombre || 'la categoría') + '?')) return;
    const g = E.normalizarGasto({
      proyectoId: estado.proyectoActivo, categoriaId: l.categoriaId, fecha: E.hoy(),
      descripcion: l.titulo, proveedor: o.proveedor, tipo: 'material',
      cantidad: E.num(l.cantidad) > 0 ? l.cantidad : 1,
      unidad: l.unidad, precioUnitario: o.precioUnitario, pagado: false,
      notas: 'Generado desde el comparativo de ofertas.',
    });
    accion((s) => ({ ...s, gastos: s.gastos.concat([g]) }));
    brindar('Gasto creado desde la oferta (queda pendiente de pago).', 'ok');
  };

  const editarLic = (l) => {
    const previas = (l.ofertas || []).map((o) => ({
      id: o.id || E.uid('of'),
      proveedor: o.proveedor || '',
      precioUnitario: String(o.precioUnitario || ''),
      total: String(o.total || ''),
      dias: String(o.dias || ''),
      calidad: String(o.calidad || ''),
      garantia: String(o.garantia || ''),
      notas: o.notas || '',
    }));
    while (previas.length < 3) previas.push(ofertaVacia());
    setForm({
      ...l,
      cantidad: String(l.cantidad),
      notas: l.notas || '',
      unidad: l.unidad || 'unidad',
      pesos: { ...E.PESOS_DEFECTO, ...(l.pesos || {}) },
      ofertas: previas,
    });
  };

  return (
    <div>
      {/* T1b: visor de foto a pantalla completa */}
      {fotoAmpliada ? (
        <div onMouseDown={(e) => { if (e.target === e.currentTarget) setFotoAmpliada(null); }}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.92)', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <img src={fotoAmpliada} alt="Cotización ampliada"
            style={{ maxWidth: '90vw', maxHeight: '85vh', borderRadius: 12, boxShadow: '0 8px 40px rgba(0,0,0,.7)', objectFit: 'contain' }} />
          <button onClick={() => setFotoAmpliada(null)}
            style={{ position: 'fixed', top: 18, right: 18, width: 40, height: 40, borderRadius: '50%', background: 'rgba(255,255,255,.12)', border: '1px solid rgba(255,255,255,.22)', display: 'grid', placeItems: 'center', cursor: 'pointer' }}>
            <Icono n="equis" s={20} c="#fff" />
          </button>
        </div>
      ) : null}

      <div className="tarjeta-cab" style={{ marginBottom: 16 }}>
        <div>
          <h3 style={{ fontSize: 18 }}>Comparativo de ofertas</h3>
          <div className="mini" style={{ marginTop: 4 }}>Ingresa hasta 6 propuestas por partida. El sistema marca la más económica y la de mejor relación valor/precio.</div>
        </div>
        <button className="btn btn-p btn-sm" onClick={() => setForm(licVacia(estado.proyectoActivo, (cats[0] || {}).id))}>
          <Icono n="mas" s={16} />Nuevo comparativo
        </button>
      </div>

      {lics.length === 0 ? (
        <div className="tarjeta">
          <Vacio icono="ofertas" titulo="Sin comparativos" texto="Crea uno para poner lado a lado las propuestas de tus proveedores."
            accion={<button className="btn btn-p" onClick={() => setForm(licVacia(estado.proyectoActivo, (cats[0] || {}).id))}><Icono n="mas" s={16} />Nuevo comparativo</button>} />
        </div>
      ) : (
        <div className="rejilla" style={{ gap: 14 }}>
          {lics.map((l) => {
            const r = E.compararOfertas(l);
            const cat = mapaCat[l.categoriaId];
            const expandida = abierta === l.id;
            return (
              <div className="tarjeta" key={l.id}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, alignItems: 'flex-start', flexWrap: 'wrap' }}>
                  <div style={{ display: 'flex', gap: 11, minWidth: 0, flex: 1 }}>
                    <div className="cat-icono"><Icono n={cat ? cat.icono : 'ofertas'} s={17} /></div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 15.5 }}>{l.titulo}</div>
                      <div className="mini">
                        {cat ? cat.nombre : 'Sin categoría'} · {E.num(l.cantidad).toLocaleString('es-NI')} {l.unidad} · {(l.ofertas || []).length} oferta(s)
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                    <button className="btn-icono" onClick={() => editarLic(l)}><Icono n="lapiz" s={17} /></button>
                    <button className="btn-icono" onClick={() => borrarLic(l)}><Icono n="basura" s={17} /></button>
                    <button className="btn btn-sm" onClick={() => setAbierta(expandida ? null : l.id)}>
                      <Icono n={expandida ? 'abajo' : 'derecha'} s={15} />{expandida ? 'Ocultar' : 'Comparar'}
                    </button>
                  </div>
                </div>

                {r.resumen ? (
                  <div className="rejilla" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(130px,1fr))', gap: 10, marginTop: 15 }}>
                    <div style={{ background: 'var(--panel-2)', borderRadius: 10, padding: '10px 12px' }}>
                      <div className="mini">Más económica</div>
                      <div style={{ fontWeight: 700, fontSize: 13.5, marginTop: 3 }}>{r.resumen.economica.proveedor}</div>
                      <div className="mono pos" style={{ fontSize: 13 }}>{dinero(r.resumen.minTotal, true)}</div>
                    </div>
                    <div style={{ background: 'var(--panel-2)', borderRadius: 10, padding: '10px 12px' }}>
                      <div className="mini">Mejor valor</div>
                      <div style={{ fontWeight: 700, fontSize: 13.5, marginTop: 3 }}>{r.resumen.mejorValor.proveedor}</div>
                      <div className="mono" style={{ fontSize: 13, color: 'var(--ambar)' }}>{r.resumen.mejorValor.puntaje} pts</div>
                    </div>
                    <div style={{ background: 'var(--panel-2)', borderRadius: 10, padding: '10px 12px' }}>
                      <div className="mini">Brecha de precio</div>
                      <div className="mono" style={{ fontWeight: 700, fontSize: 13.5, marginTop: 3 }}>{dinero(r.resumen.rango, true)}</div>
                      <div className="mini">{r.resumen.rangoPct}% entre extremos</div>
                    </div>
                    <div style={{ background: 'var(--panel-2)', borderRadius: 10, padding: '10px 12px' }}>
                      <div className="mini">Adjudicada</div>
                      <div style={{ fontWeight: 700, fontSize: 13.5, marginTop: 3 }}>{r.resumen.adjudicada ? r.resumen.adjudicada.proveedor : 'Pendiente'}</div>
                      {r.resumen.adjudicada ? (
                        <div className={'mono ' + (r.resumen.sobreprecioAdjudicada > 0 ? 'neg' : 'pos')} style={{ fontSize: 13 }}>
                          {r.resumen.sobreprecioAdjudicada > 0 ? '+' + dinero(r.resumen.sobreprecioAdjudicada, true) : 'la más barata'}
                        </div>
                      ) : <div className="mini">sin decidir</div>}
                    </div>
                  </div>
                ) : (
                  <div className="aviso a-info" style={{ marginTop: 14 }}>
                    <Icono n="info" s={17} /><span>Este comparativo aún no tiene ofertas con precio.</span>
                  </div>
                )}

                {expandida && r.resumen ? (
                  <React.Fragment>
                    <div className="sep" />
                    <div className="tabla-cont">
